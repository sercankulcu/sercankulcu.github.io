<script src="deck/sim.js"></script>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const els = {
    size: $("arr-size"),
    create: $("arr-create"),
    shuffle: $("arr-shuffle"),
    clear: $("arr-clear"),
    index: $("arr-index"),
    value: $("arr-value"),
    access: $("arr-access"),
    set: $("arr-set"),
    insert: $("arr-insert"),
    del: $("arr-delete"),
    searchValue: $("arr-search"),
    search: $("arr-search-btn"),
    traverse: $("arr-traverse"),
    reverse: $("arr-reverse"),
    sort: $("arr-sort"),
    cancel: $("arr-cancel"),
    view: $("arr-view"),
    status: $("arr-status"),
    operation: $("stat-operation"),
    comparisons: $("stat-comparisons"),
    swaps: $("stat-swaps"),
    length: $("stat-length")
  };

  let data = [];
  let token = 0;
  let running = false;
  let comparisons = 0;
  let swaps = 0;
  let snapshot = null;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function setStatus(text, type = "") {
    els.status.textContent = text;
    els.status.className = "sim-status" + (type ? " " + type : "");
  }

  function setOperation(name) {
    els.operation.textContent = name;
  }

  function updateStats() {
    els.comparisons.textContent = comparisons;
    els.swaps.textContent = swaps;
    els.length.textContent = data.length;
  }

  function resetStats(name = "Idle") {
    comparisons = 0;
    swaps = 0;
    setOperation(name);
    updateStats();
  }

  function validInteger(input) {
    const n = Number(input.value);
    return Number.isInteger(n) ? n : null;
  }

  function setRunning(value) {
    running = value;
    const controls = [
      els.create, els.shuffle, els.clear, els.access, els.set,
      els.insert, els.del, els.search, els.traverse, els.reverse, els.sort
    ];
    controls.forEach(b => b.disabled = value);
    els.cancel.disabled = !value;
  }

  function render(states = {}) {
    els.view.innerHTML = "";
    els.length.textContent = data.length;

    if (!data.length) {
      const empty = document.createElement("div");
      empty.className = "sim-empty";
      empty.textContent = "Array is empty.";
      els.view.appendChild(empty);
      return;
    }

    data.forEach((value, i) => {
      const wrap = document.createElement("div");
      wrap.className = "sim-cell-wrap";

      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "sim-cell";
      cell.textContent = value;
      cell.title = "Index " + i;
      cell.dataset.index = i;

      if (states.checking?.includes(i)) cell.classList.add("checking");
      if (states.found?.includes(i)) cell.classList.add("found");
      if (states.selected?.includes(i)) cell.classList.add("selected");
      if (states.sorted?.includes(i)) cell.classList.add("sorted");
      if (states.moving?.includes(i)) cell.classList.add("moving");

      cell.addEventListener("click", () => {
        if (running) return;
        els.index.value = i;
        els.value.value = data[i];
        render({ selected: [i] });
        setStatus(`Index ${i} selected.`);
      });

      const index = document.createElement("div");
      index.className = "sim-index";
      index.textContent = i;

      wrap.append(cell, index);
      els.view.appendChild(wrap);
    });
  }

  async function pause(localToken) {
    await wait(280);
    if (localToken !== token) throw new Error("cancelled");
  }

  async function animateState(localToken, states, text) {
    if (text) setStatus(text);
    render(states);
    await pause(localToken);
  }

  function randomValue() {
    return Math.floor(Math.random() * 90) + 10;
  }

  function ensureArray() {
    if (!data.length) {
      setStatus("Create an array first.", "error");
      return false;
    }
    return true;
  }

  function begin(name) {
    token++;
    snapshot = data.slice();
    resetStats(name);
    setRunning(true);
    return token;
  }

  function end(localToken, message, type = "") {
    if (localToken !== token) return;
    setRunning(false);
    setOperation("Idle");
    setStatus(message, type);
    render();
  }

  function fail(localToken, err) {
    if (err?.message === "cancelled") return;
    if (localToken !== token) return;
    setRunning(false);
    setOperation("Idle");
    setStatus("Operation stopped.", "error");
    render();
  }

  function createRandom() {
    token++;
    const size = Math.max(1, Math.min(12, Math.floor(Number(els.size.value)) || 8));
    els.size.value = size;
    data = Array.from({ length: size }, randomValue);
    resetStats();
    setRunning(false);
    render();
    setStatus(`Created ${size} elements.`, "success");
  }

  function shuffle() {
    if (!ensureArray()) return;
    token++;
    for (let i = data.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [data[i], data[j]] = [data[j], data[i]];
    }
    resetStats();
    render();
    setStatus("Array shuffled.", "success");
  }

  function clearArray() {
    token++;
    data = [];
    resetStats();
    setRunning(false);
    render();
    setStatus("Array cleared.");
  }

  async function access() {
    if (!ensureArray()) return;
    const i = validInteger(els.index);
    if (i === null || i < 0 || i >= data.length) {
      setStatus("Index is out of range.", "error");
      return;
    }
    const t = begin("Access");
    try {
      await animateState(t, { found: [i] }, `Accessing index ${i}: ${data[i]}`);
      end(t, `Value at index ${i} is ${data[i]}.`, "success");
    } catch (e) { fail(t, e); }
  }

  async function setValue() {
    if (!ensureArray()) return;
    const i = validInteger(els.index);
    const v = validInteger(els.value);
    if (i === null || i < 0 || i >= data.length) {
      setStatus("Index is out of range.", "error");
      return;
    }
    if (v === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }
    const t = begin("Set");
    try {
      await animateState(t, { selected: [i] }, `Updating index ${i}...`);
      data[i] = v;
      await animateState(t, { found: [i] }, `Index ${i} = ${v}`);
      end(t, `Index ${i} updated.`, "success");
    } catch (e) { fail(t, e); }
  }

  async function insertValue() {
    if (data.length >= 12) {
      setStatus("Maximum 12 elements.", "error");
      return;
    }
    const i = validInteger(els.index);
    const v = validInteger(els.value);
    if (i === null || i < 0 || i > data.length) {
      setStatus(`Index must be between 0 and ${data.length}.`, "error");
      return;
    }
    if (v === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin("Insert");
    try {
      data.push(v);
      for (let k = data.length - 1; k > i; k--) {
        data[k] = data[k - 1];
        swaps++;
        updateStats();
        await animateState(t, { checking: [k - 1], moving: [k] }, `Shifting index ${k - 1} → ${k}`);
      }
      data[i] = v;
      await animateState(t, { found: [i] }, `Inserted ${v} at index ${i}.`);
      end(t, `Inserted ${v} at index ${i}.`, "success");
    } catch (e) { fail(t, e); }
  }

  async function deleteValue() {
    if (!ensureArray()) return;
    const i = validInteger(els.index);
    if (i === null || i < 0 || i >= data.length) {
      setStatus("Index is out of range.", "error");
      return;
    }

    const removed = data[i];
    const t = begin("Delete");
    try {
      await animateState(t, { found: [i] }, `Deleting index ${i}...`);
      for (let k = i; k < data.length - 1; k++) {
        data[k] = data[k + 1];
        swaps++;
        updateStats();
        await animateState(t, { checking: [k + 1], moving: [k] }, `Shifting index ${k + 1} → ${k}`);
      }
      data.pop();
      render();
      end(t, `Deleted ${removed} from index ${i}.`, "success");
    } catch (e) { fail(t, e); }
  }

  async function linearSearch() {
    if (!ensureArray()) return;
    const target = validInteger(els.searchValue);
    if (target === null) {
      setStatus("Enter an integer to search.", "error");
      return;
    }

    const t = begin("Linear Search");
    try {
      for (let i = 0; i < data.length; i++) {
        comparisons++;
        updateStats();
        await animateState(t, { checking: [i] }, `Comparing index ${i} with ${target}`);
        if (data[i] === target) {
          await animateState(t, { found: [i] }, `Found ${target} at index ${i}.`);
          end(t, `Found ${target} at index ${i}.`, "success");
          return;
        }
      }
      end(t, `${target} not found.`, "error");
    } catch (e) { fail(t, e); }
  }

  async function traverse() {
    if (!ensureArray()) return;
    const t = begin("Traverse");
    try {
      for (let i = 0; i < data.length; i++) {
        await animateState(t, { checking: [i] }, `Visiting index ${i}: ${data[i]}`);
      }
      end(t, "Traversal complete.", "success");
    } catch (e) { fail(t, e); }
  }

  async function reverseArray() {
    if (!ensureArray()) return;
    const t = begin("Reverse");
    try {
      let left = 0, right = data.length - 1;
      while (left < right) {
        await animateState(t, { checking: [left, right] }, `Swapping index ${left} and ${right}`);
        [data[left], data[right]] = [data[right], data[left]];
        swaps++;
        updateStats();
        render({ found: [left, right] });
        await pause(t);
        left++;
        right--;
      }
      end(t, "Array reversed.", "success");
    } catch (e) { fail(t, e); }
  }

  async function bubbleSort() {
    if (!ensureArray()) return;
    const t = begin("Bubble Sort");
    try {
      const sorted = [];
      for (let endIndex = data.length - 1; endIndex > 0; endIndex--) {
        let changed = false;
        for (let i = 0; i < endIndex; i++) {
          comparisons++;
          updateStats();
          await animateState(t, { checking: [i, i + 1], sorted }, `Comparing ${data[i]} and ${data[i + 1]}`);
          if (data[i] > data[i + 1]) {
            [data[i], data[i + 1]] = [data[i + 1], data[i]];
            swaps++;
            changed = true;
            updateStats();
            render({ found: [i, i + 1], sorted });
            setStatus(`Swapped index ${i} and ${i + 1}`);
            await pause(t);
          }
        }
        sorted.push(endIndex);
        render({ sorted });
        if (!changed) break;
      }
      render({ sorted: data.map((_, i) => i) });
      await pause(t);
      end(t, "Array sorted.", "success");
    } catch (e) { fail(t, e); }
  }

  function cancel() {
    if (!running) return;
    token++;
    /* iptal: yarım kalan kaydırma/takas bırakılmaz, dizi işlem öncesine döner */
    const changed = snapshot && snapshot.join(",") !== data.join(",");
    if (snapshot) data = snapshot;
    snapshot = null;
    setRunning(false);
    setOperation("Idle");
    render();
    setStatus(changed ? "Animation cancelled; array restored." : "Animation cancelled.");
  }

  els.create.addEventListener("click", createRandom);
  els.shuffle.addEventListener("click", shuffle);
  els.clear.addEventListener("click", clearArray);
  els.access.addEventListener("click", access);
  els.set.addEventListener("click", setValue);
  els.insert.addEventListener("click", insertValue);
  els.del.addEventListener("click", deleteValue);
  els.search.addEventListener("click", linearSearch);
  els.traverse.addEventListener("click", traverse);
  els.reverse.addEventListener("click", reverseArray);
  els.sort.addEventListener("click", bubbleSort);
  els.cancel.addEventListener("click", cancel);


  els.cancel.disabled = true;
  createRandom();
})();
</script>
