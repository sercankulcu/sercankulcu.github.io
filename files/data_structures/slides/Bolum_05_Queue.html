<style>
.queue-sim,
.queue-sim *,
.queue-sim *::before,
.queue-sim *::after { box-sizing: border-box; }

.queue-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--sim-text);
  font-family: inherit;
  overflow: hidden;
}

.queue-shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
}

.queue-title {
  margin: 0;
  color: var(--sim-text);
  text-align: center;
  font-size: 1.45rem;
  line-height: 1.15;
}

.queue-controls {
  display: grid;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-softer);
}

.queue-row {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 5px;
  align-items: end;
}

.queue-field {
  display: grid;
  grid-column: span 2;
  gap: 2px;
  min-width: 0;
}

.queue-field label {
  display: block;
  margin: 0 !important;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.queue-field input {
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 3px 6px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-bg);
  color: var(--sim-text);
  font: inherit;
  line-height: 1;
  vertical-align: top;
}

.queue-btn {
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 0 7px;
  border: 1px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-accent);
  color: #fff;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: end;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease, filter .12s ease;
}

.queue-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.queue-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.queue-btn.success {
  background: var(--sim-ok);
  border-color: var(--sim-ok);
}

.queue-btn.danger {
  background: var(--sim-danger);
  border-color: var(--sim-danger);
}

.span2 { grid-column: span 2; }

.queue-stage {
  min-height: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-bg);
  overflow: hidden;
}

.queue-labels {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 10px 4px;
  color: var(--sim-accent);
  font-size: 10px;
  font-weight: 800;
}

.queue-track-wrap {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px;
}

.queue-track {
  width: 100%;
  min-height: 170px;
  padding: 16px 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  overflow: hidden;
  border: 4px solid color-mix(in srgb, var(--sim-accent) 78%, var(--sim-border));
  border-left-width: 10px;
  border-right-width: 10px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--sim-accent) 5%, var(--sim-bg));
}

.queue-item {
  flex: 1 1 0;
  min-width: 58px;
  max-width: 84px;
  min-height: 74px;
  padding: 6px;
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  border: 2px solid var(--sim-accent);
  border-radius: 8px;
  background: var(--sim-soft);
  font-size: 13px;
  font-weight: 800;
  transition: transform .18s ease, opacity .18s ease, background .18s ease, border-color .18s ease;
}

.queue-item small {
  font-size: 9px;
  font-weight: 700;
  opacity: .55;
}

.queue-item.checking {
  background: #fef3c7;
  border-color: var(--sim-warn);
  color: #4a3100;
  transform: translateY(-4px);
}

.queue-item.found {
  background: #dcfce7;
  border-color: var(--sim-ok);
  color: #14532d;
  transform: translateY(-4px) scale(1.03);
}

.queue-item.removing {
  background: #fee2e2;
  border-color: var(--sim-danger);
  color: #7f1d1d;
  transform: translateX(-8px);
  opacity: .65;
}

.queue-item.adding {
  background: #dcfce7;
  border-color: var(--sim-ok);
  color: #14532d;
  transform: translateX(4px);
}

.queue-empty {
  width: 100%;
  text-align: center;
  font-size: 12px;
  opacity: .55;
}

.queue-status {
  min-height: 34px;
  padding: 7px 10px;
  border-top: 1px solid var(--sim-border);
  background: var(--sim-softer);
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
}

.queue-status.success { color: var(--sim-ok); }
.queue-status.error { color: var(--sim-danger); }
.queue-status.warning { color: var(--sim-warn); }

.queue-footer {
  display: grid;
  grid-template-columns: 1.5fr repeat(3, .8fr);
  gap: 5px;
}

.queue-stat {
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid var(--sim-border);
  border-radius: 7px;
  background: var(--sim-softer);
  font-size: 10.5px;
  line-height: 1.2;
}

.queue-stat strong {
  display: block;
  margin-bottom: 2px;
  font-size: 9px;
  opacity: .6;
  text-transform: uppercase;
  letter-spacing: .03em;
}

@media (max-width: 700px) {
  .queue-sim {
    width: calc(100vw - 10px);
    height: auto;
    min-height: 0;
    overflow: visible;
  }

  .queue-shell { grid-template-rows: auto; }
  .queue-row { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .queue-field, .span2 { grid-column: span 2; }
  .queue-track { min-height: 150px; overflow-x: auto; }
  .queue-item { flex: 0 0 68px; }
  .queue-footer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-height: 620px) and (min-width: 701px) {
  .queue-sim {
    height: calc(100vh - 48px);
    padding-top: 4px;
  }

  .queue-title { font-size: 1.25rem; }
  .queue-controls { padding: 6px; gap: 5px; }
  .queue-btn, .queue-field input { height: 28px; min-height: 28px; }
  .queue-track { min-height: 145px; padding-top: 10px; padding-bottom: 10px; }
  .queue-item { min-height: 62px; }
  .queue-status { min-height: 29px; padding: 5px 8px; }
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .queue-item.checking {
    background: #451a03;
    color: #fef3c7;
    border-color: #f59e0b;
  }

  :root:not([data-theme="light"]) .queue-item.found,
  :root:not([data-theme="light"]) .queue-item.adding {
    background: #052e16;
    color: #dcfce7;
    border-color: #22c55e;
  }

  :root:not([data-theme="light"]) .queue-item.removing {
    background: #450a0a;
    color: #fee2e2;
    border-color: #ef4444;
  }
}

:root[data-theme="dark"] .queue-item.checking {
  background: #451a03;
  color: #fef3c7;
  border-color: #f59e0b;
}

:root[data-theme="dark"] .queue-item.found,
:root[data-theme="dark"] .queue-item.adding {
  background: #052e16;
  color: #dcfce7;
  border-color: #22c55e;
}

:root[data-theme="dark"] .queue-item.removing {
  background: #450a0a;
  color: #fee2e2;
  border-color: #ef4444;
}

@media (prefers-reduced-motion: reduce) {
  .queue-sim *,
  .queue-sim *::before,
  .queue-sim *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
  }
}
</style>

<div class="queue-sim">
  <div class="queue-shell">
    <h1 class="queue-title">Queue Simulator</h1>

    <div class="queue-controls">
      <div class="queue-row">
        <div class="queue-field">
          <label for="queue-value">Value</label>
          <input id="queue-value" type="number" value="50" inputmode="numeric">
        </div>
        <button class="queue-btn success span2" id="queue-enqueue" type="button">Enqueue</button>
        <button class="queue-btn success span2" id="queue-random" type="button">Enqueue Random</button>
        <button class="queue-btn danger span2" id="queue-dequeue" type="button">Dequeue</button>
        <button class="queue-btn span2" id="queue-front" type="button">Front</button>
        <button class="queue-btn span2" id="queue-rear" type="button">Rear</button>
      </div>

      <div class="queue-row">
        <div class="queue-field">
          <label for="queue-search-value">Search</label>
          <input id="queue-search-value" type="number" value="50" inputmode="numeric">
        </div>
        <button class="queue-btn span2" id="queue-search" type="button">Search</button>
        <button class="queue-btn success span2" id="queue-fill" type="button">Fill Example</button>
        <button class="queue-btn span2" id="queue-empty-check" type="button">Is Empty?</button>
        <button class="queue-btn danger span2" id="queue-clear" type="button">Clear</button>
        <button class="queue-btn danger span2" id="queue-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="queue-stage">
      <div class="queue-labels">
        <span>FRONT</span>
        <span>REAR</span>
      </div>

      <div class="queue-track-wrap">
        <div class="queue-track" id="queue-track"></div>
      </div>

      <div class="queue-status" id="queue-status" aria-live="polite">Ready.</div>
    </div>

    <div class="queue-footer">
      <div class="queue-stat"><strong>Operation</strong><span id="queue-operation">Idle</span></div>
      <div class="queue-stat"><strong>Checked</strong><span id="queue-checks">0</span></div>
      <div class="queue-stat"><strong>Changes</strong><span id="queue-changes">0</span></div>
      <div class="queue-stat"><strong>Size</strong><span id="queue-size">0 / 8</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    value: $("queue-value"),
    searchValue: $("queue-search-value"),
    enqueue: $("queue-enqueue"),
    random: $("queue-random"),
    dequeue: $("queue-dequeue"),
    front: $("queue-front"),
    rear: $("queue-rear"),
    search: $("queue-search"),
    fill: $("queue-fill"),
    emptyCheck: $("queue-empty-check"),
    clear: $("queue-clear"),
    cancel: $("queue-cancel"),
    track: $("queue-track"),
    status: $("queue-status"),
    operation: $("queue-operation"),
    checks: $("queue-checks"),
    changes: $("queue-changes"),
    size: $("queue-size")
  };

  const MAX = 8;
  const DELAY = 280;

  let queue = [24, 51, 18, 73];
  let token = 0;
  let running = false;
  let checks = 0;
  let changes = 0;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function integer(input) {
    const value = Number(input.value);
    return Number.isInteger(value) ? value : null;
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "queue-status" + (type ? " " + type : "");
  }

  function updateStats() {
    el.checks.textContent = checks;
    el.changes.textContent = changes;
    el.size.textContent = `${queue.length} / ${MAX}`;
  }

  function resetStats(operation = "Idle") {
    checks = 0;
    changes = 0;
    el.operation.textContent = operation;
    updateStats();
  }

  function setRunning(value) {
    running = value;
    [
      el.enqueue, el.random, el.dequeue, el.front, el.rear,
      el.search, el.fill, el.emptyCheck, el.clear
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function render(states = {}) {
    el.track.innerHTML = "";

    if (!queue.length) {
      const empty = document.createElement("div");
      empty.className = "queue-empty";
      empty.textContent = "Queue is empty.";
      el.track.appendChild(empty);
      updateStats();
      return;
    }

    queue.forEach((value, index) => {
      const item = document.createElement("div");
      item.className = "queue-item";

      if (states.checking?.includes(index)) item.classList.add("checking");
      if (states.found?.includes(index)) item.classList.add("found");
      if (states.removing?.includes(index)) item.classList.add("removing");
      if (states.adding?.includes(index)) item.classList.add("adding");

      const main = document.createElement("span");
      main.textContent = value;

      const small = document.createElement("small");
      if (queue.length === 1) {
        small.textContent = "FRONT / REAR";
      } else if (index === 0) {
        small.textContent = "FRONT";
      } else if (index === queue.length - 1) {
        small.textContent = "REAR";
      } else {
        small.textContent = `#${index}`;
      }

      item.append(main, small);
      el.track.appendChild(item);
    });

    updateStats();
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  async function animate(localToken, states, message) {
    if (message) setStatus(message);
    render(states);
    await pause(localToken);
  }

  function begin(operation) {
    token++;
    resetStats(operation);
    setRunning(true);
    return token;
  }

  function finish(localToken, message, type = "") {
    if (localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  function hasSpace() {
    if (queue.length >= MAX) {
      setStatus(`Queue overflow: maximum ${MAX} items.`, "error");
      return false;
    }
    return true;
  }

  function hasItems() {
    if (!queue.length) {
      setStatus("Queue underflow: queue is empty.", "error");
      return false;
    }
    return true;
  }

  async function enqueueValue(value, operation = "Enqueue") {
    if (!hasSpace()) return;
    if (!Number.isInteger(value)) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin(operation);

    try {
      queue.push(value);
      changes++;
      updateStats();
      await animate(
        t,
        { adding: [queue.length - 1] },
        `Adding ${value} at REAR...`
      );
      finish(t, `Enqueued ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function enqueue() {
    enqueueValue(integer(el.value));
  }

  function enqueueRandom() {
    enqueueValue(Math.floor(Math.random() * 90) + 10, "Enqueue Random");
  }

  async function dequeue() {
    if (!hasItems()) return;

    const value = queue[0];
    const t = begin("Dequeue");

    try {
      await animate(t, { removing: [0] }, `Removing FRONT value ${value}...`);
      queue.shift();
      changes++;
      updateStats();
      finish(t, `Dequeued ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function showFront() {
    if (!hasItems()) return;

    const value = queue[0];
    const t = begin("Front");

    try {
      checks++;
      updateStats();
      await animate(t, { found: [0] }, `FRONT = ${value}`);
      finish(t, `Front value is ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function showRear() {
    if (!hasItems()) return;

    const index = queue.length - 1;
    const value = queue[index];
    const t = begin("Rear");

    try {
      checks++;
      updateStats();
      await animate(t, { found: [index] }, `REAR = ${value}`);
      finish(t, `Rear value is ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function search() {
    if (!hasItems()) return;

    const target = integer(el.searchValue);
    if (target === null) {
      setStatus("Enter an integer to search.", "error");
      return;
    }

    const t = begin("Search");

    try {
      for (let i = 0; i < queue.length; i++) {
        checks++;
        updateStats();
        await animate(t, { checking: [i] }, `Comparing ${queue[i]} with ${target}...`);

        if (queue[i] === target) {
          await animate(t, { found: [i] }, `Found ${target} at position ${i} from FRONT.`);
          finish(t, `Found ${target} at position ${i} from FRONT.`, "success");
          return;
        }
      }

      finish(t, `${target} not found.`, "error");
    } catch (error) {
      fail(t, error);
    }
  }

  async function fillExample() {
    const example = [12, 27, 35, 48, 63, 79];
    const t = begin("Fill Example");

    try {
      queue = [];
      changes = 0;
      render();

      for (const value of example) {
        queue.push(value);
        changes++;
        updateStats();
        await animate(
          t,
          { adding: [queue.length - 1] },
          `Enqueue ${value}...`
        );
      }

      finish(t, "Example queue loaded.", "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function isEmpty() {
    token++;
    resetStats("Is Empty?");
    setRunning(false);
    render();

    if (queue.length === 0) {
      setStatus("Yes. The queue is empty.", "success");
    } else {
      setStatus(`No. The queue contains ${queue.length} item(s).`);
    }

    el.operation.textContent = "Idle";
  }

  function clearQueue() {
    token++;
    queue = [];
    resetStats();
    setRunning(false);
    render();
    setStatus("Queue cleared.");
  }

  function cancel() {
    if (!running) return;
    token++;
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  el.enqueue.addEventListener("click", enqueue);
  el.random.addEventListener("click", enqueueRandom);
  el.dequeue.addEventListener("click", dequeue);
  el.front.addEventListener("click", showFront);
  el.rear.addEventListener("click", showRear);
  el.search.addEventListener("click", search);
  el.fill.addEventListener("click", fillExample);
  el.emptyCheck.addEventListener("click", isEmpty);
  el.clear.addEventListener("click", clearQueue);
  el.cancel.addEventListener("click", cancel);

  el.cancel.disabled = true;
  resetStats();
  render();
})();
</script>
