<script src="deck/sim.js"></script>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    value: $("queue-value"),
    searchValue: $("queue-search-value"),
    enqueue: $("queue-enqueue"),
    random: $("queue-random"),
    dequeue: $("queue-dequeue"),
    front: $("queue-front"),
    rear: $("queue-rear"),
    search: $("queue-search"),
    fill: $("queue-fill"),
    emptyCheck: $("queue-empty-check"),
    clear: $("queue-clear"),
    cancel: $("queue-cancel"),
    track: $("queue-track"),
    status: $("queue-status"),
    operation: $("queue-operation"),
    checks: $("queue-checks"),
    changes: $("queue-changes"),
    size: $("queue-size")
  };

  const MAX = 8;
  const DELAY = 280;

  let queue = [24, 51, 18, 73];
  let token = 0;
  let running = false;
  let checks = 0;
  let changes = 0;
  let cancelHook = null;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function integer(input) {
    if (String(input.value).trim() === "") return null;
    const value = Number(input.value);
    return Number.isInteger(value) ? value : null;
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "queue-status" + (type ? " " + type : "");
  }

  function updateStats() {
    el.checks.textContent = checks;
    el.changes.textContent = changes;
    el.size.textContent = `${queue.length} / ${MAX}`;
  }

  function resetStats(operation = "Idle") {
    checks = 0;
    changes = 0;
    el.operation.textContent = operation;
    updateStats();
  }

  function setRunning(value) {
    running = value;
    [
      el.enqueue, el.random, el.dequeue, el.front, el.rear,
      el.search, el.fill, el.emptyCheck, el.clear
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function render(states = {}) {
    el.track.innerHTML = "";

    if (!queue.length) {
      const empty = document.createElement("div");
      empty.className = "queue-empty";
      empty.textContent = "Queue is empty.";
      el.track.appendChild(empty);
      updateStats();
      return;
    }

    queue.forEach((value, index) => {
      const item = document.createElement("div");
      item.className = "queue-item";

      if (states.checking?.includes(index)) item.classList.add("checking");
      if (states.found?.includes(index)) item.classList.add("found");
      if (states.removing?.includes(index)) item.classList.add("removing");
      if (states.adding?.includes(index)) item.classList.add("adding");

      const main = document.createElement("span");
      main.textContent = value;

      const small = document.createElement("small");
      if (queue.length === 1) {
        small.textContent = "FRONT / REAR";
      } else if (index === 0) {
        small.textContent = "FRONT";
      } else if (index === queue.length - 1) {
        small.textContent = "REAR";
      } else {
        small.textContent = `#${index}`;
      }

      item.append(main, small);
      el.track.appendChild(item);
    });

    updateStats();
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  async function animate(localToken, states, message) {
    if (message) setStatus(message);
    render(states);
    await pause(localToken);
  }

  function begin(operation) {
    token++;
    resetStats(operation);
    setRunning(true);
    return token;
  }

  function finish(localToken, message, type = "") {
    if (localToken !== token) return;
    cancelHook = null;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    cancelHook = null;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  function hasSpace() {
    if (queue.length >= MAX) {
      setStatus(`Queue overflow: maximum ${MAX} items.`, "error");
      return false;
    }
    return true;
  }

  function hasItems() {
    if (!queue.length) {
      setStatus("Queue underflow: queue is empty.", "error");
      return false;
    }
    return true;
  }

  async function enqueueValue(value, operation = "Enqueue") {
    if (!hasSpace()) return;
    if (!Number.isInteger(value)) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin(operation);

    try {
      queue.push(value);
      changes++;
      updateStats();
      await animate(
        t,
        { adding: [queue.length - 1] },
        `Adding ${value} at REAR...`
      );
      finish(t, `Enqueued ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function enqueue() {
    enqueueValue(integer(el.value));
  }

  function enqueueRandom() {
    enqueueValue(Math.floor(Math.random() * 90) + 10, "Enqueue Random");
  }

  async function dequeue() {
    if (!hasItems()) return;

    const value = queue[0];
    const t = begin("Dequeue");

    try {
      await animate(t, { removing: [0] }, `Removing FRONT value ${value}...`);
      queue.shift();
      changes++;
      updateStats();
      finish(t, `Dequeued ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function showFront() {
    if (!hasItems()) return;

    const value = queue[0];
    const t = begin("Front");

    try {
      checks++;
      updateStats();
      await animate(t, { found: [0] }, `FRONT = ${value}`);
      finish(t, `Front value is ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function showRear() {
    if (!hasItems()) return;

    const index = queue.length - 1;
    const value = queue[index];
    const t = begin("Rear");

    try {
      checks++;
      updateStats();
      await animate(t, { found: [index] }, `REAR = ${value}`);
      finish(t, `Rear value is ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function search() {
    if (!hasItems()) return;

    const target = integer(el.searchValue);
    if (target === null) {
      setStatus("Enter an integer to search.", "error");
      return;
    }

    const t = begin("Search");

    try {
      for (let i = 0; i < queue.length; i++) {
        checks++;
        updateStats();
        await animate(t, { checking: [i] }, `Comparing ${queue[i]} with ${target}...`);

        if (queue[i] === target) {
          await animate(t, { found: [i] }, `Found ${target} at position ${i} from FRONT.`);
          finish(t, `Found ${target} at position ${i} from FRONT.`, "success");
          return;
        }
      }

      finish(t, `${target} not found.`, "error");
    } catch (error) {
      fail(t, error);
    }
  }

  async function fillExample() {
    const example = [12, 27, 35, 48, 63, 79];
    const t = begin("Fill Example");
    const previous = queue.slice();
    cancelHook = () => { queue = previous; changes = 0; };

    try {
      queue = [];
      changes = 0;
      render();

      for (const value of example) {
        queue.push(value);
        changes++;
        updateStats();
        await animate(
          t,
          { adding: [queue.length - 1] },
          `Enqueue ${value}...`
        );
      }

      finish(t, "Example queue loaded.", "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function isEmpty() {
    token++;
    resetStats("Is Empty?");
    setRunning(false);
    render();

    if (queue.length === 0) {
      setStatus("Yes. The queue is empty.", "success");
    } else {
      setStatus(`No. The queue contains ${queue.length} item(s).`);
    }

    el.operation.textContent = "Idle";
  }

  function clearQueue() {
    token++;
    queue = [];
    resetStats();
    setRunning(false);
    render();
    setStatus("Queue cleared.");
  }

  function cancel() {
    if (!running) return;
    token++;
    if (cancelHook) cancelHook();
    cancelHook = null;
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  el.enqueue.addEventListener("click", enqueue);
  el.random.addEventListener("click", enqueueRandom);
  el.dequeue.addEventListener("click", dequeue);
  el.front.addEventListener("click", showFront);
  el.rear.addEventListener("click", showRear);
  el.search.addEventListener("click", search);
  el.fill.addEventListener("click", fillExample);
  el.emptyCheck.addEventListener("click", isEmpty);
  el.clear.addEventListener("click", clearQueue);
  el.cancel.addEventListener("click", cancel);

  el.cancel.disabled = true;
  resetStats();
  render();
})();
</script>
