<style>
.bst-sim,
.bst-sim *,

.bst-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;
  --sim-visit: #7c3aed;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--sim-text);
  font-family: inherit;
  overflow: hidden;
}

.bst-shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
}

.bst-title {
  margin: 0;
  color: var(--sim-text);
  text-align: center;
  font-size: 1.45rem;
  line-height: 1.15;
}

.bst-controls {
  display: grid;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-softer);
}

.bst-row {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 5px;
  align-items: end;
}

.bst-field {
  display: grid;
  grid-column: span 2;
  gap: 2px;
  min-width: 0;
}

.bst-field label {
  display: block;
  margin: 0 !important;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.bst-field input {
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 3px 6px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-bg);
  color: var(--sim-text);
  font: inherit;
  line-height: 1;
  vertical-align: top;
}

.bst-btn {
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 0 6px;
  border: 1px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-accent);
  color: #fff;
  font: inherit;
  font-size: 10.3px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: end;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease, filter .12s ease;
}

.bst-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.bst-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.bst-btn.success {
  background: var(--sim-ok);
  border-color: var(--sim-ok);
}

.bst-btn.danger {
  background: var(--sim-danger);
  border-color: var(--sim-danger);
}

.span2 { grid-column: span 2; }

.bst-stage {
  min-height: 0;
  display: grid;
  grid-template-rows: 1fr auto;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-bg);
  overflow: hidden;
}

.bst-canvas {
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at center, color-mix(in srgb, var(--sim-accent) 3%, transparent), transparent 65%);
}

.bst-svg {
  display: block;
  width: 100%;
  height: 100%;

}

.bst-edge {

}

.bst-edge.active {

}

.bst-node circle {

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";

  const el = {
    value: $("bst-value"),
    insert: $("bst-insert"),
    search: $("bst-search"),
    del: $("bst-delete"),
    min: $("bst-min"),
    max: $("bst-max"),
    inorder: $("bst-inorder"),
    preorder: $("bst-preorder"),
    postorder: $("bst-postorder"),
    levelorder: $("bst-levelorder"),
    load: $("bst-load"),
    random: $("bst-random"),
    reset: $("bst-reset"),
    cancel: $("bst-cancel"),
    svg: $("bst-svg"),
    status: $("bst-status"),
    operation: $("bst-operation"),
    nodes: $("bst-nodes"),
    height: $("bst-height"),
    leaves: $("bst-leaves"),
    path: $("bst-path"),
    result: $("bst-result")
  };

  const MAX_NODES = 12;
  const DELAY = 280;

  let root = null;
  let nextId = 1;
  let token = 0;
  let running = false;
  let pathLength = 0;
  let lastResult = "—";

  let marks = {
    checking: new Set(),
    found: new Set(),
    visited: new Set(),
    removing: new Set(),
    newNode: null,
    activeEdges: new Set()
  };

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function createNode(value, parent = null) {
    return {
      id: nextId++,
      value,
      parent,
      left: null,
      right: null
    };
  }

  function clearMarks() {
    marks.checking.clear();
    marks.found.clear();
    marks.visited.clear();
    marks.removing.clear();
    marks.newNode = null;
    marks.activeEdges.clear();
  }

  function allNodes(node = root, out = []) {
    if (!node) return out;
    out.push(node);
    allNodes(node.left, out);
    allNodes(node.right, out);
    return out;
  }

  function heightOf(node) {
    if (!node) return -1;
    return 1 + Math.max(heightOf(node.left), heightOf(node.right));
  }

  function leafCount(node = root) {
    if (!node) return 0;
    if (!node.left && !node.right) return 1;
    return leafCount(node.left) + leafCount(node.right);
  }

  function edgeKey(parent, child) {
    return `${parent.id}-${child.id}`;
  }

  function readValue() {
    const value = Number(el.value.value);
    return Number.isInteger(value) ? value : null;
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "bst-status" + (type ? " " + type : "");
  }

  function setRunning(value) {
    running = value;
    [
      el.insert, el.search, el.del, el.min, el.max,
      el.inorder, el.preorder, el.postorder, el.levelorder,
      el.load, el.random, el.reset
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function updateStats() {
    const nodes = allNodes();
    el.nodes.textContent = `${nodes.length} / ${MAX_NODES}`;
    el.height.textContent = root ? heightOf(root) : 0;
    el.leaves.textContent = root ? leafCount() : 0;
    el.path.textContent = pathLength;
    el.result.textContent = lastResult;
  }

  function layoutTree() {
    const positions = new Map();
    if (!root) return positions;

    const h = Math.max(1, heightOf(root));
    const topY = 30;
    const bottomY = 258;
    const gapY = h ? (bottomY - topY) / h : 0;

    function walk(node, depth, x, offset) {
      if (!node) return;

      positions.set(node.id, {
        x,
        y: topY + depth * gapY
      });

      const nextOffset = Math.max(22, offset / 2);

      // Important: left child is always drawn LEFT of its parent,
      // right child is always drawn RIGHT of its parent.
      if (node.left) {
        walk(node.left, depth + 1, x - offset, nextOffset);
      }

      if (node.right) {
        walk(node.right, depth + 1, x + offset, nextOffset);
      }
    }

    const firstOffset = Math.max(46, 185 - Math.max(0, h - 3) * 12);
    walk(root, 0, 370, firstOffset);

    return positions;
  }

  function svgElement(name, attrs = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function nodeClass(node) {
    const classes = ["bst-node"];

    if (marks.checking.has(node.id)) classes.push("checking");
    if (marks.found.has(node.id)) classes.push("found");
    if (marks.visited.has(node.id)) classes.push("visited");
    if (marks.removing.has(node.id)) classes.push("removing");
    if (marks.newNode === node.id) classes.push("new-node");

    return classes.join(" ");
  }

  function render() {
    el.svg.innerHTML = "";

    if (!root) {
      const text = svgElement("text", {
        x: 370,
        y: 145,
        "text-anchor": "middle",
        fill: "currentColor",
        opacity: ".55",
        "font-size": "14"
      });
      text.textContent = "Tree is empty.";
      el.svg.appendChild(text);
      updateStats();
      return;
    }

    const positions = layoutTree();
    const nodes = allNodes();

    const h = heightOf(root);
    for (let d = 0; d <= h; d++) {
      const atDepth = nodes.find(node => depthOf(node) === d);
      if (!atDepth) continue;
      const p = positions.get(atDepth.id);

      const label = svgElement("text", {
        x: 8,
        y: p.y + 3,
        class: "bst-depth-label"
      });
      label.textContent = `d${d}`;
      el.svg.appendChild(label);
    }

    nodes.forEach(parent => {
      const p = positions.get(parent.id);

      [parent.left, parent.right].forEach(child => {
        if (!child) return;

        const c = positions.get(child.id);
        const line = svgElement("line", {
          x1: p.x,
          y1: p.y + 19,
          x2: c.x,
          y2: c.y - 19,
          class: "bst-edge" +
            (marks.activeEdges.has(edgeKey(parent, child)) ? " active" : "")
        });

        el.svg.appendChild(line);
      });
    });

    nodes.forEach(node => {
      const p = positions.get(node.id);
      const group = svgElement("g", { class: nodeClass(node) });

      const circle = svgElement("circle", {
        cx: p.x,
        cy: p.y,
        r: 20
      });

      const text = svgElement("text", {
        x: p.x,
        y: p.y + 1
      });
      text.textContent = node.value;

      group.append(circle, text);
      el.svg.appendChild(group);
    });

    updateStats();
  }

  function depthOf(node) {
    let depth = 0;
    let current = node;
    while (current && current.parent) {
      depth++;
      current = current.parent;
    }
    return depth;
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  function begin(operation) {
    token++;
    pathLength = 0;
    lastResult = "—";
    clearMarks();
    el.operation.textContent = operation;
    setRunning(true);
    render();
    return token;
  }

  function finish(localToken, message, type = "") {
    if (localToken !== token) return;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  async function showPathStep(localToken, node, message, parent = null) {
    marks.checking.clear();
    marks.checking.add(node.id);

    if (parent) {
      marks.activeEdges.add(edgeKey(parent, node));
    }

    pathLength++;
    render();
    setStatus(message);
    await pause(localToken);
  }

  async function insertValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (allNodes().length >= MAX_NODES) {
      setStatus(`Maximum ${MAX_NODES} nodes.`, "error");
      return;
    }

    const t = begin("Insert");

    try {
      if (!root) {
        root = createNode(value);
        marks.newNode = root.id;
        lastResult = value;
        render();
        await pause(t);
        clearMarks();
        finish(t, `Inserted ${value} as root.`, "success");
        return;
      }

      let current = root;
      let parent = null;

      while (current) {
        await showPathStep(t, current, `Compare ${value} with ${current.value}.`, parent);

        if (value === current.value) {
          marks.checking.clear();
          marks.found.add(current.id);
          lastResult = "duplicate";
          render();
          await pause(t);
          clearMarks();
          finish(t, `${value} already exists.`, "error");
          return;
        }

        parent = current;
        current = value < current.value ? current.left : current.right;
      }

      const node = createNode(value, parent);

      if (value < parent.value) {
        parent.left = node;
      } else {
        parent.right = node;
      }

      clearMarks();
      marks.newNode = node.id;
      marks.activeEdges.add(edgeKey(parent, node));
      lastResult = value;
      render();
      await pause(t);

      clearMarks();
      finish(
        t,
        `Inserted ${value} ${value < parent.value ? "left" : "right"} of ${parent.value}.`,
        "success"
      );
    } catch (error) {
      fail(t, error);
    }
  }

  async function searchValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (!root) {
      setStatus("Tree is empty.", "error");
      return;
    }

    const t = begin("Search");

    try {
      let current = root;
      let parent = null;

      while (current) {
        await showPathStep(t, current, `Searching ${value}: checking ${current.value}.`, parent);

        if (value === current.value) {
          marks.checking.clear();
          marks.found.add(current.id);
          lastResult = value;
          render();
          await pause(t);
          clearMarks();
          finish(t, `Found ${value}.`, "success");
          return;
        }

        parent = current;
        current = value < current.value ? current.left : current.right;
      }

      clearMarks();
      lastResult = "not found";
      finish(t, `${value} not found.`, "error");
    } catch (error) {
      fail(t, error);
    }
  }

  function replaceNode(oldNode, newNode) {
    if (!oldNode.parent) {
      root = newNode;
    } else if (oldNode.parent.left === oldNode) {
      oldNode.parent.left = newNode;
    } else {
      oldNode.parent.right = newNode;
    }

    if (newNode) newNode.parent = oldNode.parent;
  }

  function minimumNode(node) {
    let current = node;
    while (current && current.left) current = current.left;
    return current;
  }

  async function deleteValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (!root) {
      setStatus("Tree is empty.", "error");
      return;
    }

    const t = begin("Delete");

    try {
      let current = root;
      let parent = null;

      while (current && current.value !== value) {
        await showPathStep(t, current, `Searching for ${value}...`, parent);
        parent = current;
        current = value < current.value ? current.left : current.right;
      }

      if (!current) {
        clearMarks();
        lastResult = "not found";
        finish(t, `${value} not found.`, "error");
        return;
      }

      await showPathStep(t, current, `Found ${value}. Preparing deletion...`, parent);
      marks.checking.clear();
      marks.removing.add(current.id);
      render();
      await pause(t);

      if (!current.left) {
        replaceNode(current, current.right);
      } else if (!current.right) {
        replaceNode(current, current.left);
      } else {
        let successorParent = current;
        let successor = current.right;

        while (successor.left) {
          successorParent = successor;
          successor = successor.left;

          marks.removing.clear();
          marks.checking.clear();
          marks.checking.add(successor.id);
          marks.activeEdges.add(edgeKey(successorParent, successor));
          pathLength++;
          render();
          setStatus(`Finding inorder successor: ${successor.value}.`);
          await pause(t);
        }

        const successorValue = successor.value;
        current.value = successorValue;

        if (successor.parent.left === successor) {
          successor.parent.left = successor.right;
        } else {
          successor.parent.right = successor.right;
        }

        if (successor.right) {
          successor.right.parent = successor.parent;
        }
      }

      clearMarks();
      lastResult = value;
      finish(t, `Deleted ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function findExtreme(kind) {
    if (!root) {
      setStatus("Tree is empty.", "error");
      return;
    }

    const t = begin(kind === "min" ? "Minimum" : "Maximum");

    try {
      let current = root;
      let parent = null;

      while (current) {
        await showPathStep(
          t,
          current,
          `${kind === "min" ? "Minimum" : "Maximum"}: checking ${current.value}.`,
          parent
        );

        const next = kind === "min" ? current.left : current.right;
        if (!next) break;
        parent = current;
        current = next;
      }

      marks.checking.clear();
      marks.found.add(current.id);
      lastResult = current.value;
      render();
      await pause(t);

      clearMarks();
      finish(
        t,
        `${kind === "min" ? "Minimum" : "Maximum"} value is ${current.value}.`,
        "success"
      );
    } catch (error) {
      fail(t, error);
    }
  }

  function inorder(node, out = []) {
    if (!node) return out;
    inorder(node.left, out);
    out.push(node);
    inorder(node.right, out);
    return out;
  }

  function preorder(node, out = []) {
    if (!node) return out;
    out.push(node);
    preorder(node.left, out);
    preorder(node.right, out);
    return out;
  }

  function postorder(node, out = []) {
    if (!node) return out;
    postorder(node.left, out);
    postorder(node.right, out);
    out.push(node);
    return out;
  }

  function levelOrder() {
    if (!root) return [];
    const out = [];
    const queue = [root];

    while (queue.length) {
      const node = queue.shift();
      out.push(node);
      if (node.left) queue.push(node.left);
      if (node.right) queue.push(node.right);
    }

    return out;
  }

  async function animateTraversal(order, name) {
    if (!root) {
      setStatus("Tree is empty.", "error");
      return;
    }

    const t = begin(name);

    try {
      const result = [];

      for (const node of order) {
        if (node.parent) {
          marks.activeEdges.add(edgeKey(node.parent, node));
        }

        marks.visited.add(node.id);
        pathLength++;
        result.push(node.value);
        lastResult = result.join(" → ");
        render();
        setStatus(`${name}: visiting ${node.value}...`);
        await pause(t);
      }

      clearMarks();
      lastResult = result.join(" → ");
      finish(t, `${name}: ${lastResult}`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function insertPlain(value) {
    if (!root) {
      root = createNode(value);
      return true;
    }

    let current = root;

    while (true) {
      if (value === current.value) return false;

      if (value < current.value) {
        if (!current.left) {
          current.left = createNode(value, current);
          return true;
        }
        current = current.left;
      } else {
        if (!current.right) {
          current.right = createNode(value, current);
          return true;
        }
        current = current.right;
      }
    }
  }

  function loadExample() {
    token++;
    running = false;
    root = null;
    nextId = 1;
    clearMarks();
    pathLength = 0;
    lastResult = "—";

    [50, 30, 70, 20, 40, 60, 80, 35, 65].forEach(insertPlain);

    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Example tree loaded.", "success");
  }

  function randomTree() {
    token++;
    running = false;
    root = null;
    nextId = 1;
    clearMarks();
    pathLength = 0;
    lastResult = "—";

    const values = new Set();

    while (values.size < 9) {
      values.add(Math.floor(Math.random() * 90) + 10);
    }

    [...values].forEach(insertPlain);

    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Random BST loaded.", "success");
  }

  function resetTree() {
    token++;
    running = false;
    root = null;
    nextId = 1;
    clearMarks();
    pathLength = 0;
    lastResult = "—";
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Tree cleared.");
  }

  function cancel() {
    if (!running) return;

    token++;
    running = false;
    clearMarks();
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  el.insert.addEventListener("click", insertValue);
  el.search.addEventListener("click", searchValue);
  el.del.addEventListener("click", deleteValue);
  el.min.addEventListener("click", () => findExtreme("min"));
  el.max.addEventListener("click", () => findExtreme("max"));
  el.inorder.addEventListener("click", () => animateTraversal(inorder(root), "Inorder"));
  el.preorder.addEventListener("click", () => animateTraversal(preorder(root), "Preorder"));
  el.postorder.addEventListener("click", () => animateTraversal(postorder(root), "Postorder"));
  el.levelorder.addEventListener("click", () => animateTraversal(levelOrder(), "Level Order"));
  el.load.addEventListener("click", loadExample);
  el.random.addEventListener("click", randomTree);
  el.reset.addEventListener("click", resetTree);
  el.cancel.addEventListener("click", cancel);

  el.cancel.disabled = true;
  loadExample();
})();
</script>
