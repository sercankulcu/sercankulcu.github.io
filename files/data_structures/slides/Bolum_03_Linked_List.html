<style>
.ll-sim, .ll-sim *, .ll-sim *::before, .ll-sim *::after { box-sizing: border-box; }
.ll-sim {
  --bg: var(--global-bg-color, #fff);
  --text: var(--global-text-color, #2f3437);
  --accent: var(--global-link-color, #2a7ae2);
  --border: var(--global-border-color, #d9dee3);
  --soft: color-mix(in srgb, var(--accent) 6%, var(--bg));
  --softer: color-mix(in srgb, var(--accent) 2.5%, var(--bg));
  --ok: #15803d;
  --warn: #d97706;
  --danger: #b91c1c;
  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--text);
  font-family: inherit;
  overflow: hidden;
}
.ll-sim button, .ll-sim input { font: inherit; }
.ll-shell { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; }
.ll-title { margin: 0; text-align: center; font-size: 1.45rem; line-height: 1.15; color: var(--text); }
.ll-controls { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--softer); }
.ll-row { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 5px; align-items: end; }
.ll-field { display: grid; gap: 2px; grid-column: span 2; }
.ll-field label { display:block; margin:0 !important; padding:0; font-size:11px; font-weight:700; line-height:1; }
.ll-field input { width:100%; height:31px; min-height:31px; margin:0 !important; padding:3px 6px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; line-height:1; vertical-align:top; }
.ll-btn { height:31px; min-height:31px; margin:0 !important; padding:0 7px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-size:11.5px; font-weight:700; line-height:1; cursor:pointer; white-space:nowrap; display:flex; align-items:center; justify-content:center; align-self:end; appearance:none; -webkit-appearance:none; transition:transform .12s ease, filter .12s ease; }
.ll-btn:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1px); }
.ll-btn:disabled { opacity:.45; cursor:not-allowed; }
.ll-btn.secondary { background:var(--accent); border-color:var(--accent); color:#fff; }
.ll-btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.ll-btn.success { background:var(--ok); border-color:var(--ok); color:#fff; }
.span2 { grid-column:span 2; } .span3 { grid-column:span 3; }
.ll-stage { min-height:0; display:grid; grid-template-rows:1fr auto; border:1px solid var(--border); border-radius:10px; background:var(--bg); overflow:hidden; }
.ll-canvas { min-height:0; display:flex; align-items:center; justify-content:center; padding:14px 10px 8px; overflow:hidden; }
.ll-list { width:100%; display:flex; align-items:center; justify-content:center; gap:clamp(3px,.6vw,6px); flex-wrap:nowrap; }
.ll-endpoint { flex:0 0 auto; padding:5px 7px; border:1.5px solid var(--accent); border-radius:6px; background:var(--soft); color:var(--accent); font-size:10px; font-weight:800; }
.ll-node-wrap { min-width:0; flex:1 1 0; max-width:94px; display:grid; gap:3px; justify-items:center; }
.ll-node { width:100%; min-width:58px; display:grid; grid-template-columns:minmax(34px,1fr) 28px; overflow:hidden; border:2px solid var(--accent); border-radius:7px; background:var(--soft); transition:transform .18s ease, background .18s ease, border-color .18s ease, opacity .18s ease; cursor:pointer; }
.ll-data, .ll-next { min-height:48px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(11px,1.7vw,15px); }
.ll-next { border-left:1.5px solid var(--accent); background:color-mix(in srgb, var(--accent) 9%, var(--bg)); color:var(--accent); font-size:10px; }
.ll-index { font-size:9.5px; font-weight:700; opacity:.58; }
.ll-arrow { flex:0 0 auto; color:var(--accent); font-size:20px; line-height:1; font-weight:800; }
.ll-node.checking { background:#fef3c7; border-color:var(--warn); color:#4a3100; transform:translateY(-5px) scale(1.03); }
.ll-node.found { background:#dcfce7; border-color:var(--ok); color:#14532d; transform:translateY(-5px) scale(1.04); }
.ll-node.selected { box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); transform:translateY(-4px); }
.ll-node.sorted { background:color-mix(in srgb, var(--ok) 13%, var(--bg)); border-color:var(--ok); }
.ll-node.moving { opacity:.4; transform:scale(.9); }
.ll-empty { font-size:13px; opacity:.55; text-align:center; }
.ll-status { min-height:31px; padding:7px 10px; border-top:1px solid var(--border); background:var(--softer); font-size:11.5px; font-weight:700; text-align:center; }
.ll-status.error { color:var(--danger); } .ll-status.success { color:var(--ok); }
.ll-footer { display:grid; grid-template-columns:1.7fr repeat(3,.75fr); gap:5px; }
.ll-stat { min-width:0; padding:5px 7px; border:1px solid var(--border); border-radius:7px; background:var(--softer); font-size:10.5px; line-height:1.2; }
.ll-stat strong { display:block; margin-bottom:2px; font-size:9px; opacity:.6; text-transform:uppercase; letter-spacing:.03em; }
@media (max-width:700px) {
  .ll-sim { width:calc(100vw - 10px); height:auto; min-height:0; overflow:visible; }
  .ll-shell { grid-template-rows:auto; }
  .ll-row { grid-template-columns:repeat(6,minmax(0,1fr)); }
  .ll-field,.span2 { grid-column:span 2; }
  .span3 { grid-column:span 3; }
  .ll-stage { min-height:230px; }
  .ll-list { flex-wrap:wrap; }
  .ll-node-wrap { flex:0 0 74px; }
  .ll-arrow { font-size:16px; }
}
@media (max-height:620px) and (min-width:701px) {
  .ll-sim { height:calc(100vh - 48px); padding-top:4px; }
  .ll-title { font-size:1.25rem; }
  .ll-controls { padding:6px; gap:5px; }
  .ll-btn,.ll-field input { height:28px; min-height:28px; }
  .ll-canvas { padding-top:8px; }
  .ll-status { min-height:27px; padding:5px 8px; }
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) .ll-node.checking { background:#451a03; color:#fef3c7; border-color:#f59e0b; }
  :root:not([data-theme="light"]) .ll-node.found { background:#052e16; color:#dcfce7; border-color:#22c55e; }
}
:root[data-theme="dark"] .ll-node.checking { background:#451a03; color:#fef3c7; border-color:#f59e0b; }
:root[data-theme="dark"] .ll-node.found { background:#052e16; color:#dcfce7; border-color:#22c55e; }
@media (prefers-reduced-motion:reduce) {
  .ll-sim *, .ll-sim *::before, .ll-sim *::after { transition-duration:.001ms !important; animation-duration:.001ms !important; }
}
</style>

<div class="ll-sim">
  <div class="ll-shell">
    <h1 class="ll-title">Linked List Simulator</h1>

    <div class="ll-controls">
      <div class="ll-row">
        <div class="ll-field"><label for="ll-value">Value</label><input id="ll-value" type="number" value="50" inputmode="numeric"></div>
        <button class="ll-btn success span2" id="ll-add-head" type="button">Add Head</button>
        <button class="ll-btn success span2" id="ll-add-tail" type="button">Add Tail</button>
        <button class="ll-btn danger span2" id="ll-remove-head" type="button">Remove Head</button>
        <button class="ll-btn danger span2" id="ll-remove-tail" type="button">Remove Tail</button>
        <button class="ll-btn danger span2" id="ll-clear" type="button">Clear</button>
      </div>

      <div class="ll-row">
        <div class="ll-field"><label for="ll-index">Index</label><input id="ll-index" type="number" min="0" value="0" inputmode="numeric"></div>
        <button class="ll-btn span2" id="ll-access" type="button">Access</button>
        <button class="ll-btn success span2" id="ll-add-index" type="button">Add at Index</button>
        <button class="ll-btn danger span2" id="ll-remove-index" type="button">Remove at Index</button>
      </div>

      <div class="ll-row">
        <div class="ll-field"><label for="ll-search-value">Search</label><input id="ll-search-value" type="number" value="50" inputmode="numeric"></div>
        <button class="ll-btn span2" id="ll-search" type="button">Linear Search</button>
        <button class="ll-btn secondary span2" id="ll-traverse" type="button">Traverse</button>
        <button class="ll-btn secondary span2" id="ll-reverse" type="button">Reverse</button>
        <button class="ll-btn secondary span2" id="ll-sort" type="button">Bubble Sort</button>
        <button class="ll-btn danger span2" id="ll-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="ll-stage">
      <div class="ll-canvas"><div class="ll-list" id="ll-list"></div></div>
      <div class="ll-status" id="ll-status" aria-live="polite">Ready.</div>
    </div>

    <div class="ll-footer">
      <div class="ll-stat"><strong>Operation</strong><span id="ll-op">Idle</span></div>
      <div class="ll-stat"><strong>Visited</strong><span id="ll-visits">0</span></div>
      <div class="ll-stat"><strong>Changes</strong><span id="ll-changes">0</span></div>
      <div class="ll-stat"><strong>Length</strong><span id="ll-length">0</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const e = {
    value:$("ll-value"), index:$("ll-index"), searchValue:$("ll-search-value"),
    addHead:$("ll-add-head"), addTail:$("ll-add-tail"), removeHead:$("ll-remove-head"), removeTail:$("ll-remove-tail"), clear:$("ll-clear"),
    access:$("ll-access"), addIndex:$("ll-add-index"), removeIndex:$("ll-remove-index"), search:$("ll-search"), traverse:$("ll-traverse"), reverse:$("ll-reverse"), sort:$("ll-sort"), cancel:$("ll-cancel"),
    list:$("ll-list"), status:$("ll-status"), op:$("ll-op"), visits:$("ll-visits"), changes:$("ll-changes"), length:$("ll-length")
  };

  let data=[24,51,18,73,42];
  let token=0, running=false, visits=0, changes=0;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function status(text,type=""){ e.status.textContent=text; e.status.className="ll-status"+(type?" "+type:""); }
  function updateStats(){ e.visits.textContent=visits; e.changes.textContent=changes; e.length.textContent=data.length; }
  function resetStats(name="Idle"){ visits=0; changes=0; e.op.textContent=name; updateStats(); }
  function setRunning(v){ running=v; [e.addHead,e.addTail,e.removeHead,e.removeTail,e.clear,e.access,e.addIndex,e.removeIndex,e.search,e.traverse,e.reverse,e.sort].forEach(b=>b.disabled=v); e.cancel.disabled=!v; }
  function integer(inp){ const n=Number(inp.value); return Number.isInteger(n)?n:null; }

  function render(states={}){
    e.list.innerHTML=""; e.length.textContent=data.length;
    if(!data.length){ const x=document.createElement("div"); x.className="ll-empty"; x.textContent="Linked list is empty."; e.list.appendChild(x); return; }
    const head=document.createElement("div"); head.className="ll-endpoint"; head.textContent="HEAD"; e.list.appendChild(head);
    const firstArrow=document.createElement("div"); firstArrow.className="ll-arrow"; firstArrow.textContent="→"; e.list.appendChild(firstArrow);
    data.forEach((value,i)=>{
      const wrap=document.createElement("div"); wrap.className="ll-node-wrap";
      const node=document.createElement("div"); node.className="ll-node"; node.dataset.index=i;
      if(states.checking?.includes(i)) node.classList.add("checking");
      if(states.found?.includes(i)) node.classList.add("found");
      if(states.selected?.includes(i)) node.classList.add("selected");
      if(states.sorted?.includes(i)) node.classList.add("sorted");
      if(states.moving?.includes(i)) node.classList.add("moving");
      const d=document.createElement("div"); d.className="ll-data"; d.textContent=value;
      const n=document.createElement("div"); n.className="ll-next"; n.textContent=i===data.length-1?"NULL":"next";
      node.append(d,n);
      node.addEventListener("click",()=>{ if(running)return; e.index.value=i; e.value.value=data[i]; render({selected:[i]}); status(`Node ${i} selected.`); });
      const idx=document.createElement("div"); idx.className="ll-index"; idx.textContent=`index ${i}`;
      wrap.append(node,idx); e.list.appendChild(wrap);
      if(i<data.length-1){ const a=document.createElement("div"); a.className="ll-arrow"; a.textContent="→"; e.list.appendChild(a); }
    });
  }

  async function pause(t){ await wait(280); if(t!==token) throw new Error("cancelled"); }
  async function animate(t,states,text){ if(text)status(text); render(states); await pause(t); }
  function begin(name){ token++; resetStats(name); setRunning(true); return token; }
  function finish(t,msg,type=""){ if(t!==token)return; setRunning(false); e.op.textContent="Idle"; status(msg,type); render(); }
  function fail(t,err){ if(err?.message==="cancelled"||t!==token)return; setRunning(false); e.op.textContent="Idle"; status("Operation stopped.","error"); render(); }
  function ensure(){ if(!data.length){status("Create nodes first.","error");return false;} return true; }
  function maxCheck(){ if(data.length>=7){status("Maximum 7 nodes for 800×600 view.","error");return false;} return true; }

  async function addHead(){ if(!maxCheck())return; const v=integer(e.value); if(v===null){status("Enter an integer value.","error");return;} const t=begin("Add Head"); try{ data.unshift(v); changes++; updateStats(); await animate(t,{found:[0]},`New head = ${v}`); finish(t,`Added ${v} at head.`,"success"); }catch(err){fail(t,err);} }
  async function addTail(){ if(!maxCheck())return; const v=integer(e.value); if(v===null){status("Enter an integer value.","error");return;} const t=begin("Add Tail"); try{ for(let i=0;i<data.length;i++){visits++;updateStats();await animate(t,{checking:[i]},`Following next from node ${i}`);} data.push(v); changes++; updateStats(); await animate(t,{found:[data.length-1]},`New tail = ${v}`); finish(t,`Added ${v} at tail.`,"success"); }catch(err){fail(t,err);} }
  async function removeHead(){ if(!ensure())return; const old=data[0],t=begin("Remove Head"); try{ await animate(t,{found:[0]},`Removing head ${old}`); data.shift(); changes++;updateStats();finish(t,`Removed head ${old}.`,"success"); }catch(err){fail(t,err);} }
  async function removeTail(){ if(!ensure())return; const old=data[data.length-1],t=begin("Remove Tail"); try{ for(let i=0;i<data.length;i++){visits++;updateStats();await animate(t,{checking:[i]},`Following next from node ${i}`);} data.pop();changes++;updateStats();finish(t,`Removed tail ${old}.`,"success"); }catch(err){fail(t,err);} }
  async function access(){ if(!ensure())return; const idx=integer(e.index); if(idx===null||idx<0||idx>=data.length){status("Index is out of range.","error");return;} const t=begin("Access"); try{ for(let i=0;i<=idx;i++){visits++;updateStats();await animate(t,{checking:[i]},`Visiting node ${i}`);} await animate(t,{found:[idx]},`Index ${idx} = ${data[idx]}`); finish(t,`Value at index ${idx} is ${data[idx]}.`,"success"); }catch(err){fail(t,err);} }
  async function addIndex(){ if(!maxCheck())return; const idx=integer(e.index),v=integer(e.value); if(idx===null||idx<0||idx>data.length){status(`Index must be 0–${data.length}.`,"error");return;} if(v===null){status("Enter an integer value.","error");return;} const t=begin("Add at Index"); try{ for(let i=0;i<idx;i++){visits++;updateStats();await animate(t,{checking:[i]},`Following next from node ${i}`);} data.splice(idx,0,v);changes++;updateStats();await animate(t,{found:[idx]},`Inserted ${v} at index ${idx}`);finish(t,`Inserted ${v} at index ${idx}.`,"success"); }catch(err){fail(t,err);} }
  async function removeIndex(){ if(!ensure())return; const idx=integer(e.index); if(idx===null||idx<0||idx>=data.length){status("Index is out of range.","error");return;} const old=data[idx],t=begin("Remove at Index"); try{ for(let i=0;i<=idx;i++){visits++;updateStats();await animate(t,{checking:[i]},`Visiting node ${i}`);} await animate(t,{found:[idx]},`Removing node ${idx}`);data.splice(idx,1);changes++;updateStats();finish(t,`Removed ${old} from index ${idx}.`,"success"); }catch(err){fail(t,err);} }
  async function linearSearch(){ if(!ensure())return; const target=integer(e.searchValue); if(target===null){status("Enter an integer to search.","error");return;} const t=begin("Linear Search"); try{ for(let i=0;i<data.length;i++){visits++;updateStats();await animate(t,{checking:[i]},`Comparing ${data[i]} with ${target}`); if(data[i]===target){await animate(t,{found:[i]},`Found ${target} at index ${i}`);finish(t,`Found ${target} at index ${i}.`,"success");return;}} finish(t,`${target} not found.`,"error"); }catch(err){fail(t,err);} }
  async function traverse(){ if(!ensure())return; const t=begin("Traverse"); try{ for(let i=0;i<data.length;i++){visits++;updateStats();await animate(t,{checking:[i]},`Visiting node ${i}: ${data[i]}`);} finish(t,"Traversal complete.","success"); }catch(err){fail(t,err);} }
  async function reverse(){ if(!ensure())return; const t=begin("Reverse"); try{ for(let i=0;i<data.length;i++){visits++;updateStats();await animate(t,{checking:[i]},`Reversing link at node ${i}`);} data.reverse();changes=data.length;updateStats();await animate(t,{found:data.map((_,i)=>i)},"Links reversed");finish(t,"Linked list reversed.","success"); }catch(err){fail(t,err);} }
  async function sort(){ if(!ensure())return; const t=begin("Bubble Sort"); try{ const sorted=[]; for(let end=data.length-1;end>0;end--){let changed=false;for(let i=0;i<end;i++){visits++;updateStats();await animate(t,{checking:[i,i+1],sorted},`Comparing ${data[i]} and ${data[i+1]}`); if(data[i]>data[i+1]){[data[i],data[i+1]]=[data[i+1],data[i]];changes++;changed=true;updateStats();render({found:[i,i+1],sorted});status(`Swapped node values ${i} and ${i+1}`);await pause(t);}}sorted.push(end);if(!changed)break;} await animate(t,{sorted:data.map((_,i)=>i)},"Values sorted");finish(t,"Linked list values sorted.","success"); }catch(err){fail(t,err);} }
  function clear(){ token++;data=[];resetStats();setRunning(false);render();status("Linked list cleared."); }
  function cancel(){ if(!running)return;token++;setRunning(false);e.op.textContent="Idle";render();status("Animation cancelled."); }

  e.addHead.addEventListener("click",addHead);e.addTail.addEventListener("click",addTail);e.removeHead.addEventListener("click",removeHead);e.removeTail.addEventListener("click",removeTail);e.clear.addEventListener("click",clear);
  e.access.addEventListener("click",access);e.addIndex.addEventListener("click",addIndex);e.removeIndex.addEventListener("click",removeIndex);e.search.addEventListener("click",linearSearch);e.traverse.addEventListener("click",traverse);e.reverse.addEventListener("click",reverse);e.sort.addEventListener("click",sort);e.cancel.addEventListener("click",cancel);
    e.cancel.disabled=true;resetStats();render();
})();
</script>
