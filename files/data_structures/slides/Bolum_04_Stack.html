<style>
.stack-sim,
.stack-sim *,
.stack-sim *::before,
.stack-sim *::after { box-sizing: border-box; }

.stack-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--sim-text);
  font-family: inherit;
  overflow: hidden;
}

.stack-shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
}

.stack-title {
  margin: 0;
  color: var(--sim-text);
  text-align: center;
  font-size: 1.45rem;
  line-height: 1.15;
}

.stack-controls {
  display: grid;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-softer);
}

.stack-row {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 5px;
  align-items: end;
}

.stack-field {
  display: grid;
  grid-column: span 2;
  gap: 2px;
  min-width: 0;
}

.stack-field label {
  display: block;
  margin: 0 !important;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.stack-field input {
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 3px 6px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-bg);
  color: var(--sim-text);
  font: inherit;
  line-height: 1;
  vertical-align: top;
}

.stack-btn {
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 0 7px;
  border: 1px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-accent);
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: end;
  vertical-align: top;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease, filter .12s ease;
}

.stack-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.stack-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.stack-btn.success {
  background: var(--sim-ok);
  border-color: var(--sim-ok);
}

.stack-btn.danger {
  background: var(--sim-danger);
  border-color: var(--sim-danger);
}

.span2 { grid-column: span 2; }

.stack-stage {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(235px, .82fr) minmax(0, 1.18fr);
  gap: 8px;
}

.stack-visual,
.stack-side {
  min-height: 0;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-bg);
}

.stack-visual {
  display: grid;
  grid-template-rows: auto 1fr;
  padding: 8px;
  overflow: hidden;
}

.stack-top-label {
  min-height: 18px;
  text-align: center;
  color: var(--sim-accent);
  font-size: 10px;

}

.stack-container {
  width: min(210px, 92%);
  height: 100%;
  min-height: 245px;

  margin: 0 auto;
  padding: 8px;
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-start;
  gap: 5px;
  border: 3px solid color-mix(in srgb, var(--sim-accent) 85%, var(--sim-border));
  border-top: 0;
  border-radius: 0 0 9px 9px;
  background: color-mix(in srgb, var(--sim-accent) 5%, var(--sim-bg));
  position: relative;
  overflow: hidden;
}

.stack-container::before,
.stack-container::after {
  content: "";
  position: absolute;
  top: 0;
  width: 24px;
  height: 3px;
  background: var(--sim-accent);
}

.stack-container::before { left: -3px; }
.stack-container::after { right: -3px; }

.stack-item {
  flex: 0 0 36px;
  min-height: 36px;
  padding: 4px 8px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 6px;
  border: 2px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-soft);
  color: var(--sim-text);
  font-weight: 800;
  transition: transform .18s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
}

.stack-item small {
  font-size: 9px;
  font-weight: 700;
  opacity: .55;
}

.stack-item.checking {
  background: #fef3c7;
  border-color: var(--sim-warn);
  color: #4a3100;
  transform: translateX(5px);
}

.stack-item.found {
  background: #dcfce7;
  border-color: var(--sim-ok);
  color: #14532d;
  transform: translateX(5px) scale(1.02);
}

.stack-item.removing {
  background: #fee2e2;
  border-color: var(--sim-danger);

  opacity: .7;
}

.stack-empty {
  margin: auto;
  align-self: center;
  text-align: center;
  font-size: 12px;
  opacity: .55;
}

.stack-side {
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

.stack-status {
  min-height: 40px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--sim-border);
  background: var(--sim-softer);
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
}

.stack-status.success { color: var(--sim-ok); }
.stack-status.error { color: var(--sim-danger); }

.stack-history {
  min-height: 0;
  padding: 8px 10px;
  overflow: hidden;
}

.stack-history-title {
  margin: 0 0 5px;
  font-size: 10px;
  font-weight: 800;
  opacity: .6;
  text-transform: uppercase;
  letter-spacing: .03em;
}

.stack-history-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 4px;
}

.stack-history-list li {
  padding: 5px 7px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-softer);
  font-size: 10.5px;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stack-footer {
  display: grid;
  grid-template-columns: 1.7fr repeat(3, .75fr);
  gap: 5px;
}

.stack-stat {
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid var(--sim-border);
  border-radius: 7px;
  background: var(--sim-softer);
  font-size: 10.5px;
  line-height: 1.2;
}

.stack-stat strong {
  display: block;
  margin-bottom: 2px;
  font-size: 9px;
  opacity: .6;
  text-transform: uppercase;
  letter-spacing: .03em;
}

@media (max-width: 700px) {

    width: calc(100vw - 10px);
    height: auto;
    min-height: 0;
    overflow: visible;
  }
  .stack-shell { grid-template-rows: auto; }
  .stack-row { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .stack-field, .span2 { grid-column: span 2; }
  .stack-stage { grid-template-columns: 1fr; }
  .stack-visual { min-height: 330px; }
  .stack-side { min-height: 150px; }
}

@media (max-height: 620px) and (min-width: 701px) {
  .stack-sim {

  }
  .stack-title { font-size: 1.25rem; }
  .stack-controls { padding: 6px; gap: 5px; }
  .stack-btn, .stack-field input { height: 28px; min-height: 28px; }
  .stack-container { min-height: 215px; }
  .stack-item { flex-basis: 31px; min-height: 31px; }
  .stack-status { min-height: 34px; padding: 6px 8px; }
}

<div class="stack-sim">
  <div class="stack-shell">
    <h1 class="stack-title">Stack Simulator</h1>

    <div class="stack-controls">
      <div class="stack-row">
        <div class="stack-field">
          <label for="stack-value">Value</label>
          <input id="stack-value" type="number" value="50" inputmode="numeric">
        </div>
        <button class="stack-btn success span2" id="stack-push" type="button">Push</button>
        <button class="stack-btn success span2" id="stack-random" type="button">Push Random</button>
        <button class="stack-btn danger span2" id="stack-pop" type="button">Pop</button>
        <button class="stack-btn span2" id="stack-peek" type="button">Peek</button>
        <button class="stack-btn success span2" id="stack-fill" type="button">Fill Random</button>
      </div>

      <div class="stack-row">
        <div class="stack-field">
          <label for="stack-search-value">Search</label>
          <input id="stack-search-value" type="number" value="50" inputmode="numeric">
        </div>
        <button class="stack-btn span2" id="stack-search" type="button">Search</button>
        <button class="stack-btn danger span2" id="stack-clear" type="button">Clear</button>
        <button class="stack-btn danger span2" id="stack-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="stack-stage">
      <div class="stack-visual">
        <div class="stack-top-label" id="stack-top-label">TOP</div>
        <div class="stack-container" id="stack-view"></div>
      </div>

      <div class="stack-side">
        <div class="stack-status" id="stack-status" aria-live="polite">Ready.</div>
        <div class="stack-history">
          <div class="stack-history-title">Recent operations</div>
          <ul class="stack-history-list" id="stack-history"></ul>
        </div>
      </div>
    </div>

    <div class="stack-footer">
      <div class="stack-stat"><strong>Operation</strong><span id="stack-operation">Idle</span></div>
      <div class="stack-stat"><strong>Visited</strong><span id="stack-visits">0</span></div>
      <div class="stack-stat"><strong>Changes</strong><span id="stack-changes">0</span></div>
      <div class="stack-stat"><strong>Size</strong><span id="stack-size">0 / 7</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    value: $("stack-value"),
    searchValue: $("stack-search-value"),
    push: $("stack-push"),
    random: $("stack-random"),
    pop: $("stack-pop"),
    peek: $("stack-peek"),
    fill: $("stack-fill"),
    search: $("stack-search"),
    clear: $("stack-clear"),
    cancel: $("stack-cancel"),
    view: $("stack-view"),
    topLabel: $("stack-top-label"),
    status: $("stack-status"),
    history: $("stack-history"),
    operation: $("stack-operation"),
    visits: $("stack-visits"),
    changes: $("stack-changes"),
    size: $("stack-size")
  };

  const MAX = 7;
  const DELAY = 280;

  let stack = [24, 51, 18, 73];
  let token = 0;
  let running = false;
  let visits = 0;
  let changes = 0;
  let history = [];

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function integer(input) {
    const value = Number(input.value);
    return Number.isInteger(value) ? value : null;
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "stack-status" + (type ? " " + type : "");
  }

  function updateStats() {
    el.visits.textContent = visits;
    el.changes.textContent = changes;
    el.size.textContent = `${stack.length} / ${MAX}`;
  }

  function resetStats(operation = "Idle") {
    visits = 0;
    changes = 0;
    el.operation.textContent = operation;
    updateStats();
  }

  function addHistory(text) {
    history.unshift(text);
    history = history.slice(0, 7);
    el.history.innerHTML = "";
    history.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      el.history.appendChild(li);
    });
  }

  function setRunning(value) {
    running = value;
    [
      el.push, el.random, el.pop, el.peek,
      el.fill, el.search, el.clear
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function render(states = {}) {
    el.view.innerHTML = "";

    if (!stack.length) {
      const empty = document.createElement("div");
      empty.className = "stack-empty";
      empty.textContent = "Stack is empty.";
      el.view.appendChild(empty);
      el.topLabel.textContent = "TOP";
      updateStats();
      return;
    }

    stack.forEach((value, index) => {
      const item = document.createElement("div");
      item.className = "stack-item";

      if (states.checking?.includes(index)) item.classList.add("checking");
      if (states.found?.includes(index)) item.classList.add("found");
      if (states.removing?.includes(index)) item.classList.add("removing");

      const valueSpan = document.createElement("span");
      valueSpan.textContent = value;

      const position = document.createElement("small");
      position.textContent = index === stack.length - 1 ? "TOP" : `#${index}`;

      item.append(valueSpan, position);
      el.view.appendChild(item);
    });

    el.topLabel.textContent = `TOP = ${stack[stack.length - 1]}`;
    updateStats();
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  async function animate(localToken, states, message) {
    if (message) setStatus(message);
    render(states);
    await pause(localToken);
  }

  function begin(operation) {
    token++;
    resetStats(operation);
    setRunning(true);
    return token;
  }

  function finish(localToken, message, type = "", historyText = null) {
    if (localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
    if (historyText) addHistory(historyText);
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  function hasSpace() {
    if (stack.length >= MAX) {
      setStatus(`Stack overflow: maximum ${MAX} items.`, "error");
      return false;
    }
    return true;
  }

  function hasItems() {
    if (!stack.length) {
      setStatus("Stack underflow: stack is empty.", "error");
      return false;
    }
    return true;
  }

  async function pushValue(value, label = "Push") {
    if (!hasSpace()) return;
    if (!Number.isInteger(value)) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin(label);
    try {
      stack.push(value);
      changes++;
      updateStats();
      await animate(t, { found: [stack.length - 1] }, `Pushed ${value} onto the stack.`);
      finish(t, `Pushed ${value}.`, "success", `Push ${value}`);
    } catch (error) {
      fail(t, error);
    }
  }

  function push() {
    pushValue(integer(el.value));
  }

  function pushRandom() {
    pushValue(Math.floor(Math.random() * 90) + 10, "Push Random");
  }

  async function pop() {
    if (!hasItems()) return;

    const topIndex = stack.length - 1;
    const value = stack[topIndex];
    const t = begin("Pop");

    try {
      await animate(t, { removing: [topIndex] }, `Removing top value ${value}...`);
      stack.pop();
      changes++;
      updateStats();
      finish(t, `Popped ${value}.`, "success", `Pop ${value}`);
    } catch (error) {
      fail(t, error);
    }
  }

  async function peek() {
    if (!hasItems()) return;

    const topIndex = stack.length - 1;
    const value = stack[topIndex];
    const t = begin("Peek");

    try {
      visits++;
      updateStats();
      await animate(t, { found: [topIndex] }, `Top value is ${value}.`);
      finish(t, `Top value is ${value}.`, "success", `Peek → ${value}`);
    } catch (error) {
      fail(t, error);
    }
  }

  async function search() {
    if (!hasItems()) return;

    const target = integer(el.searchValue);
    if (target === null) {
      setStatus("Enter an integer to search.", "error");
      return;
    }

    const t = begin("Search");

    try {
      for (let i = stack.length - 1; i >= 0; i--) {
        visits++;
        updateStats();
        await animate(t, { checking: [i] }, `Comparing ${stack[i]} with ${target}...`);

        if (stack[i] === target) {
          const distance = stack.length - 1 - i;
          await animate(t, { found: [i] }, `Found ${target}: ${distance} item(s) below TOP.`);
          finish(
            t,
            `Found ${target}, ${distance} item(s) below TOP.`,
            "success",
            `Search ${target} → found`
          );
          return;
        }
      }

      finish(t, `${target} not found.`, "error", `Search ${target} → not found`);
    } catch (error) {
      fail(t, error);
    }
  }

  async function fillRandom() {
    const t = begin("Fill Random");

    try {
      stack = [];
      changes = 0;
      render();

      for (let i = 0; i < MAX; i++) {
        const value = Math.floor(Math.random() * 90) + 10;
        stack.push(value);
        changes++;
        updateStats();
        await animate(t, { found: [stack.length - 1] }, `Pushing ${value}...`);
      }

      finish(t, "Stack filled with random values.", "success", "Fill Random");
    } catch (error) {
      fail(t, error);
    }
  }

  function clearStack() {
    token++;
    const count = stack.length;
    stack = [];
    resetStats();
    setRunning(false);
    render();
    setStatus("Stack cleared.");
    if (count) addHistory("Clear");
  }

  function cancel() {
    if (!running) return;
    token++;
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  el.push.addEventListener("click", push);
  el.random.addEventListener("click", pushRandom);
  el.pop.addEventListener("click", pop);
  el.peek.addEventListener("click", peek);
  el.search.addEventListener("click", search);
  el.fill.addEventListener("click", fillRandom);
  el.clear.addEventListener("click", clearStack);
  el.cancel.addEventListener("click", cancel);

  el.cancel.disabled = true;
  resetStats();
  render();
  addHistory("Simulator ready");
})();
</script>
