<style>
.span-sim,

.span-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));

  overflow: hidden;
}

}

}

}

  color: var(--sim-text);

<div class="span-sim">
  <div class="span-shell">
    <h1 class="span-title">Stock Span Simulator</h1>

    <div class="span-controls">
      <div class="span-row">
        <div class="span-field">
          <label for="span-prices">Prices</label>
          <input id="span-prices" type="text" value="100,80,60,70,60,75,85">
        </div>
        <button class="span-btn span2" id="span-load" type="button">Load</button>
        <button class="span-btn span2" id="span-example" type="button">Example</button>
        <button class="span-btn span2" id="span-random" type="button">Random</button>
      </div>

      <div class="span-row">
        <button class="span-btn span2" id="span-prev" type="button">Previous</button>
        <button class="span-btn span2" id="span-next" type="button">Next</button>
        <button class="span-btn success span2" id="span-auto" type="button">Auto Run</button>
        <button class="span-btn danger span2" id="span-reset" type="button">Reset</button>
        <button class="span-btn danger span2" id="span-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="span-stage">
      <div class="span-chart-panel">
        <div class="span-chart" id="span-chart"></div>
        <div class="span-status" id="span-status" aria-live="polite">Ready.</div>
      </div>

      <div class="span-stack-panel">
        <div class="span-stack-title">Monotonic Stack</div>
        <div class="span-stack-shell" id="span-stack"></div>
        <div class="span-stack-top" id="span-stack-top">TOP</div>
      </div>
    </div>

    <div class="span-footer">
      <div class="span-stat"><strong>Operation</strong><span id="span-operation">Idle</span></div>
      <div class="span-stat"><strong>Day</strong><span id="span-day">0 / 7</span></div>
      <div class="span-stat"><strong>Pops</strong><span id="span-pops">0</span></div>
      <div class="span-stat"><strong>Comparisons</strong><span id="span-comparisons">0</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    prices: $("span-prices"),
    load: $("span-load"),
    example: $("span-example"),
    random: $("span-random"),
    prev: $("span-prev"),
    next: $("span-next"),
    auto: $("span-auto"),
    reset: $("span-reset"),
    cancel: $("span-cancel"),
    chart: $("span-chart"),
    stack: $("span-stack"),
    stackTop: $("span-stack-top"),
    status: $("span-status"),
    operation: $("span-operation"),
    day: $("span-day"),
    pops: $("span-pops"),
    comparisons: $("span-comparisons")
  };

  const DELAY = 300;
  const MAX = 10;

  let prices = [];
  let frames = [];
  let step = 0;
  let running = false;
  let token = 0;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "span-status" + (type ? " " + type : "");
  }

  function parsePrices(text) {
    const values = text
      .split(",")
      .map(x => Number(x.trim()))
      .filter(x => Number.isFinite(x) && x > 0);

    if (!values.length || values.length > MAX) return null;
    return values.map(Math.round);
  }

  function buildFrames(values) {
    const result = [];
    const stack = [];
    const spans = Array(values.length).fill(null);
    let totalPops = 0;
    let totalComparisons = 0;

    result.push({
      day: 0,
      stack: [],
      spans: [...spans],
      pops: 0,
      comparisons: 0,
      message: "Ready."
    });

    for (let i = 0; i < values.length; i++) {
      let popped = 0;
      let comparisons = 0;

      while (stack.length) {
        comparisons++;
        totalComparisons++;
        if (values[stack[stack.length - 1]] <= values[i]) {
          stack.pop();
          popped++;
          totalPops++;
        } else {
          break;
        }
      }

      spans[i] = stack.length ? i - stack[stack.length - 1] : i + 1;
      stack.push(i);

      result.push({
        day: i + 1,
        stack: [...stack],
        spans: [...spans],
        pops: totalPops,
        comparisons: totalComparisons,
        current: i,
        message:
          `Day ${i + 1}: price ${values[i]}, span ${spans[i]}` +
          (popped ? `, popped ${popped}.` : ".")
      });
    }

    return result;
  }

  function currentFrame() {
    return frames[Math.max(0, Math.min(step, frames.length - 1))];
  }

  function setRunning(value) {
    running = value;
    [el.load, el.example, el.random, el.prev, el.next, el.auto, el.reset]
      .forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function render() {
    const frame = currentFrame();
    const maxPrice = Math.max(...prices, 1);

    el.chart.innerHTML = "";
    prices.forEach((price, i) => {
      const day = document.createElement("div");
      day.className = "span-day";

      if (frame.current === i) day.classList.add("current");
      if (frame.spans[i] !== null) day.classList.add("done");

      const priceLabel = document.createElement("div");
      priceLabel.className = "span-price";
      priceLabel.textContent = price;

      const badge = document.createElement("div");
      badge.className = "span-badge" + (frame.spans[i] === null ? " pending" : "");
      badge.textContent = frame.spans[i] === null ? "—" : frame.spans[i];

      const bar = document.createElement("div");
      bar.className = "span-bar";
      bar.style.height = `${Math.max(8, (price / maxPrice) * 72)}%`;

      const label = document.createElement("div");
      label.className = "span-day-label";
      label.textContent = i + 1;

      day.append(priceLabel, badge, bar, label);
      el.chart.appendChild(day);
    });

    el.stack.innerHTML = "";
    if (!frame.stack.length) {
      const empty = document.createElement("div");
      empty.className = "span-stack-empty";
      empty.textContent = "Empty";
      el.stack.appendChild(empty);
      el.stackTop.textContent = "TOP";
    } else {
      frame.stack.forEach((index, pos) => {
        const item = document.createElement("div");
        item.className = "span-stack-item";
        if (pos === frame.stack.length - 1) item.classList.add("top");

        const main = document.createElement("span");
        main.textContent = `D${index + 1}: ${prices[index]}`;

        const small = document.createElement("small");
        small.textContent = `i=${index}`;

        item.append(main, small);
        el.stack.appendChild(item);
      });

      const topIndex = frame.stack[frame.stack.length - 1];
      el.stackTop.textContent = `TOP = D${topIndex + 1}`;
    }

    el.day.textContent = `${frame.day} / ${prices.length}`;
    el.pops.textContent = frame.pops;
    el.comparisons.textContent = frame.comparisons;

    el.prev.disabled = running || step <= 0;
    el.next.disabled = running || step >= frames.length - 1;
    el.cancel.disabled = !running;
  }

  function loadValues(values, message = "Prices loaded.") {
    prices = [...values];
    frames = buildFrames(prices);
    step = 0;
    token++;
    running = false;
    el.operation.textContent = "Idle";
    el.prices.value = prices.join(",");
    render();
    setStatus(message, "success");
  }

  function loadFromInput() {
    const values = parsePrices(el.prices.value);
    if (!values) {
      setStatus(`Enter 1–${MAX} positive prices separated by commas.`, "error");
      return;
    }
    loadValues(values);
  }

  function loadExample() {
    loadValues([100, 80, 60, 70, 60, 75, 85], "Example loaded.");
  }

  function loadRandom() {
    const count = 7;
    const values = Array.from(
      { length: count },
      () => Math.floor(Math.random() * 91) + 30
    );
    loadValues(values, "Random prices loaded.");
  }

  function previousStep() {
    if (running || step <= 0) return;
    step--;
    el.operation.textContent = "Previous";
    render();
    setStatus(currentFrame().message);
  }

  function nextStep() {
    if (running || step >= frames.length - 1) return;
    step++;
    el.operation.textContent = "Next";
    render();

    if (step === frames.length - 1) {
      setStatus("All spans computed.", "success");
    } else {
      setStatus(currentFrame().message);
    }
  }

  async function autoRun() {
    if (step >= frames.length - 1) {
      step = 0;
      render();
    }

    token++;
    const localToken = token;
    running = true;
    el.operation.textContent = "Auto Run";
    setRunning(true);

    try {
      while (step < frames.length - 1) {
        await wait(DELAY);
        if (localToken !== token) throw new Error("cancelled");
        step++;
        render();
        setStatus(currentFrame().message);
      }

      if (localToken !== token) return;
      running = false;
      setRunning(false);
      el.operation.textContent = "Idle";
      setStatus("All spans computed.", "success");
    } catch (error) {
      if (error?.message !== "cancelled") {
        running = false;
        setRunning(false);
        el.operation.textContent = "Idle";
        setStatus("Operation stopped.", "error");
      }
    }
  }

  function reset() {
    token++;
    running = false;
    step = 0;
    el.operation.textContent = "Idle";
    setRunning(false);
    render();
    setStatus("Simulation reset.");
  }

  function cancel() {
    if (!running) return;
    token++;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Auto run cancelled.");
  }

  el.load.addEventListener("click", loadFromInput);
  el.example.addEventListener("click", loadExample);
  el.random.addEventListener("click", loadRandom);
  el.prev.addEventListener("click", previousStep);
  el.next.addEventListener("click", nextStep);
  el.auto.addEventListener("click", autoRun);
  el.reset.addEventListener("click", reset);
  el.cancel.addEventListener("click", cancel);

  loadExample();
})();
</script>
