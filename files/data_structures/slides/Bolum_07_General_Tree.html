<style>
.gtree-sim,
.gtree-sim *,
.gtree-sim *::before,
.gtree-sim *::after { box-sizing: border-box; }

.gtree-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;
  --sim-visit: #7c3aed;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--sim-text);
  font-family: inherit;
  overflow: hidden;
}

.gtree-shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
}

.gtree-title {
  margin: 0;
  color: var(--sim-text);
  text-align: center;
  font-size: 1.45rem;
  line-height: 1.15;
}

.gtree-controls {
  display: grid;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-softer);
}

.gtree-row {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 5px;
  align-items: end;
}

.gtree-field {
  display: grid;
  grid-column: span 2;
  gap: 2px;
  min-width: 0;
}

.gtree-field label {
  display: block;
  margin: 0 !important;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.gtree-field input {
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 3px 6px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-bg);
  color: var(--sim-text);
  font: inherit;
  line-height: 1;
  vertical-align: top;
}

.gtree-btn {
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 0 6px;
  border: 1px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-accent);
  color: #fff;
  font: inherit;
  font-size: 10.3px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: end;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease, filter .12s ease;
}

.gtree-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.gtree-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.gtree-btn.success {

  border-color: var(--sim-ok);
}

.gtree-btn.danger {
  background: var(--sim-danger);
  border-color: var(--sim-danger);
}

.span2 { grid-column: span 2; }

  min-height: 0;
  display: grid;
  grid-template-rows: 1fr auto;

  border-radius: 10px;
  background: var(--sim-bg);
  overflow: hidden;
}

.gtree-canvas {
  min-height: 0;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at center, color-mix(in srgb, var(--sim-accent) 3%, transparent), transparent 65%);
}

.gtree-svg {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 285px;
}

.gtree-edge {
  stroke: color-mix(in srgb, var(--sim-text) 38%, var(--sim-border));

  stroke-linecap: round;
}

.gtree-edge.active {
  stroke: var(--sim-warn);
  stroke-width: 3.5;
}

.gtree-node {
  cursor: pointer;
}

.gtree-node circle {
  fill: var(--sim-bg);
  stroke: var(--sim-accent);

}

.gtree-node.selected circle {

}

.gtree-node.ancestor circle {

}

.gtree-node.descendant circle {

}

.gtree-node.visited circle {

  stroke: var(--sim-visit);

}

.gtree-node.new-node circle {

.gtree-footer {

}

.gtree-stat {

}

.gtree-stat strong {

.gtree-stat span {

}

<div class="gtree-sim">
  <div class="gtree-shell">
    <h1 class="gtree-title">General Tree Simulator</h1>

    <div class="gtree-controls">
      <div class="gtree-row">
        <div class="gtree-field">
          <label for="gtree-label">Node label</label>
          <input id="gtree-label" type="text" value="X" maxlength="8">
        </div>

        <button class="gtree-btn success span2" id="gtree-add" type="button">Add Child</button>
        <button class="gtree-btn span2" id="gtree-root" type="button">Select Root</button>
        <button class="gtree-btn danger span2" id="gtree-remove" type="button">Remove Subtree</button>
        <button class="gtree-btn span2" id="gtree-ancestors" type="button">Ancestors</button>
        <button class="gtree-btn span2" id="gtree-descendants" type="button">Descendants</button>
      </div>

      <div class="gtree-row">
        <button class="gtree-btn span2" id="gtree-dfs" type="button">DFS Preorder</button>
        <button class="gtree-btn span2" id="gtree-bfs" type="button">BFS Level</button>
        <button class="gtree-btn success span2" id="gtree-load" type="button">Load Example</button>
        <button class="gtree-btn span2" id="gtree-clear-highlights" type="button">Clear Highlights</button>
        <button class="gtree-btn danger span2" id="gtree-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="gtree-stage">
      <div class="gtree-canvas">
        <svg id="gtree-svg" class="gtree-svg" viewBox="0 0 740 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interactive general tree"></svg>
      </div>

      <div class="gtree-status" id="gtree-status" aria-live="polite">
        Click a node to select it.
      </div>
    </div>

    <div class="gtree-footer">
      <div class="gtree-stat"><strong>Selected</strong><span id="gtree-selected">—</span></div>
      <div class="gtree-stat"><strong>Nodes</strong><span id="gtree-nodes">0 / 12</span></div>
      <div class="gtree-stat"><strong>Leaves</strong><span id="gtree-leaves">0</span></div>
      <div class="gtree-stat"><strong>Height</strong><span id="gtree-height">0</span></div>
      <div class="gtree-stat"><strong>Max degree</strong><span id="gtree-degree">0</span></div>
      <div class="gtree-stat"><strong>Result</strong><span id="gtree-result">—</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    label: $("gtree-label"),
    add: $("gtree-add"),
    root: $("gtree-root"),
    remove: $("gtree-remove"),
    ancestors: $("gtree-ancestors"),
    descendants: $("gtree-descendants"),
    dfs: $("gtree-dfs"),
    bfs: $("gtree-bfs"),
    load: $("gtree-load"),
    clearHighlights: $("gtree-clear-highlights"),
    cancel: $("gtree-cancel"),
    svg: $("gtree-svg"),
    status: $("gtree-status"),
    selected: $("gtree-selected"),
    nodes: $("gtree-nodes"),
    leaves: $("gtree-leaves"),
    height: $("gtree-height"),
    degree: $("gtree-degree"),
    result: $("gtree-result")
  };

  const NS = "http://www.w3.org/2000/svg";
  const MAX_NODES = 12;
  const DELAY = 280;

  let root = null;
  let selectedId = null;
  let nextId = 1;
  let token = 0;
  let running = false;
  let highlight = {
    ancestors: new Set(),
    descendants: new Set(),
    visited: new Set(),
    newNode: null,
    removing: new Set(),
    activeEdges: new Set()
  };

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function createNode(label, parent = null) {
    return {
      id: nextId++,
      label,
      parent,
      children: []
    };
  }

  function allNodes(node = root, out = []) {
    if (!node) return out;
    out.push(node);
    node.children.forEach(child => allNodes(child, out));
    return out;
  }

  function findNode(id, node = root) {
    if (!node) return null;
    if (node.id === id) return node;
    for (const child of node.children) {
      const found = findNode(id, child);
      if (found) return found;
    }
    return null;
  }

  function subtreeNodes(node, out = []) {
    if (!node) return out;
    out.push(node);
    node.children.forEach(child => subtreeNodes(child, out));
    return out;
  }

  function depthOf(node) {
    let depth = 0;
    let current = node;
    while (current && current.parent) {
      depth++;
      current = current.parent;
    }
    return depth;
  }

  function heightOf(node) {
    if (!node || !node.children.length) return 0;
    return 1 + Math.max(...node.children.map(heightOf));
  }

  function leafCount() {
    return allNodes().filter(node => node.children.length === 0).length;
  }

  function maxDegree() {
    const nodes = allNodes();
    return nodes.length ? Math.max(...nodes.map(node => node.children.length)) : 0;
  }

  function edgeKey(a, b) {
    return `${a.id}-${b.id}`;
  }

  function clearHighlightData() {
    highlight.ancestors.clear();
    highlight.descendants.clear();
    highlight.visited.clear();
    highlight.newNode = null;
    highlight.removing.clear();
    highlight.activeEdges.clear();
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "gtree-status" + (type ? " " + type : "");
  }

  function setRunning(value) {
    running = value;
    [
      el.add, el.root, el.remove, el.ancestors, el.descendants,
      el.dfs, el.bfs, el.load, el.clearHighlights
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function updateStats() {
    const nodes = allNodes();
    const selected = findNode(selectedId);

    el.selected.textContent = selected
      ? `${selected.label} · d${depthOf(selected)} · deg${selected.children.length}`
      : "—";
    el.nodes.textContent = `${nodes.length} / ${MAX_NODES}`;
    el.leaves.textContent = nodes.length ? leafCount() : 0;
    el.height.textContent = root ? heightOf(root) : 0;
    el.degree.textContent = nodes.length ? maxDegree() : 0;
  }

  function measureLeaves(node) {
    if (!node.children.length) return 1;
    return node.children.reduce((sum, child) => sum + measureLeaves(child), 0);
  }

  function layoutTree() {
    if (!root) return new Map();

    const positions = new Map();
    const marginX = 44;
    const width = 740 - marginX * 2;
    const maxDepth = Math.max(1, heightOf(root));
    const topY = 34;
    const bottomY = 266;
    const levelGap = maxDepth ? (bottomY - topY) / maxDepth : 0;

    const totalLeaves = measureLeaves(root);
    let leafCursor = 0;

    function walk(node, depth) {
      let x;

      if (!node.children.length) {
        const unit = totalLeaves === 1 ? .5 : (leafCursor + .5) / totalLeaves;
        x = marginX + unit * width;
        leafCursor++;
      } else {
        const childXs = [];
        node.children.forEach(child => {
          walk(child, depth + 1);
          childXs.push(positions.get(child.id).x);
        });
        x = childXs.reduce((a, b) => a + b, 0) / childXs.length;
      }

      positions.set(node.id, {
        x,
        y: topY + depth * levelGap,
        depth
      });
    }

    walk(root, 0);
    return positions;
  }

  function svgElement(name, attrs = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function render() {
    el.svg.innerHTML = "";

    if (!root) {
      const text = svgElement("text", {
        x: 370, y: 150,
        "text-anchor": "middle",
        fill: "currentColor",
        opacity: ".55",
        "font-size": "14"
      });
      text.textContent = "Tree is empty.";
      el.svg.appendChild(text);
      updateStats();
      return;
    }

    const positions = layoutTree();
    const nodes = allNodes();

    // Depth guides.
    const maxDepth = heightOf(root);
    for (let d = 0; d <= maxDepth; d++) {
      const sample = nodes.find(node => depthOf(node) === d);
      if (!sample) continue;
      const y = positions.get(sample.id).y;

      const label = svgElement("text", {
        x: 8,
        y: y + 3,
        class: "gtree-depth-label"
      });
      label.textContent = `d${d}`;
      el.svg.appendChild(label);
    }

    // Edges first.
    nodes.forEach(parent => {
      const p = positions.get(parent.id);

      parent.children.forEach(child => {
        const c = positions.get(child.id);
        const line = svgElement("line", {
          x1: p.x,
          y1: p.y + 20,
          x2: c.x,
          y2: c.y - 20,
          class: "gtree-edge" +
            (highlight.activeEdges.has(edgeKey(parent, child)) ? " active" : "")
        });
        el.svg.appendChild(line);
      });
    });

    // Nodes.
    nodes.forEach(node => {
      const p = positions.get(node.id);
      const group = svgElement("g", {
        class: nodeClass(node),
        "data-id": node.id
      });

      const circle = svgElement("circle", {
        cx: p.x,
        cy: p.y,
        r: 21
      });

      const text = svgElement("text", {
        x: p.x,
        y: p.y + 1
      });
      text.textContent = node.label.length > 6 ? node.label.slice(0, 6) : node.label;

      group.append(circle, text);
      group.addEventListener("click", () => selectNode(node.id));
      el.svg.appendChild(group);
    });

    updateStats();
  }

  function nodeClass(node) {
    const classes = ["gtree-node"];

    if (node.id === selectedId) classes.push("selected");
    if (highlight.ancestors.has(node.id)) classes.push("ancestor");
    if (highlight.descendants.has(node.id)) classes.push("descendant");
    if (highlight.visited.has(node.id)) classes.push("visited");
    if (highlight.newNode === node.id) classes.push("new-node");
    if (highlight.removing.has(node.id)) classes.push("removing");

    return classes.join(" ");
  }

  function selectNode(id) {
    if (running) return;
    selectedId = id;
    clearHighlightData();
    const node = findNode(id);
    el.result.textContent = "—";
    render();
    setStatus(
      `${node.label} selected · depth ${depthOf(node)} · degree ${node.children.length}.`
    );
  }

  function readLabel() {
    const label = el.label.value.trim();
    return label ? label.slice(0, 8) : null;
  }

  async function addChild() {
    const parent = findNode(selectedId);
    const label = readLabel();

    if (!parent) {
      setStatus("Select a parent node first.", "error");
      return;
    }

    if (!label) {
      setStatus("Enter a node label.", "error");
      return;
    }

    if (allNodes().length >= MAX_NODES) {
      setStatus(`Maximum ${MAX_NODES} nodes.`, "error");
      return;
    }

    const child = createNode(label, parent);
    parent.children.push(child);
    selectedId = child.id;
    clearHighlightData();
    highlight.newNode = child.id;

    render();
    setStatus(`${label} added as a child of ${parent.label}.`, "success");

    await wait(DELAY);
    if (highlight.newNode === child.id) {
      highlight.newNode = null;
      render();
    }
  }

  function selectRoot() {
    if (!root) return;
    selectedId = root.id;
    clearHighlightData();
    el.result.textContent = root.label;
    render();
    setStatus(`Root ${root.label} selected.`);
  }

  async function removeSubtree() {
    const node = findNode(selectedId);

    if (!node) {
      setStatus("Select a node first.", "error");
      return;
    }

    if (node === root) {
      setStatus("The root cannot be removed. Load or reset the example instead.", "error");
      return;
    }

    token++;
    const localToken = token;
    running = true;
    setRunning(true);
    clearHighlightData();

    const removed = subtreeNodes(node);
    removed.forEach(n => highlight.removing.add(n.id));
    render();
    setStatus(`Removing subtree rooted at ${node.label}...`);

    try {
      await wait(DELAY);
      if (localToken !== token) throw new Error("cancelled");

      const parent = node.parent;
      parent.children = parent.children.filter(child => child !== node);
      selectedId = parent.id;
      clearHighlightData();
      el.result.textContent = removed.map(n => n.label).join(", ");
      running = false;
      setRunning(false);
      render();
      setStatus(`Removed ${removed.length} node(s).`, "success");
    } catch (error) {
      if (error?.message !== "cancelled") {
        running = false;
        setRunning(false);
        render();
        setStatus("Operation stopped.", "error");
      }
    }
  }

  function showAncestors() {
    const node = findNode(selectedId);

    if (!node) {
      setStatus("Select a node first.", "error");
      return;
    }

    clearHighlightData();

    const labels = [];
    let current = node.parent;

    while (current) {
      highlight.ancestors.add(current.id);
      labels.push(current.label);
      current = current.parent;
    }

    labels.reverse();
    el.result.textContent = labels.length ? labels.join(" → ") : "None";
    render();
    setStatus(`Ancestors of ${node.label}: ${labels.length ? labels.join(" → ") : "none"}.`);
  }

  function showDescendants() {
    const node = findNode(selectedId);

    if (!node) {
      setStatus("Select a node first.", "error");
      return;
    }

    clearHighlightData();
    const descendants = subtreeNodes(node).slice(1);
    descendants.forEach(item => highlight.descendants.add(item.id));
    el.result.textContent = descendants.length
      ? descendants.map(item => item.label).join(", ")
      : "None";
    render();
    setStatus(`${node.label} has ${descendants.length} descendant(s).`);
  }

  function dfsOrder(node, out = []) {
    if (!node) return out;
    out.push(node);
    node.children.forEach(child => dfsOrder(child, out));
    return out;
  }

  function bfsOrder() {
    if (!root) return [];
    const order = [];
    const queue = [root];

    while (queue.length) {
      const node = queue.shift();
      order.push(node);
      queue.push(...node.children);
    }

    return order;
  }

  async function animateTraversal(order, name) {
    if (!order.length) return;

    token++;
    const localToken = token;
    running = true;
    setRunning(true);
    clearHighlightData();
    el.result.textContent = "—";

    try {
      const visitedLabels = [];

      for (let i = 0; i < order.length; i++) {
        if (localToken !== token) throw new Error("cancelled");

        const node = order[i];
        highlight.visited.add(node.id);

        if (node.parent && highlight.visited.has(node.parent.id)) {
          highlight.activeEdges.add(edgeKey(node.parent, node));
        }

        visitedLabels.push(node.label);
        el.result.textContent = visitedLabels.join(" → ");
        render();
        setStatus(`${name}: visiting ${node.label}...`);
        await wait(DELAY);
      }

      if (localToken !== token) return;
      running = false;
      setRunning(false);
      render();
      setStatus(`${name} complete.`, "success");
    } catch (error) {
      if (error?.message !== "cancelled") {
        running = false;
        setRunning(false);
        render();
        setStatus("Traversal stopped.", "error");
      }
    }
  }

  function runDFS() {
    animateTraversal(dfsOrder(root), "DFS");
  }

  function runBFS() {
    animateTraversal(bfsOrder(), "BFS");
  }

  function loadExample() {
    token++;
    running = false;
    nextId = 1;

    root = createNode("A");

    const b = createNode("B", root);
    const c = createNode("C", root);
    const d = createNode("D", root);
    root.children.push(b, c, d);

    const e = createNode("E", b);
    const f = createNode("F", b);
    b.children.push(e, f);

    const g = createNode("G", c);
    c.children.push(g);

    const h = createNode("H", d);
    const i = createNode("I", d);
    d.children.push(h, i);

    const j = createNode("J", f);
    f.children.push(j);

    selectedId = root.id;
    clearHighlightData();
    el.result.textContent = "—";
    setRunning(false);
    render();
    setStatus("Example tree loaded.", "success");
  }

  function clearHighlights() {
    if (running) return;
    clearHighlightData();
    el.result.textContent = "—";
    render();
    setStatus("Highlights cleared.");
  }

  function cancel() {
    if (!running) return;
    token++;
    running = false;
    clearHighlightData();
    setRunning(false);
    render();
    setStatus("Animation cancelled.");
  }

  el.add.addEventListener("click", addChild);
  el.root.addEventListener("click", selectRoot);
  el.remove.addEventListener("click", removeSubtree);
  el.ancestors.addEventListener("click", showAncestors);
  el.descendants.addEventListener("click", showDescendants);
  el.dfs.addEventListener("click", runDFS);
  el.bfs.addEventListener("click", runBFS);
  el.load.addEventListener("click", loadExample);
  el.clearHighlights.addEventListener("click", clearHighlights);
  el.cancel.addEventListener("click", cancel);

  el.cancel.disabled = true;
  loadExample();
})();
</script>
