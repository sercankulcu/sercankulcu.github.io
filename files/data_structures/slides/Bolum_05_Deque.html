<style>
.deque-sim,
.deque-sim *,
.deque-sim *::before,
.deque-sim *::after { box-sizing: border-box; }

.deque-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));
  min-height: 470px;
  margin: 6px auto 0;
  padding: 10px;
  color: var(--sim-text);
  font-family: inherit;
  overflow: hidden;
}

.deque-shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
}

.deque-title {
  margin: 0;
  color: var(--sim-text);
  text-align: center;
  font-size: 1.45rem;
  line-height: 1.15;
}

.deque-controls {
  display: grid;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-softer);
}

.deque-row {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 5px;
  align-items: end;
}

.deque-field {
  display: grid;
  grid-column: span 2;
  gap: 2px;
  min-width: 0;
}

.deque-field label {
  display: block;
  margin: 0 !important;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.deque-field input {
  width: 100%;
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 3px 6px;
  border: 1px solid var(--sim-border);
  border-radius: 6px;
  background: var(--sim-bg);
  color: var(--sim-text);
  font: inherit;
  line-height: 1;
  vertical-align: top;
}

.deque-btn {
  height: 31px;
  min-height: 31px;
  margin: 0 !important;
  padding: 0 6px;
  border: 1px solid var(--sim-accent);
  border-radius: 6px;
  background: var(--sim-accent);
  color: #fff;
  font: inherit;
  font-size: 10.7px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: end;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease, filter .12s ease;
}

.deque-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.deque-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.deque-btn.success {
  background: var(--sim-ok);
  border-color: var(--sim-ok);
}

.deque-btn.danger {
  background: var(--sim-danger);
  border-color: var(--sim-danger);
}

.span2 { grid-column: span 2; }

.deque-stage {
  min-height: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  border: 1px solid var(--sim-border);
  border-radius: 10px;
  background: var(--sim-bg);
  overflow: hidden;
}

.deque-labels {
  display: flex;
  justify-content: space-between;
  padding: 7px 12px 4px;
  color: var(--sim-accent);
  font-size: 10px;
  font-weight: 800;
}

.deque-track-wrap {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px;
}

.deque-track {
  width: 100%;
  min-height: 176px;
  padding: 16px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  overflow: hidden;
  border: 4px solid color-mix(in srgb, var(--sim-accent) 78%, var(--sim-border));
  border-left-width: 10px;
  border-right-width: 10px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--sim-accent) 5%, var(--sim-bg));
}

.deque-item {
  flex: 1 1 0;
  min-width: 58px;
  max-width: 82px;
  min-height: 72px;
  padding: 6px;
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  border: 2px solid var(--sim-accent);
  border-radius: 8px;
  background: var(--sim-soft);
  font-size: 13px;
  font-weight: 800;
  transition: transform .18s ease, opacity .18s ease, background .18s ease, border-color .18s ease;
}

.deque-item small {
  font-size: 9px;
  font-weight: 700;
  opacity: .55;
}

.deque-item.checking {
  background: #fef3c7;
  border-color: var(--sim-warn);
  color: #4a3100;
  transform: translateY(-4px);
}

.deque-item.found,
.deque-item.adding {
  background: #dcfce7;
  border-color: var(--sim-ok);
  color: #14532d;
  transform: translateY(-4px) scale(1.02);
}

.deque-item.removing-left {
  background: #fee2e2;
  border-color: var(--sim-danger);
  color: #7f1d1d;
  transform: translateX(-10px);
  opacity: .65;
}

.deque-item.removing-right {
  background: #fee2e2;
  border-color: var(--sim-danger);
  color: #7f1d1d;
  transform: translateX(10px);
  opacity: .65;
}

.deque-empty {
  width: 100%;
  text-align: center;
  font-size: 12px;
  opacity: .55;
}

.deque-status {
  min-height: 34px;
  padding: 7px 10px;
  border-top: 1px solid var(--sim-border);
  background: var(--sim-softer);
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
}

.deque-status.success { color: var(--sim-ok); }
.deque-status.error { color: var(--sim-danger); }
.deque-status.warning { color: var(--sim-warn); }

.deque-footer {
  display: grid;
  grid-template-columns: 1.45fr repeat(4, .72fr);
  gap: 5px;
}

.deque-stat {
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid var(--sim-border);
  border-radius: 7px;
  background: var(--sim-softer);
  font-size: 10.5px;
  line-height: 1.2;
}

.deque-stat strong {
  display: block;
  margin-bottom: 2px;
  font-size: 9px;
  opacity: .6;
  text-transform: uppercase;
  letter-spacing: .03em;
}

@media (max-width: 700px) {
  .deque-sim {
    width: calc(100vw - 10px);
    height: auto;
    min-height: 0;

  }

  .deque-shell { grid-template-rows: auto; }
  .deque-row { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .deque-field, .span2 { grid-column: span 2; }
  .deque-track { min-height: 150px; overflow-x: auto; justify-content: flex-start; }
  .deque-item { flex: 0 0 68px; }
  .deque-footer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-height: 620px) and (min-width: 701px) {
  .deque-sim {

  .deque-title { font-size: 1.25rem; }

  .deque-btn, .deque-field input { height: 28px; min-height: 28px; }

}

:root[data-theme="dark"] .deque-item.found,

:root[data-theme="dark"] .deque-item.removing-left,

@media (prefers-reduced-motion: reduce) {
  .deque-sim *,

<div class="deque-sim">
  <div class="deque-shell">
    <h1 class="deque-title">Deque Simulator</h1>

    <div class="deque-controls">
      <div class="deque-row">
        <div class="deque-field">
          <label for="deque-value">Value</label>
          <input id="deque-value" type="number" value="42" inputmode="numeric">
        </div>
        <div class="deque-field">
          <label for="deque-capacity">Capacity</label>
          <input id="deque-capacity" type="number" min="1" max="8" value="8" inputmode="numeric">
        </div>
        <button class="deque-btn success span2" id="deque-add-first" type="button">Add First</button>
        <button class="deque-btn success span2" id="deque-add-last" type="button">Add Last</button>
        <button class="deque-btn danger span2" id="deque-remove-first" type="button">Remove First</button>
        <button class="deque-btn danger span2" id="deque-remove-last" type="button">Remove Last</button>
      </div>

      <div class="deque-row">
        <button class="deque-btn span2" id="deque-peek-first" type="button">Peek First</button>
        <button class="deque-btn span2" id="deque-peek-last" type="button">Peek Last</button>
        <button class="deque-btn span2" id="deque-search" type="button">Search</button>
        <button class="deque-btn span2" id="deque-traverse" type="button">Traverse</button>
        <button class="deque-btn success span2" id="deque-load" type="button">Load</button>
        <button class="deque-btn success span2" id="deque-random" type="button">Random</button>
      </div>

      <div class="deque-row">
        <button class="deque-btn danger span2" id="deque-clear" type="button">Clear</button>
        <button class="deque-btn danger span2" id="deque-cancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="deque-stage">
      <div class="deque-labels">
        <span>FRONT</span>
        <span>REAR</span>
      </div>

      <div class="deque-track-wrap">
        <div class="deque-track" id="deque-track"></div>
      </div>

      <div class="deque-status" id="deque-status" aria-live="polite">Ready.</div>
    </div>

    <div class="deque-footer">
      <div class="deque-stat"><strong>Operation</strong><span id="deque-operation">Idle</span></div>
      <div class="deque-stat"><strong>Size</strong><span id="deque-size">0</span></div>
      <div class="deque-stat"><strong>Capacity</strong><span id="deque-capacity-stat">8</span></div>
      <div class="deque-stat"><strong>Front</strong><span id="deque-front-stat">—</span></div>
      <div class="deque-stat"><strong>Rear</strong><span id="deque-rear-stat">—</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const el = {
    value: $("deque-value"),
    capacity: $("deque-capacity"),
    addFirst: $("deque-add-first"),
    addLast: $("deque-add-last"),
    removeFirst: $("deque-remove-first"),
    removeLast: $("deque-remove-last"),
    peekFirst: $("deque-peek-first"),
    peekLast: $("deque-peek-last"),
    search: $("deque-search"),
    traverse: $("deque-traverse"),
    load: $("deque-load"),
    random: $("deque-random"),
    clear: $("deque-clear"),
    cancel: $("deque-cancel"),
    track: $("deque-track"),
    status: $("deque-status"),
    operation: $("deque-operation"),
    size: $("deque-size"),
    capacityStat: $("deque-capacity-stat"),
    frontStat: $("deque-front-stat"),
    rearStat: $("deque-rear-stat")
  };

  const DELAY = 280;
  const MAX_CAPACITY = 8;

  let data = [18, 31, 47, 62];
  let token = 0;
  let running = false;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function integer(input) {
    const value = Number(input.value);
    return Number.isInteger(value) ? value : null;
  }

  function capacity() {
    let value = Number(el.capacity.value);
    if (!Number.isInteger(value)) value = 8;
    value = Math.max(1, Math.min(MAX_CAPACITY, value));
    el.capacity.value = value;
    return value;
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "deque-status" + (type ? " " + type : "");
  }

  function updateStats() {
    const cap = capacity();
    el.size.textContent = data.length;
    el.capacityStat.textContent = cap;
    el.frontStat.textContent = data.length ? data[0] : "—";
    el.rearStat.textContent = data.length ? data[data.length - 1] : "—";
  }

  function setRunning(value) {
    running = value;
    [
      el.addFirst, el.addLast, el.removeFirst, el.removeLast,
      el.peekFirst, el.peekLast, el.search, el.traverse,
      el.load, el.random, el.clear
    ].forEach(button => button.disabled = value);
    el.cancel.disabled = !value;
  }

  function render(states = {}) {
    el.track.innerHTML = "";

    if (!data.length) {
      const empty = document.createElement("div");
      empty.className = "deque-empty";
      empty.textContent = "Deque is empty.";
      el.track.appendChild(empty);
      updateStats();
      return;
    }

    data.forEach((value, index) => {
      const item = document.createElement("div");
      item.className = "deque-item";

      if (states.checking?.includes(index)) item.classList.add("checking");
      if (states.found?.includes(index)) item.classList.add("found");
      if (states.adding?.includes(index)) item.classList.add("adding");
      if (states.removingLeft?.includes(index)) item.classList.add("removing-left");
      if (states.removingRight?.includes(index)) item.classList.add("removing-right");

      const main = document.createElement("span");
      main.textContent = value;

      const small = document.createElement("small");
      if (data.length === 1) {
        small.textContent = "FRONT / REAR";
      } else if (index === 0) {
        small.textContent = "FRONT";
      } else if (index === data.length - 1) {
        small.textContent = "REAR";
      } else {
        small.textContent = `#${index}`;
      }

      item.append(main, small);
      el.track.appendChild(item);
    });

    updateStats();
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  async function animate(localToken, states, message) {
    if (message) setStatus(message);
    render(states);
    await pause(localToken);
  }

  function begin(operation) {
    token++;
    el.operation.textContent = operation;
    setRunning(true);
    return token;
  }

  function finish(localToken, message, type = "") {
    if (localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  function ensureSpace() {
    if (data.length >= capacity()) {
      setStatus("Deque is full.", "error");
      return false;
    }
    return true;
  }

  function ensureItems() {
    if (!data.length) {
      setStatus("Deque is empty.", "error");
      return false;
    }
    return true;
  }

  async function addFirst() {
    if (!ensureSpace()) return;

    const value = integer(el.value);
    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin("Add First");

    try {
      data.unshift(value);
      await animate(t, { adding: [0] }, `Adding ${value} at FRONT...`);
      finish(t, `Added ${value} at FRONT.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function addLast() {
    if (!ensureSpace()) return;

    const value = integer(el.value);
    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    const t = begin("Add Last");

    try {
      data.push(value);
      await animate(t, { adding: [data.length - 1] }, `Adding ${value} at REAR...`);
      finish(t, `Added ${value} at REAR.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function removeFirst() {
    if (!ensureItems()) return;

    const value = data[0];
    const t = begin("Remove First");

    try {
      await animate(t, { removingLeft: [0] }, `Removing FRONT value ${value}...`);
      data.shift();
      finish(t, `Removed ${value} from FRONT.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function removeLast() {
    if (!ensureItems()) return;

    const index = data.length - 1;
    const value = data[index];
    const t = begin("Remove Last");

    try {
      await animate(t, { removingRight: [index] }, `Removing REAR value ${value}...`);
      data.pop();
      finish(t, `Removed ${value} from REAR.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function peekFirst() {
    if (!ensureItems()) return;

    const t = begin("Peek First");

    try {
      await animate(t, { found: [0] }, `FRONT = ${data[0]}`);
      finish(t, `Front value is ${data[0]}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function peekLast() {
    if (!ensureItems()) return;

    const index = data.length - 1;
    const t = begin("Peek Last");

    try {
      await animate(t, { found: [index] }, `REAR = ${data[index]}`);
      finish(t, `Rear value is ${data[index]}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function search() {
    if (!ensureItems()) return;

    const target = integer(el.value);
    if (target === null) {
      setStatus("Enter an integer value to search.", "error");
      return;
    }

    const t = begin("Search");

    try {
      for (let i = 0; i < data.length; i++) {
        await animate(t, { checking: [i] }, `Comparing ${data[i]} with ${target}...`);

        if (data[i] === target) {
          await animate(t, { found: [i] }, `Found ${target} at index ${i}.`);
          finish(t, `Found ${target} at index ${i}.`, "success");
          return;
        }
      }

      finish(t, `${target} not found.`, "error");
    } catch (error) {
      fail(t, error);
    }
  }

  async function traverse() {
    if (!ensureItems()) return;

    const t = begin("Traverse");

    try {
      for (let i = 0; i < data.length; i++) {
        await animate(t, { checking: [i] }, `Visiting index ${i}: ${data[i]}`);
      }
      finish(t, `Traversal: ${data.join(" → ")}`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function loadExample() {
    token++;
    running = false;
    const cap = capacity();
    data = [12, 28, 41, 56, 73].slice(0, cap);
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Example deque loaded.", "success");
  }

  function randomize() {
    token++;
    running = false;
    const cap = capacity();
    const count = Math.min(cap, Math.max(3, Math.ceil(cap * 0.75)));
    data = Array.from({ length: count }, () => Math.floor(Math.random() * 90) + 10);
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Random deque loaded.", "success");
  }

  function clearDeque() {
    token++;
    running = false;
    data = [];
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Deque cleared.");
  }

  function cancel() {
    if (!running) return;
    token++;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  function capacityChanged() {
    const cap = capacity();
    if (data.length > cap) {
      data = data.slice(0, cap);
      setStatus("Capacity reduced; extra rear items removed.", "warning");
    } else {
      setStatus(`Capacity set to ${cap}.`);
    }
    render();
  }

  el.addFirst.addEventListener("click", addFirst);
  el.addLast.addEventListener("click", addLast);
  el.removeFirst.addEventListener("click", removeFirst);
  el.removeLast.addEventListener("click", removeLast);
  el.peekFirst.addEventListener("click", peekFirst);
  el.peekLast.addEventListener("click", peekLast);
  el.search.addEventListener("click", search);
  el.traverse.addEventListener("click", traverse);
  el.load.addEventListener("click", loadExample);
  el.random.addEventListener("click", randomize);
  el.clear.addEventListener("click", clearDeque);
  el.cancel.addEventListener("click", cancel);
  el.capacity.addEventListener("change", capacityChanged);

  el.cancel.disabled = true;
  render();
})();
</script>
