.btree-sim {
  --sim-bg: var(--global-bg-color, #ffffff);
  --sim-text: var(--global-text-color, #2f3437);
  --sim-accent: var(--global-link-color, #2a7ae2);
  --sim-border: var(--global-border-color, #d9dee3);
  --sim-soft: color-mix(in srgb, var(--sim-accent) 6%, var(--sim-bg));
  --sim-softer: color-mix(in srgb, var(--sim-accent) 2.5%, var(--sim-bg));
  --sim-ok: #15803d;
  --sim-warn: #d97706;
  --sim-danger: #b91c1c;
  --sim-visit: #7c3aed;

  width: min(780px, calc(100vw - 18px));
  height: min(548px, calc(100vh - 58px));

.btree-shell {

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";

  const el = {
    degree: $("btree-degree"),
    value: $("btree-value"),
    insert: $("btree-insert"),
    search: $("btree-search"),
    del: $("btree-delete"),
    traverse: $("btree-traverse"),
    load: $("btree-load"),
    random: $("btree-random"),
    reset: $("btree-reset"),
    cancel: $("btree-cancel"),
    svg: $("btree-svg"),
    status: $("btree-status"),
    operation: $("btree-operation"),
    keys: $("btree-keys"),
    nodes: $("btree-nodes"),
    height: $("btree-height"),
    changes: $("btree-changes"),
    result: $("btree-result")
  };

  const MAX_KEYS = 15;
  const DELAY = 280;

  let tree = null;
  let token = 0;
  let running = false;
  let structuralChanges = 0;
  let lastResult = "—";

  let marks = {
    checking: new Set(),
    found: new Set(),
    visited: new Set(),
    changed: new Set(),
    removing: new Set(),
    activeEdges: new Set()
  };

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  class BNode {
    constructor(leaf = true) {
      this.id = BNode.nextId++;
      this.leaf = leaf;
      this.keys = [];
      this.children = [];
    }
  }
  BNode.nextId = 1;

  class BTree {
    constructor(t) {
      this.t = t;
      this.root = null;
      this.changeLog = [];
    }

    log(type, nodes = []) {
      this.changeLog.push({
        type,
        nodeIds: nodes.filter(Boolean).map(node => node.id)
      });
    }

    clearLog() {
      this.changeLog = [];
    }

    search(value) {
      const path = [];
      let node = this.root;

      while (node) {
        path.push(node);
        let i = 0;

        while (i < node.keys.length && value > node.keys[i]) i++;

        if (i < node.keys.length && value === node.keys[i]) {
          return { found: true, node, index: i, path };
        }

        if (node.leaf) break;
        node = node.children[i] || null;
      }

      return { found: false, node: null, index: -1, path };
    }

    insert(value) {
      this.clearLog();

      if (!this.root) {
        this.root = new BNode(true);
        this.root.keys.push(value);
        this.log("new root", [this.root]);
        return true;
      }

      if (this.search(value).found) return false;

      const maxKeys = 2 * this.t - 1;

      if (this.root.keys.length === maxKeys) {
        const oldRoot = this.root;
        const newRoot = new BNode(false);
        newRoot.children.push(oldRoot);
        this.root = newRoot;
        this.splitChild(newRoot, 0);
        this.log("new root", [newRoot]);
      }

      this.insertNonFull(this.root, value);
      return true;
    }

    insertNonFull(node, value) {
      let i = node.keys.length - 1;

      if (node.leaf) {
        node.keys.push(value);
        while (i >= 0 && value < node.keys[i]) {
          node.keys[i + 1] = node.keys[i];
          i--;
        }
        node.keys[i + 1] = value;
        return;
      }

      while (i >= 0 && value < node.keys[i]) i--;
      i++;

      if (node.children[i].keys.length === 2 * this.t - 1) {
        this.splitChild(node, i);

        if (value > node.keys[i]) i++;
      }

      this.insertNonFull(node.children[i], value);
    }

    splitChild(parent, index) {
      const t = this.t;
      const full = parent.children[index];
      const right = new BNode(full.leaf);
      const median = full.keys[t - 1];

      right.keys = full.keys.slice(t);
      full.keys = full.keys.slice(0, t - 1);

      if (!full.leaf) {
        right.children = full.children.slice(t);
        full.children = full.children.slice(0, t);
      }

      parent.keys.splice(index, 0, median);
      parent.children.splice(index + 1, 0, right);
      this.log("split", [parent, full, right]);
    }

    delete(value) {
      this.clearLog();

      if (!this.root || !this.search(value).found) return false;

      this.remove(this.root, value);

      if (this.root && this.root.keys.length === 0) {
        if (this.root.leaf) {
          this.root = null;
        } else {
          const oldRoot = this.root;
          this.root = this.root.children[0] || null;
          this.log("root shrink", [oldRoot, this.root]);
        }
      }

      return true;
    }

    findKey(node, value) {
      let index = 0;
      while (index < node.keys.length && node.keys[index] < value) index++;
      return index;
    }

    remove(node, value) {
      const index = this.findKey(node, value);

      if (index < node.keys.length && node.keys[index] === value) {
        if (node.leaf) {
          node.keys.splice(index, 1);
          this.log("remove key", [node]);
        } else {
          this.removeFromInternal(node, index);
        }
        return;
      }

      if (node.leaf) return;

      const wasLastChild = index === node.keys.length;

      if (node.children[index].keys.length < this.t) {
        this.fill(node, index);
      }

      if (wasLastChild && index > node.keys.length) {
        this.remove(node.children[index - 1], value);
      } else {
        this.remove(node.children[index], value);
      }
    }

    removeFromInternal(node, index) {
      const value = node.keys[index];

      if (node.children[index].keys.length >= this.t) {
        const predecessor = this.getPredecessor(node.children[index]);
        node.keys[index] = predecessor;
        this.log("replace by predecessor", [node]);
        this.remove(node.children[index], predecessor);
        return;
      }

      if (node.children[index + 1].keys.length >= this.t) {
        const successor = this.getSuccessor(node.children[index + 1]);
        node.keys[index] = successor;
        this.log("replace by successor", [node]);
        this.remove(node.children[index + 1], successor);
        return;
      }

      this.merge(node, index);
      this.remove(node.children[index], value);
    }

    getPredecessor(node) {
      let current = node;
      while (!current.leaf) current = current.children[current.children.length - 1];
      return current.keys[current.keys.length - 1];
    }

    getSuccessor(node) {
      let current = node;
      while (!current.leaf) current = current.children[0];
      return current.keys[0];
    }

    fill(node, index) {
      if (index !== 0 && node.children[index - 1].keys.length >= this.t) {
        this.borrowFromPrevious(node, index);
        return;
      }

      if (index !== node.keys.length && node.children[index + 1].keys.length >= this.t) {
        this.borrowFromNext(node, index);
        return;
      }

      if (index !== node.keys.length) {
        this.merge(node, index);
      } else {
        this.merge(node, index - 1);
      }
    }

    borrowFromPrevious(node, index) {
      const child = node.children[index];
      const sibling = node.children[index - 1];

      child.keys.unshift(node.keys[index - 1]);

      if (!child.leaf) {
        child.children.unshift(sibling.children.pop());
      }

      node.keys[index - 1] = sibling.keys.pop();
      this.log("borrow left", [node, child, sibling]);
    }

    borrowFromNext(node, index) {
      const child = node.children[index];
      const sibling = node.children[index + 1];

      child.keys.push(node.keys[index]);

      if (!child.leaf) {
        child.children.push(sibling.children.shift());
      }

      node.keys[index] = sibling.keys.shift();
      this.log("borrow right", [node, child, sibling]);
    }

    merge(node, index) {
      const child = node.children[index];
      const sibling = node.children[index + 1];

      child.keys.push(node.keys[index], ...sibling.keys);

      if (!child.leaf) {
        child.children.push(...sibling.children);
      }

      node.keys.splice(index, 1);
      node.children.splice(index + 1, 1);
      this.log("merge", [node, child, sibling]);
    }

    sortedEntries() {
      const result = [];

      function walk(node) {
        if (!node) return;

        for (let i = 0; i < node.keys.length; i++) {
          if (!node.leaf) walk(node.children[i]);
          result.push({ node, key: node.keys[i] });
        }

        if (!node.leaf) walk(node.children[node.keys.length]);
      }

      walk(this.root);
      return result;
    }

    allNodes() {
      const out = [];

      function walk(node) {
        if (!node) return;
        out.push(node);
        node.children.forEach(walk);
      }

      walk(this.root);
      return out;
    }

    height() {
      let h = 0;
      let node = this.root;

      while (node && !node.leaf) {
        h++;
        node = node.children[0];
      }

      return this.root ? h : 0;
    }
  }

  function degree() {
    const value = Number(el.degree.value);
    return [2, 3, 4].includes(value) ? value : 2;
  }

  function readValue() {
    const value = Number(el.value.value);
    return Number.isInteger(value) ? value : null;
  }

  function clearMarks() {
    marks.checking.clear();
    marks.found.clear();
    marks.visited.clear();
    marks.changed.clear();
    marks.removing.clear();
    marks.activeEdges.clear();
  }

  function setStatus(text, type = "") {
    el.status.textContent = text;
    el.status.className = "btree-status" + (type ? " " + type : "");
  }

  function setRunning(value) {
    running = value;
    [
      el.insert, el.search, el.del, el.traverse,
      el.load, el.random, el.reset, el.degree
    ].forEach(control => control.disabled = value);
    el.cancel.disabled = !value;
  }

  function updateStats() {
    const entries = tree ? tree.sortedEntries() : [];
    const nodes = tree ? tree.allNodes() : [];

    el.keys.textContent = `${entries.length} / ${MAX_KEYS}`;
    el.nodes.textContent = nodes.length;
    el.height.textContent = tree && tree.root ? tree.height() : 0;
    el.changes.textContent = structuralChanges;
    el.result.textContent = lastResult;
  }

  function subtreeWeight(node) {
    if (!node) return 1;
    if (node.leaf) return Math.max(1, node.keys.length);
    return node.children.reduce((sum, child) => sum + subtreeWeight(child), 0);
  }

  function layoutTree() {
    const positions = new Map();
    if (!tree || !tree.root) return positions;

    const h = Math.max(1, tree.height());
    const topY = 34;
    const bottomY = 258;
    const gapY = h ? (bottomY - topY) / h : 0;
    const margin = 34;
    const totalWidth = 740 - margin * 2;

    function walk(node, depth, left, right) {
      const x = (left + right) / 2;
      positions.set(node.id, { x, y: topY + depth * gapY });

      if (node.leaf || !node.children.length) return;

      const weights = node.children.map(subtreeWeight);
      const total = weights.reduce((a, b) => a + b, 0) || 1;
      let cursor = left;

      node.children.forEach((child, index) => {
        const span = (right - left) * (weights[index] / total);
        walk(child, depth + 1, cursor, cursor + span);
        cursor += span;
      });
    }

    walk(tree.root, 0, margin, margin + totalWidth);
    return positions;
  }

  function svgElement(name, attrs = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function nodeClass(node) {
    const classes = ["btree-node"];

    if (marks.checking.has(node.id)) classes.push("checking");
    if (marks.found.has(node.id)) classes.push("found");
    if (marks.visited.has(node.id)) classes.push("visited");
    if (marks.changed.has(node.id)) classes.push("changed");
    if (marks.removing.has(node.id)) classes.push("removing");

    return classes.join(" ");
  }

  function render() {
    el.svg.innerHTML = "";

    if (!tree || !tree.root) {
      const text = svgElement("text", {
        x: 370,
        y: 145,
        "text-anchor": "middle",
        fill: "currentColor",
        opacity: ".55",
        "font-size": "14"
      });
      text.textContent = "B-Tree is empty.";
      el.svg.appendChild(text);
      updateStats();
      return;
    }

    const positions = layoutTree();
    const nodes = tree.allNodes();
    const keyWidth = 29;
    const nodeHeight = 34;

    for (let d = 0; d <= tree.height(); d++) {
      const sample = nodes.find(node => {
        let depth = 0;
        let current = tree.root;
        if (node === tree.root) return d === 0;
        const queue = [{ n: tree.root, depth: 0 }];
        while (queue.length) {
          const item = queue.shift();
          if (item.n === node) return item.depth === d;
          item.n.children.forEach(child => queue.push({ n: child, depth: item.depth + 1 }));
        }
        return false;
      });

      if (!sample) continue;
      const p = positions.get(sample.id);

      const label = svgElement("text", {
        x: 7,
        y: p.y + 3,
        class: "btree-depth-label"
      });
      label.textContent = `d${d}`;
      el.svg.appendChild(label);
    }

    nodes.forEach(parent => {
      if (parent.leaf) return;
      const p = positions.get(parent.id);
      const parentWidth = Math.max(keyWidth, parent.keys.length * keyWidth);

      parent.children.forEach((child, index) => {
        const c = positions.get(child.id);
        if (!c) return;

        const childWidth = Math.max(keyWidth, child.keys.length * keyWidth);
        const parentAnchor =
          p.x - parentWidth / 2 +
          (parent.children.length > 1
            ? (parentWidth * index) / (parent.children.length - 1)
            : parentWidth / 2);

        const line = svgElement("line", {
          x1: parentAnchor,
          y1: p.y + nodeHeight / 2,
          x2: c.x,
          y2: c.y - nodeHeight / 2,
          class: "btree-edge" +
            (marks.activeEdges.has(`${parent.id}-${child.id}`) ? " active" : "")
        });

        el.svg.appendChild(line);
      });
    });

    nodes.forEach(node => {
      const p = positions.get(node.id);
      const width = Math.max(keyWidth, node.keys.length * keyWidth);
      const x = p.x - width / 2;
      const y = p.y - nodeHeight / 2;

      const group = svgElement("g", { class: nodeClass(node) });

      const rect = svgElement("rect", {
        x,
        y,
        width,
        height: nodeHeight,
        class: "btree-node-box"
      });
      group.appendChild(rect);

      node.keys.forEach((key, index) => {
        if (index > 0) {
          const separator = svgElement("line", {
            x1: x + index * keyWidth,
            y1: y,
            x2: x + index * keyWidth,
            y2: y + nodeHeight,
            class: "btree-key-line"
          });
          group.appendChild(separator);
        }

        const text = svgElement("text", {
          x: x + index * keyWidth + keyWidth / 2,
          y: p.y + 1,
          class: "btree-key-text"
        });
        text.textContent = key;
        group.appendChild(text);
      });

      el.svg.appendChild(group);
    });

    updateStats();
  }

  async function pause(localToken) {
    await wait(DELAY);
    if (localToken !== token) throw new Error("cancelled");
  }

  function begin(operation) {
    token++;
    clearMarks();
    structuralChanges = 0;
    lastResult = "—";
    el.operation.textContent = operation;
    setRunning(true);
    render();
    return token;
  }

  function finish(localToken, message, type = "") {
    if (localToken !== token) return;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus(message, type);
    render();
  }

  function fail(localToken, error) {
    if (error?.message === "cancelled" || localToken !== token) return;
    running = false;
    setRunning(false);
    el.operation.textContent = "Idle";
    setStatus("Operation stopped.", "error");
    render();
  }

  async function animateSearchPath(localToken, value, finalFound = true) {
    const result = tree.search(value);
    let previous = null;

    for (const node of result.path) {
      marks.checking.clear();
      marks.checking.add(node.id);

      if (previous) {
        marks.activeEdges.add(`${previous.id}-${node.id}`);
      }

      render();
      setStatus(`Checking node [${node.keys.join(", ")}]...`);
      await pause(localToken);
      previous = node;
    }

    marks.checking.clear();

    if (result.found && finalFound) {
      marks.found.add(result.node.id);
      render();
      await pause(localToken);
    }

    return result;
  }

  function applyChangeMarks() {
    clearMarks();
    structuralChanges = tree.changeLog.length;

    tree.changeLog.forEach(entry => {
      entry.nodeIds.forEach(id => marks.changed.add(id));
    });
  }

  async function insertValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (tree.sortedEntries().length >= MAX_KEYS) {
      setStatus(`Maximum ${MAX_KEYS} keys.`, "error");
      return;
    }

    const t = begin("Insert");

    try {
      const lookup = await animateSearchPath(t, value, true);

      if (lookup.found) {
        clearMarks();
        lastResult = "duplicate";
        finish(t, `${value} already exists.`, "error");
        return;
      }

      clearMarks();
      tree.insert(value);
      applyChangeMarks();
      lastResult = value;
      render();

      if (structuralChanges) {
        const types = tree.changeLog.map(item => item.type).join(", ");
        setStatus(`Inserted ${value}. Structural change: ${types}.`);
        await pause(t);
      }

      clearMarks();
      finish(t, `Inserted ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function searchValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (!tree.root) {
      setStatus("B-Tree is empty.", "error");
      return;
    }

    const t = begin("Search");

    try {
      const result = await animateSearchPath(t, value, true);
      clearMarks();

      if (result.found) {
        lastResult = value;
        finish(t, `Found ${value}.`, "success");
      } else {
        lastResult = "not found";
        finish(t, `${value} not found.`, "error");
      }
    } catch (error) {
      fail(t, error);
    }
  }

  async function deleteValue() {
    const value = readValue();

    if (value === null) {
      setStatus("Enter an integer value.", "error");
      return;
    }

    if (!tree.root) {
      setStatus("B-Tree is empty.", "error");
      return;
    }

    const t = begin("Delete");

    try {
      const lookup = await animateSearchPath(t, value, true);

      if (!lookup.found) {
        clearMarks();
        lastResult = "not found";
        finish(t, `${value} not found.`, "error");
        return;
      }

      marks.found.clear();
      marks.removing.add(lookup.node.id);
      render();
      setStatus(`Deleting ${value}...`);
      await pause(t);

      clearMarks();
      tree.delete(value);
      applyChangeMarks();
      lastResult = value;
      render();

      if (structuralChanges) {
        const types = tree.changeLog.map(item => item.type).join(", ");
        setStatus(`Deleted ${value}. Structural change: ${types}.`);
        await pause(t);
      }

      clearMarks();
      finish(t, `Deleted ${value}.`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  async function traverse() {
    if (!tree.root) {
      setStatus("B-Tree is empty.", "error");
      return;
    }

    const t = begin("Sorted Traversal");

    try {
      const entries = tree.sortedEntries();
      const result = [];

      for (const entry of entries) {
        marks.visited.add(entry.node.id);
        result.push(entry.key);
        lastResult = result.join(" → ");
        render();
        setStatus(`Traversal: ${entry.key}`);
        await pause(t);
      }

      clearMarks();
      lastResult = result.join(" → ");
      finish(t, `Sorted: ${lastResult}`, "success");
    } catch (error) {
      fail(t, error);
    }
  }

  function loadValues(values, message) {
    token++;
    running = false;
    BNode.nextId = 1;
    tree = new BTree(degree());

    values.slice(0, MAX_KEYS).forEach(value => tree.insert(value));

    tree.clearLog();
    structuralChanges = 0;
    lastResult = "—";
    clearMarks();
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus(message, "success");
  }

  function loadExample() {
    loadValues(
      [10, 20, 5, 6, 12, 30, 7, 17, 3, 4, 15],
      `Example B-Tree loaded (t=${degree()}).`
    );
  }

  function randomTree() {
    const values = new Set();

    while (values.size < 12) {
      values.add(Math.floor(Math.random() * 90) + 10);
    }

    loadValues([...values], `Random B-Tree loaded (t=${degree()}).`);
  }

  function resetTree() {
    token++;
    running = false;
    BNode.nextId = 1;
    tree = new BTree(degree());
    structuralChanges = 0;
    lastResult = "—";
    clearMarks();
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("B-Tree cleared.");
  }

  function cancel() {
    if (!running) return;
    token++;
    running = false;
    clearMarks();
    setRunning(false);
    el.operation.textContent = "Idle";
    render();
    setStatus("Animation cancelled.");
  }

  el.insert.addEventListener("click", insertValue);
  el.search.addEventListener("click", searchValue);
  el.del.addEventListener("click", deleteValue);
  el.traverse.addEventListener("click", traverse);
  el.load.addEventListener("click", loadExample);
  el.random.addEventListener("click", randomTree);
  el.reset.addEventListener("click", resetTree);
  el.cancel.addEventListener("click", cancel);

  el.degree.addEventListener("change", () => {
    loadExample();
  });

  el.cancel.disabled = true;
  loadExample();
})();
</script>
