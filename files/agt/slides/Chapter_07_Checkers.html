<script>
(() => {
  const root = document.querySelector('.agt-checkers');
  if (!root) return;

  const canvas = root.querySelector('.game-board');
  const ctx = canvas.getContext('2d');
  const statusEl = root.querySelector('.status');
  const depthSelect = root.querySelector('.depth-select');
  const newGameBtn = root.querySelector('.new-game-btn');

  const boardSize = 8;
  const cellSize = canvas.width / boardSize;

  let board = [];
  let currentPlayer = 'black';
  let selectedPiece = null;
  let minimaxDepth = 3;
  let gameVersion = 0;

  function updateDepth() {
    minimaxDepth = parseInt(depthSelect.value, 10);
  }

  function initializeBoard() {
    gameVersion++;
    board = [];

    for (let row = 0; row < boardSize; row++) {
      board[row] = [];

      for (let col = 0; col < boardSize; col++) {
        if ((row + col) % 2 === 1) {
          if (row < 3) board[row][col] = 'white';
          else if (row > 4) board[row][col] = 'black';
          else board[row][col] = null;
        } else {
          board[row][col] = null;
        }
      }
    }

    selectedPiece = null;
    currentPlayer = 'black';
    statusEl.textContent = 'Sıra: Oyuncu (Siyah)';
    drawBoard();
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let row = 0; row < boardSize; row++) {
      for (let col = 0; col < boardSize; col++) {
        ctx.fillStyle = (row + col) % 2 === 0 ? '#f3ead8' : '#b88a5a';
        ctx.fillRect(
          col * cellSize,
          row * cellSize,
          cellSize,
          cellSize
        );

        if (board[row][col]) {
          ctx.fillStyle =
            board[row][col] === 'black'
              ? '#1b1b1b'
              : '#c62828';

          ctx.beginPath();
          ctx.arc(
            col * cellSize + cellSize / 2,
            row * cellSize + cellSize / 2,
            cellSize / 3,
            0,
            Math.PI * 2
          );
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,.55)';
          ctx.lineWidth = 2;
          ctx.stroke();

          if (
            selectedPiece &&
            selectedPiece.row === row &&
            selectedPiece.col === col
          ) {
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = 4;
            ctx.stroke();
          }
        }
      }
    }
  }

  function getValidMoves(row, col) {
    const moves = [];
    const piece = board[row][col];

    if (!piece) return moves;

    const directions =
      piece === 'black'
        ? [[-1, -1], [-1, 1]]
        : [[1, -1], [1, 1]];

    for (const [dr, dc] of directions) {
      const jumpRow = row + 2 * dr;
      const jumpCol = col + 2 * dc;
      const midRow = row + dr;
      const midCol = col + dc;

      if (
        jumpRow >= 0 &&
        jumpRow < boardSize &&
        jumpCol >= 0 &&
        jumpCol < boardSize &&
        !board[jumpRow][jumpCol] &&
        board[midRow][midCol] &&
        board[midRow][midCol] !== piece
      ) {
        moves.push({
          row: jumpRow,
          col: jumpCol,
          isCapture: true,
          captured: {
            row: midRow,
            col: midCol
          }
        });
      }
    }

    if (moves.length === 0) {
      for (const [dr, dc] of directions) {
        const newRow = row + dr;
        const newCol = col + dc;

        if (
          newRow >= 0 &&
          newRow < boardSize &&
          newCol >= 0 &&
          newCol < boardSize &&
          !board[newRow][newCol]
        ) {
          moves.push({
            row: newRow,
            col: newCol,
            isCapture: false
          });
        }
      }
    }

    return moves;
  }

  function getAllMoves(player) {
    const pieces = [];

    for (let row = 0; row < boardSize; row++) {
      for (let col = 0; col < boardSize; col++) {
        if (board[row][col] === player) {
          const moves = getValidMoves(row, col);

          if (moves.length > 0) {
            pieces.push({ row, col, moves });
          }
        }
      }
    }

    return pieces;
  }

  function evaluateBoard() {
    let score = 0;

    for (let row = 0; row < boardSize; row++) {
      for (let col = 0; col < boardSize; col++) {
        if (board[row][col] === 'white') score += 1;
        if (board[row][col] === 'black') score -= 1;
      }
    }

    return score;
  }

  function minimax(depth, isMaximizing, alpha, beta) {
    if (depth === 0) {
      return { score: evaluateBoard() };
    }

    const player =
      isMaximizing ? 'white' : 'black';

    const pieces = getAllMoves(player);

    if (pieces.length === 0) {
      return {
        score: isMaximizing
          ? -Infinity
          : Infinity
      };
    }

    let bestMove = null;

    if (isMaximizing) {
      let maxEval = -Infinity;

      for (const piece of pieces) {
        for (const move of piece.moves) {
          const originalPiece =
            board[piece.row][piece.col];

          board[move.row][move.col] =
            originalPiece;

          board[piece.row][piece.col] =
            null;

          let capturedPiece = null;

          if (move.isCapture) {
            capturedPiece =
              board[move.captured.row][move.captured.col];

            board[move.captured.row][move.captured.col] =
              null;
          }

          const evaluation =
            minimax(
              depth - 1,
              false,
              alpha,
              beta
            ).score;

          board[piece.row][piece.col] =
            originalPiece;

          board[move.row][move.col] =
            null;

          if (move.isCapture) {
            board[move.captured.row][move.captured.col] =
              capturedPiece;
          }

          /* keep a move even when every line loses (score -Infinity); otherwise the AI silently skipped its turn */
          if (evaluation > maxEval || bestMove === null) {
            maxEval = evaluation;
            bestMove = { piece, move };
          }

          alpha = Math.max(alpha, evaluation);

          if (beta <= alpha) break;
        }

        if (beta <= alpha) break;
      }

      return {
        score: maxEval,
        move: bestMove
      };
    }

    let minEval = Infinity;

    for (const piece of pieces) {
      for (const move of piece.moves) {
        const originalPiece =
          board[piece.row][piece.col];

        board[move.row][move.col] =
          originalPiece;

        board[piece.row][piece.col] =
          null;

        let capturedPiece = null;

        if (move.isCapture) {
          capturedPiece =
            board[move.captured.row][move.captured.col];

          board[move.captured.row][move.captured.col] =
            null;
        }

        const evaluation =
          minimax(
            depth - 1,
            true,
            alpha,
            beta
          ).score;

        board[piece.row][piece.col] =
          originalPiece;

        board[move.row][move.col] =
          null;

        if (move.isCapture) {
          board[move.captured.row][move.captured.col] =
            capturedPiece;
        }

        if (evaluation < minEval || bestMove === null) {
          minEval = evaluation;
          bestMove = { piece, move };
        }

        beta = Math.min(beta, evaluation);

        if (beta <= alpha) break;
      }

      if (beta <= alpha) break;
    }

    return {
      score: minEval,
      move: bestMove
    };
  }

  function computerMove(versionAtSchedule) {
    if (
      versionAtSchedule !== gameVersion ||
      currentPlayer !== 'white'
    ) {
      return;
    }

    const pieces = getAllMoves('white');

    if (pieces.length === 0) {
      statusEl.textContent =
        'Oyun Bitti: Oyuncu Kazandı!';
      return;
    }

    const { move } =
      minimax(
        minimaxDepth,
        true,
        -Infinity,
        Infinity
      );

    if (move) {
      board[move.move.row][move.move.col] =
        board[move.piece.row][move.piece.col];

      board[move.piece.row][move.piece.col] =
        null;

      if (move.move.isCapture) {
        board[
          move.move.captured.row
        ][
          move.move.captured.col
        ] = null;
      }
    }

    currentPlayer = 'black';
    statusEl.textContent =
      'Sıra: Oyuncu (Siyah)';

    drawBoard();
    checkGameEnd();
  }

  function checkGameEnd() {
    let blackPieces = 0;
    let whitePieces = 0;

    const blackMoves =
      getAllMoves('black');

    const whiteMoves =
      getAllMoves('white');

    for (let row = 0; row < boardSize; row++) {
      for (let col = 0; col < boardSize; col++) {
        if (board[row][col] === 'black') {
          blackPieces++;
        }

        if (board[row][col] === 'white') {
          whitePieces++;
        }
      }
    }

    if (
      blackPieces === 0 ||
      blackMoves.length === 0
    ) {
      statusEl.textContent =
        'Oyun Bitti: Bilgisayar Kazandı!';
      currentPlayer = null;
    } else if (
      whitePieces === 0 ||
      whiteMoves.length === 0
    ) {
      statusEl.textContent =
        'Oyun Bitti: Oyuncu Kazandı!';
      currentPlayer = null;
    }
  }

  canvas.addEventListener('click', event => {
    if (currentPlayer !== 'black') return;

    const rect =
      canvas.getBoundingClientRect();

    const scaleX =
      canvas.width / rect.width;

    const scaleY =
      canvas.height / rect.height;

    const x =
      (event.clientX - rect.left) * scaleX;

    const y =
      (event.clientY - rect.top) * scaleY;

    const col =
      Math.floor(x / cellSize);

    const row =
      Math.floor(y / cellSize);

    if (selectedPiece) {
      const moves =
        getValidMoves(
          selectedPiece.row,
          selectedPiece.col
        );

      const move =
        moves.find(
          candidate =>
            candidate.row === row &&
            candidate.col === col
        );

      if (move) {
        board[row][col] =
          board[
            selectedPiece.row
          ][
            selectedPiece.col
          ];

        board[
          selectedPiece.row
        ][
          selectedPiece.col
        ] = null;

        if (move.isCapture) {
          board[
            move.captured.row
          ][
            move.captured.col
          ] = null;
        }

        selectedPiece = null;
        currentPlayer = 'white';

        statusEl.textContent =
          'Sıra: Bilgisayar (Kırmızı)';

        drawBoard();
        checkGameEnd();

        if (currentPlayer === 'white') {
          const versionAtSchedule =
            gameVersion;

          window.setTimeout(
            () => computerMove(versionAtSchedule),
            500
          );
        }
      } else {
        /* clicking another own piece switches the selection directly */
        selectedPiece =
          board[row] && board[row][col] === 'black'
            ? { row, col }
            : null;
        drawBoard();
      }
    } else if (
      board[row] &&
      board[row][col] === 'black'
    ) {
      selectedPiece = { row, col };
      drawBoard();
    }
  });

  depthSelect.addEventListener(
    'change',
    updateDepth
  );

  newGameBtn.addEventListener(
    'click',
    initializeBoard
  );

  initializeBoard();
})();
</script>
