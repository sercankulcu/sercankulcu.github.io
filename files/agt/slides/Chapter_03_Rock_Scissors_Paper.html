<style>
.agt-rock-paper-scissors,
.agt-rock-paper-scissors *,
.agt-rock-paper-scissors *::before,
.agt-rock-paper-scissors *::after {
  box-sizing: border-box;
}

.agt-rock-paper-scissors {
  width: min(620px, 100%);
  margin: 0 auto 2rem;
  padding: 20px;
  border: 1px solid var(--global-border-color);
  border-radius: 10px;
  background: var(--global-bg-color);
  color: var(--global-text-color);
  box-shadow: 0 4px 6px rgba(0, 0, 0, .1);
  text-align: center;
  font-family: Arial, sans-serif;
}

.agt-rock-paper-scissors h1 {
  color: var(--global-text-color);
}

.agt-rock-paper-scissors .choices {
  display: flex;
  justify-content: space-around;
  gap: 14px;
  margin-bottom: 20px;
}

.agt-rock-paper-scissors .choice {
  display: grid;
  place-items: center;
  min-width: 90px;
  min-height: 90px;
  border: 1px solid var(--global-border-color);
  border-radius: 16px;
  background: var(--global-bg-color);
  color: var(--global-text-color);
  font-size: 40px;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
}

.agt-rock-paper-scissors .choice:hover {
  transform: scale(1.08);
  border-color: var(--global-link-color);
}

.agt-rock-paper-scissors .result {
  min-height: 40px;
  margin-bottom: 20px;
  font-size: 24px;
  font-weight: bold;
}

.agt-rock-paper-scissors .score {
  font-size: 18px;
}

@media (max-width: 480px) {
  .agt-rock-paper-scissors {
    width: 100%;
    padding: 14px;
  }

  .agt-rock-paper-scissors .choice {
    min-width: 72px;
    min-height: 72px;
    font-size: 30px;
  }

  .agt-rock-paper-scissors .result {
    font-size: 20px;
  }
}
</style>

<div class="agt-rock-paper-scissors">
  <h1>Rock Paper Scissors</h1>

  <div class="choices">
    <button class="choice" type="button" data-choice="rock" aria-label="Rock">🪨</button>
    <button class="choice" type="button" data-choice="paper" aria-label="Paper">📄</button>
    <button class="choice" type="button" data-choice="scissors" aria-label="Scissors">✂️</button>
  </div>

  <div class="result">Choose your move!</div>
  <div class="score">Player: 0 | Computer: 0</div>
</div>

<script>
(() => {
  const root = document.querySelector('.agt-rock-paper-scissors');
  if (!root) return;

  const resultElement = root.querySelector('.result');
  const scoreElement = root.querySelector('.score');
  const choiceButtons = root.querySelectorAll('.choice');

  let playerScore = 0;
  let computerScore = 0;

  function play(playerChoice) {
    const choices = ['rock', 'paper', 'scissors'];
    const computerChoice = choices[Math.floor(Math.random() * 3)];

    const result = getResult(playerChoice, computerChoice);
    updateScore(result);
    displayResult(playerChoice, computerChoice, result);
  }

  function getResult(player, computer) {
    if (player === computer) return 'tie';

    if (
      (player === 'rock' && computer === 'scissors') ||
      (player === 'paper' && computer === 'rock') ||
      (player === 'scissors' && computer === 'paper')
    ) {
      return 'win';
    }

    return 'lose';
  }

  function updateScore(result) {
    if (result === 'win') playerScore++;
    if (result === 'lose') computerScore++;

    scoreElement.textContent =
      `Player: ${playerScore} | Computer: ${computerScore}`;
  }

  function displayResult(player, computer, result) {
    const playerEmoji = getEmoji(player);
    const computerEmoji = getEmoji(computer);

    let resultText =
      `You chose ${playerEmoji}, computer chose ${computerEmoji}.`;

    if (result === 'win') {
      resultText += 'You win!';
    } else if (result === 'lose') {
      resultText += 'You lose!';
    } else {
      resultText += "It's a tie!";
    }

    resultElement.textContent = resultText;
  }

  function getEmoji(choice) {
    switch (choice) {
      case 'rock':
        return '🪨';
      case 'paper':
        return '📄';
      case 'scissors':
        return '✂️';
      default:
        return '';
    }
  }

  choiceButtons.forEach(button => {
    button.addEventListener('click', () => {
      play(button.dataset.choice);
    });
  });
})();
</script>
