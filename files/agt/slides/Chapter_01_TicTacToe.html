<style>
  .agt-tictactoe,
  .agt-tictactoe *,
  .agt-tictactoe *::before,
  .agt-tictactoe *::after {
    box-sizing: border-box;
  }

  .agt-tictactoe {
    width: min(680px, 100%);
    margin: 0 auto 2rem;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: var(--global-text-color);
  }

  .agt-tictactoe h1 {
    margin: 10px 0 1rem;
    color: var(--global-text-color);
  }

  .agt-tictactoe .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 5px;
    justify-content: center;
    margin-top: 30px;
  }

  .agt-tictactoe .cell {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--global-text-color);
    border-radius: 6px;
    background: var(--global-bg-color);
    color: var(--global-text-color);
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.4s, transform 0.15s ease;
    user-select: none;
  }

  .agt-tictactoe .cell:hover {
    transform: translateY(-1px);
  }

  .agt-tictactoe .cell.exploring {
    background: #fff59d !important;
    color: #222 !important;
  }

  .agt-tictactoe .cell.evaluated {
    background: #a5d6a7 !important;
    color: #17351c !important;
  }

  .agt-tictactoe .commentary {
    width: min(420px, 100%);
    min-height: 60px;
    margin: 20px auto;
    padding: 15px;
    border: 1px solid var(--global-border-color);
    border-radius: 10px;
    background: var(--global-bg-color);
    color: var(--global-text-color);
  }

  .agt-tictactoe .reset-btn {
    padding: 10px 15px;
    border: 1px solid var(--global-link-color);
    border-radius: 8px;
    background: var(--global-link-color);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .agt-tictactoe .reset-btn:hover {
    filter: brightness(1.08);
  }

  .agt-tictactoe .cell:focus-visible,
  .agt-tictactoe .reset-btn:focus-visible {
    outline: 3px solid var(--global-link-color);
    outline-offset: 2px;
  }

  @media (max-width: 420px) {
    .agt-tictactoe .board {
      grid-template-columns: repeat(3, 82px);
    }

    .agt-tictactoe .cell {
      width: 82px;
      height: 82px;
      font-size: 34px;
    }
  }
</style>

<div class="agt-tictactoe">
  <h1>🎯 Minimax Karar Süreci - Tic Tac Toe</h1>
  <div class="board"></div>
  <div class="commentary">Senin sıran! Hamleni yap.</div>
  <button class="reset-btn" type="button">🔄 Yeni Oyun</button>
</div>

<script>
(() => {
  const root = document.querySelector(".agt-tictactoe");
  if (!root) return;

  const boardEl = root.querySelector(".board");
  const commentaryEl = root.querySelector(".commentary");
  const resetBtn = root.querySelector(".reset-btn");

  let gameBoard = ["", "", "", "", "", "", "", "", ""];
  let gameOver = false;
  let animating = false;
  let gameVersion = 0;

  function drawBoard() {
    boardEl.innerHTML = "";

    gameBoard.forEach((value, index) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = value;
      cell.setAttribute("role", "button");
      cell.setAttribute("tabindex", "0");
      cell.setAttribute("aria-label", `Cell ${index + 1}${value ? ": " + value : ""}`);

      cell.addEventListener("click", () => playerMove(index));
      cell.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          playerMove(index);
        }
      });

      boardEl.appendChild(cell);
    });
  }

  function checkWinner(boardState) {
    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    for (const line of wins) {
      if (
        boardState[line[0]] &&
        boardState[line[0]] === boardState[line[1]] &&
        boardState[line[1]] === boardState[line[2]]
      ) {
        return boardState[line[0]];
      }
    }

    if (boardState.every(cell => cell !== "")) return "draw";
    return null;
  }

  function playerMove(index) {
    if (gameOver || animating || gameBoard[index] !== "") return;

    gameBoard[index] = "X";
    drawBoard();

    const result = checkWinner(gameBoard);
    if (result) {
      endGame(result);
      return;
    }

    commentaryEl.textContent = "🤖 AI düşünüyor...";
    const version = gameVersion;

    setTimeout(() => {
      if (version === gameVersion && !gameOver) {
        aiMove(version);
      }
    }, 300);
  }

  async function aiMove(version) {
    if (version !== gameVersion || gameOver) return;

    animating = true;

    let bestScore = -Infinity;
    let move;

    for (let i = 0; i < 9; i++) {
      if (gameBoard[i] === "") {
        gameBoard[i] = "O";
        const score = await minimax(gameBoard, 0, false, -Infinity, Infinity, version);
        gameBoard[i] = "";

        if (version !== gameVersion) return;

        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }

    if (version !== gameVersion || gameOver) return;

    if (typeof move === "number") {
      gameBoard[move] = "O";
    }

    drawBoard();

    const result = checkWinner(gameBoard);
    if (result) {
      endGame(result);
      return;
    }

    commentaryEl.textContent = "Senin sıran!";
    animating = false;
  }

  async function minimax(boardState, depth, isMaximizing, alpha, beta, version) {
    if (version !== gameVersion) return 0;

    const result = checkWinner(boardState);

    if (result === "X") return -10 + depth;
    if (result === "O") return 10 - depth;
    if (result === "draw") return 0;

    const animate = depth < 2;

    if (isMaximizing) {
      let maxEval = -Infinity;

      for (let i = 0; i < 9; i++) {
        if (boardState[i] !== "") continue;

        const cells = root.querySelectorAll(".cell");

        if (animate && cells[i]) {
          cells[i].classList.add("exploring");
        }

        boardState[i] = "O";

        if (animate) await sleep(60);

        const evalScore = await minimax(
          boardState,
          depth + 1,
          false,
          alpha,
          beta,
          version
        );

        boardState[i] = "";

        if (version !== gameVersion) return 0;

        if (animate && cells[i]) {
          cells[i].classList.remove("exploring");
          cells[i].classList.add("evaluated");
          commentaryEl.textContent = `Pozisyon ${i + 1} → skor ${evalScore}`;
          await sleep(60);
        }

        maxEval = Math.max(maxEval, evalScore);
        alpha = Math.max(alpha, evalScore);

        if (beta <= alpha) break;
      }

      return maxEval;
    }

    let minEval = Infinity;

    for (let i = 0; i < 9; i++) {
      if (boardState[i] !== "") continue;

      const cells = root.querySelectorAll(".cell");

      if (animate && cells[i]) {
        cells[i].classList.add("exploring");
      }

      boardState[i] = "X";

      if (animate) await sleep(60);

      const evalScore = await minimax(
        boardState,
        depth + 1,
        true,
        alpha,
        beta,
        version
      );

      boardState[i] = "";

      if (version !== gameVersion) return 0;

      if (animate && cells[i]) {
        cells[i].classList.remove("exploring");
        cells[i].classList.add("evaluated");
        commentaryEl.textContent = `Rakip ${i + 1} → skor ${evalScore}`;
        await sleep(60);
      }

      minEval = Math.min(minEval, evalScore);
      beta = Math.min(beta, evalScore);

      if (beta <= alpha) break;
    }

    return minEval;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function endGame(result) {
    gameOver = true;
    animating = false;

    if (result === "draw") {
      commentaryEl.textContent = "🤝 Berabere!";
    } else if (result === "X") {
      commentaryEl.textContent = "🏆 Kazandın!";
    } else {
      commentaryEl.textContent = "💀 Kaybettin! AI mükemmel oynadı.";
    }
  }

  function resetGame() {
    gameVersion++;
    gameBoard = ["", "", "", "", "", "", "", "", ""];
    gameOver = false;
    animating = false;
    commentaryEl.textContent = "Senin sıran! Hamleni yap.";
    drawBoard();
  }

  resetBtn.addEventListener("click", resetGame);

  drawBoard();
})();
</script>
