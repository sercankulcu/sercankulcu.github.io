<style>
.agt-traffic-lights,
.agt-traffic-lights *,
.agt-traffic-lights *::before,
.agt-traffic-lights *::after {

.agt-traffic-lights {
  width: min(640px, 100%);
  margin: 0 auto 2rem;
  padding: 20px;
  font-family: Arial, sans-serif;
}

.agt-traffic-lights .simulation-wrap {
  width: 100%;

  width: 600px;

}

.agt-traffic-lights .road {

}

.agt-traffic-lights .road-h {
  width: 100%;
  height: 100px;
  top: 250px;
}

.agt-traffic-lights .road-v {
  width: 100px;
  height: 100%;
  left: 250px;
}

.agt-traffic-lights .traffic-light {
  width: 30px;

  background-color: #222;
  position: absolute;
  display: flex;
  flex-direction: column;

<div class="agt-traffic-lights">
  <div class="simulation-wrap">
    <div class="simulation">
      <div class="road road-h"></div>
      <div class="road road-v"></div>

      <div class="traffic-light" style="top:155px;left:215px;">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>

      <div class="traffic-light" style="top:215px;right:155px;">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>

      <div class="traffic-light" style="bottom:155px;right:215px;">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>

      <div class="traffic-light" style="bottom:215px;left:155px;">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const root = document.querySelector('.agt-traffic-lights');
  if (!root) return;

  const simulation = root.querySelector('.simulation');
  const trafficLights = root.querySelectorAll('.traffic-light');

  const directions = ['north', 'east', 'south', 'west'];
  const colors = [
    '#FF0000',
    '#00FF00',
    '#0000FF',
    '#FFFF00',
    '#FF00FF',
    '#00FFFF'
  ];

  let currentGreen = 0;
  let cars = [];

  function changeLights() {
    trafficLights.forEach((light, index) => {
      const lights = light.querySelectorAll('.light');

      lights.forEach(item => {
        item.style.opacity = '.3';
      });

      if (index === currentGreen) {
        lights[2].style.opacity = '1';
      } else {
        lights[0].style.opacity = '1';
      }
    });

    currentGreen = (currentGreen + 1) % 4;

    window.setTimeout(
      changeLights,
      5000 + Math.random() * 2000
    );
  }

  function createCar(direction) {
    const element = document.createElement('div');
    element.className = 'car';

    element.style.backgroundColor =
      colors[Math.floor(Math.random() * colors.length)];

    let x;
    let y;
    let rotation;

    switch (direction) {
      case 'north':
        x = 280;
        y = 600;
        rotation = 270;
        break;

      case 'east':
        x = 0;
        y = 280;
        rotation = 0;
        break;

      case 'south':
        x = 280;
        y = 0;
        rotation = 90;
        break;

      case 'west':
        x = 600;
        y = 280;
        rotation = 180;
        break;
    }

    element.style.left = `${x}px`;
    element.style.top = `${y}px`;
    element.style.transform = `rotate(${rotation}deg)`;

    simulation.appendChild(element);

    cars.push({
      element,
      direction,
      x,
      y
    });
  }

  function moveCars() {
    cars.forEach((car, index) => {
      const light =
        trafficLights[
          directions.indexOf(car.direction)
        ];

      const isGreen =
        light.querySelector('.green').style.opacity === '1';

      if (
        isGreen ||
        (
          car.x > 220 &&
          car.x < 340 &&
          car.y > 220 &&
          car.y < 340
        )
      ) {
        switch (car.direction) {
          case 'north':
            car.y -= 2;
            break;

          case 'east':
            car.x += 2;
            break;

          case 'south':
            car.y += 2;
            break;

          case 'west':
            car.x -= 2;
            break;
        }

        car.element.style.left = `${car.x}px`;
        car.element.style.top = `${car.y}px`;

        if (
          car.x < -50 ||
          car.x > 650 ||
          car.y < -50 ||
          car.y > 650
        ) {
          simulation.removeChild(car.element);
          cars.splice(index, 1);
        }
      }
    });

    window.requestAnimationFrame(moveCars);
  }

  function addRandomCar() {
    const direction =
      directions[Math.floor(Math.random() * 4)];

    createCar(direction);

    const nextCarDelay =
      1000 + Math.random() * 4000;

    window.setTimeout(
      addRandomCar,
      nextCarDelay
    );
  }

  changeLights();
  moveCars();
  addRandomCar();
})();
</script>
