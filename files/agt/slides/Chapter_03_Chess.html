  <div class="status">
    <div class="status-indicator turn-w"></div>
    <span class="status-text">White to move</span>
  </div>

  <div class="board-wrapper">
    <div class="board-container">
      <div class="chessboard"></div>
    </div>
  </div>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
(() => {
  const root = document.querySelector('.agt-chess');
  if (!root || typeof Chess === 'undefined') return;

  const boardEl = root.querySelector('.chessboard');
  const statusText = root.querySelector('.status-text');
  const turnIndicator = root.querySelector('.status-indicator');
  const newGameBtn = root.querySelector('.new-game');

  const game = new Chess();

  let selectedSquare = null;
  let isAIThinking = false;
  let gameVersion = 0;

  const SEARCH_DEPTH = 3;

  const pawnEvalWhite = [
    [0,0,0,0,0,0,0,0],
    [50,50,50,50,50,50,50,50],
    [10,10,20,30,30,20,10,10],
    [5,5,10,25,25,10,5,5],
    [0,0,0,20,20,0,0,0],
    [5,-5,-10,0,0,-10,-5,5],
    [5,10,10,-20,-20,10,10,5],
    [0,0,0,0,0,0,0,0]
  ];
  const pawnEvalBlack = pawnEvalWhite.slice().reverse();

  const knightEval = [
    [-50,-40,-30,-30,-30,-30,-40,-50],
    [-40,-20,0,0,0,0,-20,-40],
    [-30,0,10,15,15,10,0,-30],
    [-30,5,15,20,20,15,5,-30],
    [-30,0,15,20,20,15,0,-30],
    [-30,5,10,15,15,10,5,-30],
    [-40,-20,0,5,5,0,-20,-40],
    [-50,-40,-30,-30,-30,-30,-40,-50]
  ];

  const whiteBishopEval = [
    [-20,-10,-10,-10,-10,-10,-10,-20],
    [-10,0,0,0,0,0,0,-10],
    [-10,0,5,10,10,5,0,-10],
    [-10,5,5,10,10,5,5,-10],
    [-10,0,10,10,10,10,0,-10],
    [-10,10,10,10,10,10,10,-10],
    [-10,5,0,0,0,0,5,-10],
    [-20,-10,-10,-10,-10,-10,-10,-20]
  ];
  const blackBishopEval = whiteBishopEval.slice().reverse();

  const whiteRookEval = [
    [0,0,0,0,0,0,0,0],
    [5,10,10,10,10,10,10,5],
    [-5,0,0,0,0,0,0,-5],
    [-5,0,0,0,0,0,0,-5],
    [-5,0,0,0,0,0,0,-5],
    [-5,0,0,0,0,0,0,-5],
    [-5,0,0,0,0,0,0,-5],
    [0,0,0,5,5,0,0,0]
  ];
  const blackRookEval = whiteRookEval.slice().reverse();

  const evalQueen = [
    [-20,-10,-10,-5,-5,-10,-10,-20],
    [-10,0,0,0,0,0,0,-10],
    [-10,0,5,5,5,5,0,-10],
    [-5,0,5,5,5,5,0,-5],
    [0,0,5,5,5,5,0,-5],
    [-10,5,5,5,5,5,0,-10],
    [-10,0,5,0,0,0,0,-10],
    [-20,-10,-10,-5,-5,-10,-10,-20]
  ];

  const whiteKingEval = [
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-20,-30,-30,-40,-40,-30,-30,-20],
    [-10,-20,-20,-20,-20,-20,-20,-10],
    [20,20,0,0,0,0,20,20],
    [20,30,10,0,0,10,30,20]
  ];
  const blackKingEval = whiteKingEval.slice().reverse();

  function createBoard() {
    boardEl.innerHTML = '';

    for (let i = 0; i < 64; i++) {
      const square = document.createElement('div');
      const row = 8 - Math.floor(i / 8);
      const col = i % 8;
      const file = String.fromCharCode(97 + col);

      square.classList.add('square');
      square.classList.add(
        (i + Math.floor(i / 8)) % 2 === 0
          ? 'white-square'
          : 'black-square'
      );

      square.dataset.square = file + row;
      square.addEventListener('click', onSquareClick);
      boardEl.appendChild(square);
    }

    updateBoard();
    updateStatus();
  }

  function updateBoard() {
    const position = game.board();

    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        const square = boardEl.children[i * 8 + j];
        const piece = position[i][j];

        square.innerHTML = '';

        if (piece) {
          const pieceSpan = document.createElement('span');
          pieceSpan.textContent = getPieceSymbol(piece);
          pieceSpan.classList.add(
            piece.color === 'w' ? 'white-piece' : 'black-piece'
          );
          square.appendChild(pieceSpan);
        }
      }
    }
  }

  function getPieceSymbol(piece) {
    const symbols = {
      p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
      P: '♟', R: '♜', N: '♞', B: '♝', Q: '♛', K: '♚'
    };

    return symbols[piece.type.toUpperCase()] || '';
  }

  function onSquareClick(event) {
    if (game.game_over() || isAIThinking || game.turn() === 'b') return;

    let target = event.target;

    if (target.tagName === 'SPAN') {
      target = target.parentElement;
    }

    if (!target.classList.contains('square')) {
      target = target.closest('.square');
    }

    if (!target) return;

    const clickedSquare = target.dataset.square;

    if (selectedSquare) {
      const move = game.move({
        from: selectedSquare,
        to: clickedSquare,
        promotion: 'q'
      });

      if (move) {
        updateBoard();
        clearHighlights();
        selectedSquare = null;
        updateStatus();

        highlightSquare(move.from);
        highlightSquare(move.to);

        if (!game.game_over()) {
          isAIThinking = true;
          const version = gameVersion;

          window.setTimeout(() => {
            if (version !== gameVersion) return;
            makeBestMove(version);
          }, 250);
        }
      } else {
        const piece = game.get(clickedSquare);

        if (piece && piece.color === game.turn()) {
          clearHighlights();
          selectedSquare = clickedSquare;
          highlightSquare(clickedSquare);
          showValidMoves(clickedSquare);
        } else {
          clearHighlights();
          selectedSquare = null;
        }
      }
    } else {
      const piece = game.get(clickedSquare);

      if (piece && piece.color === game.turn()) {
        clearHighlights();
        selectedSquare = clickedSquare;
        highlightSquare(clickedSquare);
        showValidMoves(clickedSquare);
      }
    }
  }

  function makeBestMove(version) {
    if (version !== gameVersion || game.game_over()) {
      isAIThinking = false;
      return;
    }

    const bestMove = minimaxRoot(SEARCH_DEPTH, game, true);

    if (!bestMove) {
      isAIThinking = false;
      updateStatus();
      return;
    }

    game.move(bestMove);
    updateBoard();
    updateStatus();

    clearHighlights();
    highlightSquare(bestMove.from);
    highlightSquare(bestMove.to);

    isAIThinking = false;
  }

  function minimaxRoot(depth, currentGame, isMaximisingPlayer) {
    const newGameMoves = currentGame.moves({ verbose: true });
    let bestMove = -9999;
    let bestMoveFound;

    newGameMoves.sort(() => Math.random() - .5);

    for (let i = 0; i < newGameMoves.length; i++) {
      const newGameMove = newGameMoves[i];

      currentGame.move(newGameMove);

      const value = minimax(
        depth - 1,
        currentGame,
        -10000,
        10000,
        !isMaximisingPlayer
      );

      currentGame.undo();

      if (value >= bestMove) {
        bestMove = value;
        bestMoveFound = newGameMove;
      }
    }

    return bestMoveFound;
  }

  function minimax(depth, currentGame, alpha, beta, isMaximisingPlayer) {
    if (depth === 0) {
      return -evaluateBoard(currentGame.board());
    }

    const newGameMoves = currentGame.moves();

    if (isMaximisingPlayer) {
      let bestMove = -9999;

      for (let i = 0; i < newGameMoves.length; i++) {
        currentGame.move(newGameMoves[i]);

        bestMove = Math.max(
          bestMove,
          minimax(
            depth - 1,
            currentGame,
            alpha,
            beta,
            !isMaximisingPlayer
          )
        );

        currentGame.undo();
        alpha = Math.max(alpha, bestMove);

        if (beta <= alpha) {
          return bestMove;
        }
      }

      return bestMove;
    }

    let bestMove = 9999;

    for (let i = 0; i < newGameMoves.length; i++) {
      currentGame.move(newGameMoves[i]);

      bestMove = Math.min(
        bestMove,
        minimax(
          depth - 1,
          currentGame,
          alpha,
          beta,
          !isMaximisingPlayer
        )
      );

      currentGame.undo();
      beta = Math.min(beta, bestMove);

      if (beta <= alpha) {
        return bestMove;
      }
    }

    return bestMove;
  }

  function evaluateBoard(position) {
    let totalEvaluation = 0;

    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        totalEvaluation += getPieceValue(position[i][j], i, j);
      }
    }

    return totalEvaluation;
  }

  function getPieceValue(piece, x, y) {
    if (piece === null) return 0;

    function getAbsoluteValue(currentPiece, isWhite, px, py) {
      if (currentPiece.type === 'p') {
        return 100 + (isWhite ? pawnEvalWhite[py][px] : pawnEvalBlack[py][px]);
      }

      if (currentPiece.type === 'r') {
        return 500 + (isWhite ? whiteRookEval[py][px] : blackRookEval[py][px]);
      }

      if (currentPiece.type === 'n') {
        return 320 + knightEval[py][px];
      }

      if (currentPiece.type === 'b') {
        return 330 + (isWhite ? whiteBishopEval[py][px] : blackBishopEval[py][px]);
      }

      if (currentPiece.type === 'q') {
        return 900 + evalQueen[py][px];
      }

      if (currentPiece.type === 'k') {
        return 20000 + (isWhite ? whiteKingEval[py][px] : blackKingEval[py][px]);
      }

      throw 'Unknown piece type: ' + currentPiece.type;
    }

    const absoluteValue = getAbsoluteValue(
      piece,
      piece.color === 'w',
      x,
      y
    );

    return piece.color === 'w'
      ? absoluteValue
      : -absoluteValue;
  }

  function highlightSquare(square) {
    const squareElement =
      root.querySelector(`[data-square="${square}"]`);

    if (squareElement) {
      squareElement.classList.add('selected');
    }
  }

  function showValidMoves(square) {
    const moves = game.moves({
      square,
      verbose: true
    });

    moves.forEach(move => {
      const squareElement =
        root.querySelector(`[data-square="${move.to}"]`);

      if (squareElement) {
        squareElement.classList.add('valid-move');
      }
    });
  }

  function clearHighlights() {
    root.querySelectorAll('.square').forEach(square => {
      square.classList.remove('selected', 'valid-move');
    });
  }

  function updateStatus() {
    let status = '';

    if (game.in_checkmate()) {
      status =
        'Game over. ' +
        (game.turn() === 'w' ? 'Black (AI)' : 'White') +
        ' wins!';
    } else if (game.in_draw()) {
      status = 'Game over, drawn position';
    } else {
      status =
        game.turn() === 'w'
          ? 'Your Turn (White)'
          : 'AI is thinking...';

      if (game.in_check()) {
        status += ' (Check!)';
      }
    }

    statusText.innerText = status;

    turnIndicator.className =
      'status-indicator ' +
      (game.turn() === 'w' ? 'turn-w' : 'turn-b');
  }

  function resetGame() {
    gameVersion++;
    game.reset();
    selectedSquare = null;
    isAIThinking = false;

    clearHighlights();
    updateBoard();
    updateStatus();
  }

  newGameBtn.addEventListener('click', resetGame);

  createBoard();
})();
</script>
