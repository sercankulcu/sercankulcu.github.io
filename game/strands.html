<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb"><title>Strands</title><style>
:root{
  --bg:#f6f8fc;--surface:#ffffff;--surface2:#f0f4fb;--ink:#172033;--muted:#667085;
  --line:#dfe5ef;--accent:#2563eb;--accent2:#1d4ed8;--good:#16a34a;--warn:#d97706;--bad:#dc2626;
  --shadow:0 14px 40px rgba(15,23,42,.10);--r:20px
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
radial-gradient(circle at top left,#eaf1ff 0,transparent 32rem),var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit}
button{border:0}
.app{width:min(860px,94vw);margin:24px auto 40px}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(223,229,239,.9);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:white;display:grid;place-items:center;font-size:24px;font-weight:900}
h1{font-size:clamp(1.65rem,4vw,2.25rem);margin:0;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin:4px 0 0;font-size:.98rem}
.toolbar,.stats,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.stats{justify-content:center;margin:14px 0}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:800}
.btn{border-radius:12px;padding:11px 15px;background:#eaf0fb;color:var(--ink);font-weight:800;cursor:pointer;transition:.16s transform,.16s background,.16s opacity}
.btn:hover{transform:translateY(-1px);background:#dde7f7}.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}
.btn.good{background:#dcfce7;color:#166534}.btn.bad{background:#fee2e2;color:#991b1b}.btn.warn{background:#ffedd5;color:#9a3412}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.message{min-height:34px;text-align:center;font-weight:800;margin:14px 0 2px}
.help{position:fixed;right:16px;top:16px;width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;font-weight:900;z-index:10;box-shadow:0 8px 24px #0003;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.82);backdrop-filter:blur(6px);z-index:50;padding:24px;overflow:auto}
.modal.open{display:block}.modalbox{max-width:720px;margin:5vh auto;background:white;color:var(--ink);border-radius:20px;padding:24px;box-shadow:0 30px 70px #0005}
.modalbox h2{margin-top:0}.modalbox li{margin:.45rem 0}.modalclose{float:right}
.gamegrid{display:grid;gap:10px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f7;border:1px solid #d0d5dd;border-bottom-width:3px;border-radius:7px;padding:2px 7px}
.progress{height:10px;background:#e7edf6;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);width:0%;transition:width .25s}
input[type=text],input[type=number]{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 14px;background:white;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #2563eb18}
.section{background:#fbfcfe;border:1px solid var(--line);border-radius:16px;padding:16px}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:640px){.app{width:min(96vw,860px);margin:8px auto 24px}.card{padding:14px;border-radius:16px}.topbar{align-items:flex-start}.help{top:auto;bottom:14px}.btn{padding:10px 12px}.logo{width:42px;height:42px}}

.strand-found{background:#16a34a!important;color:#fff!important;border-color:#16a34a!important}
</style></head>
<body>
<button class="help" id="helpBtn" aria-label="Yardım">?</button>
<div class="modal" id="helpModal" role="dialog" aria-modal="true"><div class="modalbox">
<button class="btn modalclose" id="helpClose">Kapat</button><h2>Strands</h2><p>Üstteki temaya uyan kelimeleri bulun. İpucu düğmesi henüz bulunmamış kelimelerden biri için ilk harf ve uzunluk verir.</p></div></div>
<div class="app"><div class="card">
<div class="topbar"><div class="brand"><div class="logo">🧶</div><div><h1>Strands</h1><p class="subtitle">Temaya ait gizli kelimeleri keşfet.</p></div></div></div>
<div class="stats"><span class="stat">Tema: <b id="theme"></b></span><span class="stat">Bulunan: <b id="count">0</b>/5</span></div>
<div id="currentWord" style="min-height:44px;text-align:center;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:.08em;margin:12px 0"></div>
<div id="letters" class="gamegrid" style="grid-template-columns:repeat(5,54px);justify-content:center;margin:18px"></div>
<div class="actions" style="justify-content:center;margin-top:12px">
  <button id="deleteBtn" class="btn">⌫ Sil</button>
  <button id="ok" class="btn primary">Kontrol</button>
  <button id="hint" class="btn">İpucu</button>
  <button id="newBtn" class="btn">Yeni Tema</button>
</div>
<div id="msg" class="message"></div><div id="found" class="section"></div>
</div></div>
<script>
const helpModal=document.getElementById('helpModal');
document.getElementById('helpBtn').onclick=()=>helpModal.classList.add('open');
document.getElementById('helpClose').onclick=()=>helpModal.classList.remove('open');
helpModal.addEventListener('click',e=>{if(e.target===helpModal)helpModal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')helpModal.classList.remove('open')});

const P=[["UZAY",["YILDIZ","GEZEGEN","ROKET","AY","GÜNEŞ"]],["DENİZ",["BALIK","DALGA","GEMİ","KUM","MERCAN"]],["OKUL",["KALEM","DEFTER","SINIF","DERS","TAHTA"]],["MÜZİK",["GİTAR","KEMAN","DAVUL","NOTA","ŞARKI"]]];
const ALPH='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';
const SIZE=5;

let p=null;
let foundWords=[];
let current='';
let pathIndexes=[];
let solvedIndexes=new Set();

function idxToRC(i){
  return {r:Math.floor(i/SIZE), c:i%SIZE};
}

function areNeighbors(a,b){
  const A=idxToRC(a), B=idxToRC(b);
  const dr=Math.abs(A.r-B.r), dc=Math.abs(A.c-B.c);
  return dr<=1 && dc<=1 && !(dr===0 && dc===0);
}

function start(){
  p=P[Math.floor(Math.random()*P.length)];
  foundWords=[];
  current='';
  pathIndexes=[];
  solvedIndexes=new Set();
  count.textContent=0;
  theme.textContent=p[0];
  msg.textContent='';
  currentWord.textContent='';

  // Build one continuous "snake" path through the whole 5x5 board.
  // Each target word occupies consecutive cells on this path, so EVERY
  // letter of every word is guaranteed to touch the next letter.
  const board=Array(SIZE*SIZE).fill(null);
  const snake=[];

  for(let r=0;r<SIZE;r++){
    if(r%2===0){
      for(let c=0;c<SIZE;c++) snake.push(r*SIZE+c);
    }else{
      for(let c=SIZE-1;c>=0;c--) snake.push(r*SIZE+c);
    }
  }

  // Randomly reverse the snake so boards do not always read from top-left.
  if(Math.random()<0.5) snake.reverse();

  // Shuffle word order while preserving each word internally.
  const wordsToPlace=[...p[1]].sort(()=>Math.random()-.5);

  let cursor=0;
  wordsToPlace.forEach(word=>{
    for(const ch of [...word]){
      if(cursor>=snake.length) break;
      board[snake[cursor]]=ch;
      cursor++;
    }
  });

  // Any unused cells get random filler letters.
  while(cursor<snake.length){
    board[snake[cursor]]=ALPH[Math.floor(Math.random()*ALPH.length)];
    cursor++;
  }

  letters.innerHTML='';
  board.forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='btn';
    b.style='width:54px;height:54px;display:grid;place-items:center;font-size:21px;padding:0';
    b.textContent=ch;
    b.dataset.index=i;
    b.onclick=()=>selectTile(i);
    letters.appendChild(b);
  });

  renderFound();
}

function selectTile(index){
  const btn=letters.children[index];

  if(solvedIndexes.has(index)){
    msg.textContent='Bu harf daha önce bulunan bir kelimeye ait.';
    return;
  }

  if(pathIndexes.includes(index)){
    msg.textContent='Aynı kutu bir kelimede tekrar kullanılamaz.';
    return;
  }

  if(pathIndexes.length){
    const last=pathIndexes[pathIndexes.length-1];
    if(!areNeighbors(last,index)){
      msg.textContent='Sonraki harf komşu bir kutudan seçilmeli.';
      return;
    }
  }

  pathIndexes.push(index);
  current+=btn.textContent;
  btn.style.background='#f59e0b';
  btn.style.color='#fff';
  currentWord.textContent=current;
  msg.textContent='';
}

function addFromKeyboard(ch){
  const candidates=[...letters.children]
    .map((b,i)=>({b,i}))
    .filter(x=>x.b.textContent===ch && !pathIndexes.includes(x.i) && !solvedIndexes.has(x.i));

  let target=null;

  if(!pathIndexes.length){
    target=candidates[0]||null;
  }else{
    const last=pathIndexes[pathIndexes.length-1];
    target=candidates.find(x=>areNeighbors(last,x.i))||null;
  }

  if(!target){
    msg.textContent=pathIndexes.length
      ? 'Bu harf mevcut seçimin komşularında yok.'
      : 'Bu harf tahtada yok.';
    return;
  }

  selectTile(target.i);
}

function deleteLast(){
  if(!pathIndexes.length)return;
  const last=pathIndexes.pop();
  current=current.slice(0,-1);

  const btn=letters.children[last];
  if(!solvedIndexes.has(last)){
    btn.style.background='';
    btn.style.color='';
    btn.classList.remove('strand-found');
  }

  currentWord.textContent=current;
  msg.textContent='';
}

function clearCurrent(){
  pathIndexes.forEach(i=>{
    const btn=letters.children[i];
    if(!solvedIndexes.has(i)){
      btn.style.background='';
      btn.style.color='';
      btn.classList.remove('strand-found');
    }
  });
  pathIndexes=[];
  current='';
  currentWord.textContent='';
}

function renderFound(){
  found.innerHTML='<b>Bulunan kelimeler</b><div class="small" style="margin-top:6px">'+(foundWords.join(' · ')||'Henüz kelime yok.')+'</div>';
}

function submit(){
  const w=current.trim().toLocaleUpperCase('tr-TR');

  if(!w){
    msg.textContent='Önce harf seçin.';
    return;
  }

  if(p[1].includes(w) && !foundWords.includes(w)){
    foundWords.push(w);

    pathIndexes.forEach(i=>{
      solvedIndexes.add(i);
      const btn=letters.children[i];
      btn.classList.add('strand-found');
      btn.style.background='#16a34a';
      btn.style.color='#fff';
    });

    count.textContent=foundWords.length;
    msg.textContent='Doğru!';
    renderFound();
    clearCurrent();

    if(foundWords.length===p[1].length)
      msg.textContent='Tüm tema kelimelerini buldunuz!';
  }else{
    msg.textContent=foundWords.includes(w)
      ? 'Bu kelimeyi zaten buldunuz.'
      : 'Bu tema kelimesi değil.';
  }
}

ok.onclick=submit;
deleteBtn.onclick=deleteLast;

hint.onclick=()=>{
  const left=p[1].filter(w=>!foundWords.includes(w));
  if(left.length){
    msg.textContent=`İpucu: ${left[0][0]} ile başlıyor, ${left[0].length} harf. Kelimenin harfleri tahtaya da komşu kutular halinde yerleştiriliyor.`;
  }
};

newBtn.onclick=start;

document.addEventListener('keydown',e=>{
  if(e.key==='Backspace'){
    e.preventDefault();
    deleteLast();
    return;
  }

  if(e.key==='Enter'){
    e.preventDefault();
    submit();
    return;
  }

  const ch=e.key.toLocaleUpperCase('tr-TR');
  if(ch.length===1 && ALPH.includes(ch)){
    e.preventDefault();
    addFromKeyboard(ch);
  }
});

start();

</script></body></html>
