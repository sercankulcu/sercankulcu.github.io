<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb"><title>Hangman</title><style>
:root{
  --bg:#f6f8fc;--surface:#ffffff;--surface2:#f0f4fb;--ink:#172033;--muted:#667085;
  --line:#dfe5ef;--accent:#2563eb;--accent2:#1d4ed8;--good:#16a34a;--warn:#d97706;--bad:#dc2626;
  --shadow:0 14px 40px rgba(15,23,42,.10);--r:20px
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
radial-gradient(circle at top left,#eaf1ff 0,transparent 32rem),var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit}
button{border:0}
.app{width:min(860px,94vw);margin:24px auto 40px}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(223,229,239,.9);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:white;display:grid;place-items:center;font-size:24px;font-weight:900}
h1{font-size:clamp(1.65rem,4vw,2.25rem);margin:0;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin:4px 0 0;font-size:.98rem}
.toolbar,.stats,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.stats{justify-content:center;margin:14px 0}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:800}
.btn{border-radius:12px;padding:11px 15px;background:#eaf0fb;color:var(--ink);font-weight:800;cursor:pointer;transition:.16s transform,.16s background,.16s opacity}
.btn:hover{transform:translateY(-1px);background:#dde7f7}.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}
.btn.good{background:#dcfce7;color:#166534}.btn.bad{background:#fee2e2;color:#991b1b}.btn.warn{background:#ffedd5;color:#9a3412}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.message{min-height:34px;text-align:center;font-weight:800;margin:14px 0 2px}
.help{position:fixed;right:16px;top:16px;width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;font-weight:900;z-index:10;box-shadow:0 8px 24px #0003;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.82);backdrop-filter:blur(6px);z-index:50;padding:24px;overflow:auto}
.modal.open{display:block}.modalbox{max-width:720px;margin:5vh auto;background:white;color:var(--ink);border-radius:20px;padding:24px;box-shadow:0 30px 70px #0005}
.modalbox h2{margin-top:0}.modalbox li{margin:.45rem 0}.modalclose{float:right}
.gamegrid{display:grid;gap:10px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f7;border:1px solid #d0d5dd;border-bottom-width:3px;border-radius:7px;padding:2px 7px}
.progress{height:10px;background:#e7edf6;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);width:0%;transition:width .25s}
input[type=text],input[type=number]{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 14px;background:white;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #2563eb18}
.section{background:#fbfcfe;border:1px solid var(--line);border-radius:16px;padding:16px}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:640px){.app{width:min(96vw,860px);margin:8px auto 24px}.card{padding:14px;border-radius:16px}.topbar{align-items:flex-start}.help{top:auto;bottom:14px}.btn{padding:10px 12px}.logo{width:42px;height:42px}}
</style></head>
<body>
<button class="help" id="helpBtn" aria-label="Yardım">?</button>
<div class="modal" id="helpModal" role="dialog" aria-modal="true"><div class="modalbox">
<button class="btn modalclose" id="helpClose">Kapat</button><h2>Hangman</h2><ul><li>Bir harf seçin veya klavyeden yazın.</li><li>Yanlış harflerde çizim ilerler.</li><li>6 yanlışta tur biter.</li><li>Orijinal hangman görsel dosyalarının çevrimiçi adresleri korunur.</li></ul></div></div>
<div class="app"><div class="card">
<div class="topbar"><div class="brand"><div class="logo">🎯</div><div><h1>Hangman</h1><p class="subtitle">Altı yanlış hakkıyla gizli kelimeyi bul.</p></div></div></div>
<div class="stats"><span class="stat">Skor: <b id="score">0</b></span><span class="stat">Kalan: <b id="left">6</b></span><span class="stat">Seri: <b id="streak">0</b></span></div>
<img id="hang" alt="Hangman" style="display:block;max-width:230px;width:58%;margin:10px auto">
<div id="word" style="text-align:center;font-size:clamp(22px,6vw,38px);font-weight:900;letter-spacing:.18em;margin:12px 0"></div>
<div id="kb" class="gamegrid" style="grid-template-columns:repeat(9,minmax(30px,1fr))"></div><div id="msg" class="message"></div>
<div class="actions" style="justify-content:center"><button id="restart" class="btn">Yeni Kelime</button></div>
</div></div>
<script>
const helpModal=document.getElementById('helpModal');
document.getElementById('helpBtn').onclick=()=>helpModal.classList.add('open');
document.getElementById('helpClose').onclick=()=>helpModal.classList.remove('open');
helpModal.addEventListener('click',e=>{if(e.target===helpModal)helpModal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')helpModal.classList.remove('open')});

const WORDS=["BİLGİSAYAR", "ALGORİTMA", "İSTANBUL", "PROGRAM", "KİTAPLIK", "ÖĞRENCİ", "MÜHENDİS", "TEKNOLOJİ", "BULMACA", "MATEMATİK", "İNTERNET", "YAZILIM", "DONANIM", "KLAVYE", "VERİTABANI"],ALPH='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';let word='',guessed=[],lives=6,scoreVal=0,series=0,ended=false;
function reset(){word=WORDS[Math.floor(Math.random()*WORDS.length)];guessed=[];lives=6;ended=false;left.textContent=6;msg.textContent='';buildKeys();draw()}
function draw(){hang.src=`https://sercankulcu.github.io/game/hangman/hangman-${6-lives}.png`;wordEl.textContent=[...word].map(c=>guessed.includes(c)?c:'_').join(' ')}
const wordEl=document.getElementById('word');
function buildKeys(){kb.innerHTML='';ALPH.split('').forEach(c=>{let b=document.createElement('button');b.className='btn';b.textContent=c;b.dataset.c=c;b.onclick=()=>guess(c,b);kb.appendChild(b)})}
function guess(c,b){
 if(ended||guessed.includes(c))return;guessed.push(c);b.disabled=true;
 if(word.includes(c)){b.className='btn good'}else{lives--;left.textContent=lives;b.className='btn bad'}
 draw();
 if([...word].every(c=>guessed.includes(c))){ended=true;series++;scoreVal+=word.length*10+lives*5;score.textContent=scoreVal;streak.textContent=series;msg.textContent='Tebrikler! Kelimeyi buldunuz.'}
 else if(lives===0){ended=true;series=0;streak.textContent=0;msg.textContent='Kelime: '+word}
}
document.addEventListener('keydown',e=>{const c=e.key.toLocaleUpperCase('tr-TR');const b=[...kb.children].find(x=>x.dataset.c===c);if(b)guess(c,b)});
restart.onclick=reset;reset();

</script></body></html>
