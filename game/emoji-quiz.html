  { emoji:"🌊💧🪨",answer:"Damlaya damlaya göl olur",cat:"Deyim",choices:["Damlaya damlaya göl olur","Su akar taş oyar","Dereden tepeye","Yağmur seli getirir"] },
  { emoji:"🐺🐑😱",answer:"Kurt gibi acıkmak",cat:"Deyim",choices:["Kurt gibi acıkmak","Tilki gibi kurnaz","Aslan gibi güçlü","Kartal gibi bakmak"] },
  { emoji:"🎯🏹✅",answer:"Hedefi tutturmak",  cat:"Deyim",choices:["Hedefi tutturmak","Ok atmak","Nişan almak","İsabet etmek"] },
  { emoji:"💡🧠🔍",answer:"Kafa yormak",      cat:"Deyim",choices:["Kafa yormak","Akıl yürütmek","Beyin fırtınası","Düşünmek"] },
];

const CATS = ["Tümü", "Film", "Ülke", "Yiyecek", "Deyim"];
let selectedCat = "Tümü";
let questions = [];
let qIdx = 0;
let score = 0;
let correctCount = 0;
let timerInt = null;
let timeLeft = 15;
let answered = false;

function filteredQuestions() {
  const q = selectedCat === "Tümü" ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.cat === selectedCat);
  return shuffle([...q]).slice(0, 15);
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function renderCats() {
  const wrap = document.getElementById("eq-cats");
  wrap.innerHTML = "";
  CATS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "eq-cat-btn" + (selectedCat === cat ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => { selectedCat = cat; startGame(); });
    wrap.appendChild(btn);
  });
}

function startGame() {
  questions = filteredQuestions();
  qIdx = 0; score = 0; correctCount = 0; answered = false;
  document.getElementById("eq-score").textContent = "0";
  document.getElementById("eq-correct").textContent = "0";
  document.getElementById("eq-end-card").style.display = "none";
  document.getElementById("eq-card").style.display = "";
  renderCats();
  showQuestion();
}

function showQuestion() {
  if (qIdx >= questions.length) { endGame(); return; }
  const q = questions[qIdx];
  answered = false;
  timeLeft = 15;

  document.getElementById("eq-progress").style.width = `${(qIdx/questions.length)*100}%`;
  document.getElementById("eq-qnum").textContent = `${qIdx+1}/${questions.length}`;
  document.getElementById("eq-cat-tag").textContent = q.cat;
  document.getElementById("eq-emoji").textContent = q.emoji;
  document.getElementById("eq-timer").textContent = timeLeft;
  document.getElementById("eq-next-btn").style.display = "none";

  const choiceEls = document.getElementById("eq-choices");
  choiceEls.innerHTML = "";
  shuffle([...q.choices]).forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "eq-choice";
    btn.textContent = choice;
    btn.addEventListener("click", () => selectAnswer(choice, q.answer));
    choiceEls.appendChild(btn);
  });

  clearInterval(timerInt);
  timerInt = setInterval(() => {
    timeLeft--;
    document.getElementById("eq-timer").textContent = timeLeft;
    if (timeLeft <= 0) { clearInterval(timerInt); timeUp(q.answer); }
  }, 1000);
}

function selectAnswer(chosen, correct) {
  if (answered) return;
  answered = true;
  clearInterval(timerInt);

  const isCorrect = chosen === correct;
  if (isCorrect) { score += 10 + timeLeft; correctCount++; }

  document.getElementById("eq-score").textContent = score;
  document.getElementById("eq-correct").textContent = correctCount;

  document.querySelectorAll(".eq-choice").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correct) btn.classList.add("correct");
    else if (btn.textContent === chosen && !isCorrect) btn.classList.add("wrong");
  });

  const nextBtn = document.getElementById("eq-next-btn");
  nextBtn.style.display = "";
  nextBtn.textContent = qIdx + 1 < questions.length ? "Sonraki Soru →" : "Sonucu Gör";
}

function timeUp(correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll(".eq-choice").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correct) btn.classList.add("correct");
  });
  const nextBtn = document.getElementById("eq-next-btn");
  nextBtn.style.display = "";
  nextBtn.textContent = qIdx + 1 < questions.length ? "Sonraki Soru →" : "Sonucu Gör";
}

function endGame() {
  clearInterval(timerInt);
  document.getElementById("eq-card").style.display = "none";
  document.getElementById("eq-end-card").style.display = "";
  const pct = Math.round((correctCount / questions.length) * 100);
  const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "🎉" : pct >= 40 ? "👍" : "💪";
  document.getElementById("eq-end-title").textContent = `${emoji} Oyun Bitti!`;
  document.getElementById("eq-end-score").textContent = score;
  document.getElementById("eq-end-sub").textContent = `puan · ${correctCount}/${questions.length} doğru (${pct}%)`;
}

document.getElementById("eq-next-btn").addEventListener("click", () => { qIdx++; showQuestion(); });
document.getElementById("eq-restart-btn").addEventListener("click", startGame);

renderCats();
startGame();
})();
</script>
