---
layout: without-sidebar
title: "Mantra"
permalink: /mantra/
excerpt: "A guided mantra exercise for observing thoughts, slowing down and focusing through repetition."
---

<style>
.mantra-app,
.mantra-app *,
.mantra-app *::before,
.mantra-app *::after {
  box-sizing: border-box;
}

.mantra-app {
  width: min(760px, calc(100% - 24px));
  margin: .5rem auto 1.5rem;
  color: var(--global-text-color);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.mantra-panel {
  padding: 24px;
  border: 1px solid var(--global-border-color);
  border-radius: 18px;
  background: var(--global-bg-color);
  box-shadow: 0 12px 35px rgba(0, 0, 0, .07);
}

.mantra-hero {
  max-width: 620px;
  margin: 0 auto;
  text-align: center;
}

.mantra-logo {
  display: block;
  width: 120px;
  height: 120px;
  margin: 0 auto 18px;
  border-radius: 28px;
  object-fit: cover;
}

.mantra-title {
  margin: 0;
  color: var(--global-text-color);
  font-size: clamp(1.9rem, 5vw, 2.7rem);
  line-height: 1.08;
  letter-spacing: -.035em;
}

.mantra-text {
  min-height: 150px;
  margin: 12px auto 0;
  color: var(--global-text-color);
  opacity: .76;
  font-size: .96rem;
  line-height: 1.7;
  white-space: pre-line;
}

.mantra-input-wrap {
  margin-top: 20px;
}

.mantra-input {
  width: 100%;
  min-height: 54px;
  padding: 12px 16px;
  border: 2px solid var(--global-border-color);
  border-radius: 14px;
  background: var(--global-bg-color);
  color: var(--global-text-color);
  font: inherit;
  font-size: 1rem;
  text-align: center;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.mantra-input:focus {
  border-color: var(--global-link-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--global-link-color) 18%, transparent);
}

.mantra-input.is-correct {
  border-color: #2f855a;
}

.mantra-input.is-wrong {
  border-color: #c53030;
}

.mantra-actions {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
}

.mantra-next {
  width: 100%;
  min-height: 46px;
  padding: 0 18px;
  border: 1px solid var(--global-link-color);
  border-radius: 999px;
  background: var(--global-link-color);
  color: #fff;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  transition: filter .18s ease, opacity .18s ease;
}

.mantra-next:hover:not(:disabled) {
  filter: brightness(1.1);
}

.mantra-next:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.mantra-skip,
.mantra-about {
  min-height: 46px;
  padding: 0 18px;
  border: 1px solid var(--global-border-color);
  border-radius: 999px;
  background: transparent;
  color: var(--global-text-color);
  font: inherit;
  font-weight: 750;
  cursor: pointer;
}

.mantra-skip:hover,
.mantra-about:hover {
  background: rgba(127, 127, 127, .10);
}

.mantra-skip[hidden],
.mantra-about[hidden] {
  display: none;
}

.mantra-info {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid var(--global-border-color);
  border-radius: 14px;
  background: rgba(127, 127, 127, .045);
}

.mantra-info[hidden] {
  display: none;
}

.mantra-info-title {
  margin: 0 0 10px;
  color: var(--global-text-color);
  font-size: 1rem;
}

.mantra-info-list {
  margin: 0;
}

.mantra-info-list > div + div {
  margin-top: 10px;
}

.mantra-info-list dt {
  color: var(--global-text-color);
  opacity: .58;
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.mantra-info-list dd {
  margin: 3px 0 0;
  color: var(--global-text-color);
  opacity: .82;
  font-size: .86rem;
  line-height: 1.55;
}

.mantra-progress {
  margin: 12px 0 0;
  color: var(--global-text-color);
  opacity: .5;
  text-align: center;
  font-size: .72rem;
}

@media (max-width: 600px) {
  .mantra-app {
    width: 100%;
    margin: 0 auto 1rem;
  }

  .mantra-panel {
    padding: 18px 14px;
    border-radius: 14px;
  }

  .mantra-logo {
    width: 96px;
    height: 96px;
  }

  .mantra-text {
    min-height: 180px;
    font-size: .9rem;
  }

  .mantra-actions {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mantra-app *,
  .mantra-app *::before,
  .mantra-app *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<div class="mantra-app">
  <section class="mantra-panel" aria-labelledby="mantra-heading">
    <div class="mantra-hero">
      <img
        class="mantra-logo"
        src="/mantra/assets/icons/android-chrome-192.png"
        alt="Mantra"
        width="120"
        height="120"
      >

      <h1 class="mantra-title" id="mantra-heading">Mantra</h1>
      <p class="mantra-text" id="mantra-text" aria-live="polite"></p>
    </div>

    <div class="mantra-input-wrap" id="mantra-input-wrap" hidden>
      <input
        class="mantra-input"
        id="mantra-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Type the mantra exactly as shown"
        placeholder="Write here"
      >
    </div>

    <div class="mantra-actions">
      <button class="mantra-next" id="mantra-next" type="button">Next</button>
      <button class="mantra-skip" id="mantra-skip" type="button">Skip to Mantra</button>
      <button class="mantra-about" id="mantra-about" type="button" hidden>About this Mantra</button>
    </div>

    <div class="mantra-info" id="mantra-info" hidden>
      <h2 class="mantra-info-title">About this Mantra</h2>
      <dl class="mantra-info-list">
        <div>
          <dt>Source</dt>
          <dd id="mantra-source"></dd>
        </div>
        <div>
          <dt>Meaning</dt>
          <dd id="mantra-meaning"></dd>
        </div>
        <div>
          <dt>Context</dt>
          <dd id="mantra-context"></dd>
        </div>
      </dl>
    </div>

    <p class="mantra-progress" id="mantra-progress"></p>
  </section>
</div>

<script>
(() => {
  "use strict";

  const INTRO = [
    {
      heading: "Welcome!",
      text: "Are you ready for a journey designed to calm the thoughts that arise during meditation and bring peace to your mind? Join us as we embark on an exploration in harmony with the natural essence of meditation, allowing you to flow effortlessly with your inner rhythm."
    },
    {
      heading: "Mantra: The Silent Dance of Thoughts",
      text: "At the core of meditation are mantras, not just word combinations but also keys that enable you to observe your thoughts. The brain adapts to the tranquil and repetitive frequency of the mantra, resembling a dance of harmony rather than force. Here, you will travel within your inner world with the magical rhythm of mantras, observing the serene dance of thoughts."
    },
    {
      heading: "Observation of Thoughts and Discovery of Simplicity",
      text: "Meditation is not just about achieving a state but understanding the cyclical nature of thoughts and discovering the beauty of simplicity. Beyond thoughts, find balance in harmony with your inner rhythm. Mantras should be used as a guide directing you towards the nature of meditation."
    },
    {
      heading: "Journey to Harmony Without Force",
      text: "Meditation with mantras invites you on an adventure to align with your natural frequency. Discover a calm and gentle path beyond mental clutter, allowing you to peacefully traverse beyond your thoughts. Remember, it's not a race; it's a gentle guidance for you to comfortably progress in your inner exploration."
    },
    {
      heading: "Meet Yourself, Dance with Your Thoughts",
      text: "Meditation with mantras provides a key to meet yourself. Quietly observe your thoughts, find your rhythm, and explore the beauty of meditation. Each repetition brings you a step closer to your inner peace."
    }
  ];

  const MANTRAS = [
    {
      sanskrit: "ॐ भूर्भुवः स्वः । तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् ॥",
      transliteration: "Om bhur bhuvah svah, tat savitur varenyam, bhargo devasya dhimahi, dhiyo yo nah prachodayat.",
      source: "Gayatri Mantra — Rigveda 3.62.10; the Om and bhur bhuvah svah prefix belongs to the traditional liturgical recitation.",
      meaning: "We meditate on the excellent radiance of the divine Savitr; may it inspire and guide our understanding.",
      context: "One of the best-known Vedic mantras, traditionally associated with contemplation, illumination and clarity of mind."
    },
    {
      sanskrit: "ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात् ॥",
      transliteration: "Om tryambakam yajamahe sugandhim pushtivardhanam, urvarukam iva bandhanan mrityor mukshiya ma amritat.",
      source: "Mahamrityunjaya / Tryambaka Mantra — Rigveda 7.59.12; also found in Yajurveda traditions.",
      meaning: "We worship the three-eyed one, fragrant and life-nourishing; may we be released from the bondage of death, not from immortality.",
      context: "A Vedic prayer addressed to Tryambaka (Rudra), traditionally recited for protection, healing, courage and liberation."
    },
    {
      sanskrit: "असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मामृतं गमय ॥",
      transliteration: "Asato ma sad gamaya, tamaso ma jyotir gamaya, mrityor ma amritam gamaya.",
      source: "Brihadaranyaka Upanishad 1.3.28.",
      meaning: "Lead me from the unreal to the real, from darkness to light, and from death to immortality.",
      context: "An Upanishadic prayer for movement from confusion toward truth, understanding and the deathless."
    },
    {
      sanskrit: "ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः शान्तिः शान्तिः ॥",
      transliteration: "Om saha navavatu, saha nau bhunaktu, saha viryam karavavahai, tejasvi navadhitam astu, ma vidvishavahai. Om shanti shanti shanti.",
      source: "Shanti Mantra associated with the Taittiriya and other Upanishadic recitation traditions.",
      meaning: "May we be protected and nourished together; may we work with energy, may our study be illuminating, and may we not be hostile to one another.",
      context: "Traditionally recited by teacher and student before study, emphasizing cooperation, shared effort and peace."
    },
    {
      sanskrit: "ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥",
      transliteration: "Om purnamadah purnamidam, purnat purnam udachyate, purnasya purnam adaya, purnamevavashishyate. Om shanti shanti shanti.",
      source: "Shanti invocation traditionally recited with the Isha Upanishad and Brihadaranyaka Upanishad.",
      meaning: "That is whole; this is whole. From wholeness, wholeness arises. Even when wholeness is taken from wholeness, wholeness remains.",
      context: "A compact expression of completeness or infinity, often used as an invocation before Upanishadic study."
    },
    {
      sanskrit: "ॐ शं नो मित्रः शं वरुणः । शं नो भवत्वर्यमा । शं न इन्द्रो बृहस्पतिः । शं नो विष्णुरुरुक्रमः ॥",
      transliteration: "Om sham no mitrah sham varunah, sham no bhavatv aryama, sham na indro brihaspatih, sham no vishnur urukramah.",
      source: "Taittiriya Upanishad 1.1.1, opening peace invocation.",
      meaning: "May Mitra, Varuna, Aryaman, Indra, Brihaspati and far-striding Vishnu be gracious and auspicious toward us.",
      context: "An ancient Vedic-style invocation asking for favorable conditions before sacred study."
    },
    {
      sanskrit: "भद्रं कर्णेभिः शृणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिर्व्यशेम देवहितं यदायुः ॥",
      transliteration: "Bhadram karnebhih shrinuyama devah, bhadram pashyemakshabhir yajatrah, sthirair angais tushtuvamsas tanubhir vyashema devahitam yad ayuh.",
      source: "Rigveda 1.89.8.",
      meaning: "May we hear what is auspicious and see what is auspicious; may we live our allotted span with strong bodies in praise of the divine.",
      context: "A Vedic blessing for wholesome perception, bodily steadiness and a life aligned with what is beneficial."
    },
    {
      sanskrit: "सं गच्छध्वं सं वदध्वं सं वो मनांसि जानताम् । देवा भागं यथा पूर्वे संजानाना उपासते ॥",
      transliteration: "Sam gacchadhvam sam vadadhvam, sam vo manamsi janatam, deva bhagam yatha purve, samjanana upasate.",
      source: "Rigveda 10.191.2.",
      meaning: "Move together, speak together, and let your minds understand together, as the ancient gods acted in concord.",
      context: "A Vedic verse centered on unity, shared understanding and cooperation."
    },
    {
      sanskrit: "अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् । युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥",
      transliteration: "Agne naya supatha raye asman, vishvani deva vayunani vidvan, yuyodhy asmaj juhuranam eno, bhuyishtham te nama uktim vidhema.",
      source: "Isha Upanishad 18; the verse also has a Vedic antecedent.",
      meaning: "O Agni, lead us by the good path; knowing all ways, remove from us the crooked fault, and to you we offer our salutations.",
      context: "The closing prayer of the Isha Upanishad, asking for right direction and freedom from harmful tendencies."
    },
    {
      sanskrit: "ॐ नमः शिवाय ॥",
      transliteration: "Om namah Shivaya.",
      source: "Traditional Shaiva Panchakshara mantra; the formula namah shivaya appears in the Shri Rudram of the Yajurveda tradition.",
      meaning: "Om. Salutations to Shiva — literally, reverence to the auspicious one.",
      context: "One of the central Shaiva mantras, widely used for devotional repetition, inward focus and contemplation."
    }
  ];

  const heading = document.getElementById("mantra-heading");
  const text = document.getElementById("mantra-text");
  const inputWrap = document.getElementById("mantra-input-wrap");
  const input = document.getElementById("mantra-input");
  const next = document.getElementById("mantra-next");
  const skip = document.getElementById("mantra-skip");
  const about = document.getElementById("mantra-about");
  const info = document.getElementById("mantra-info");
  const source = document.getElementById("mantra-source");
  const meaning = document.getElementById("mantra-meaning");
  const context = document.getElementById("mantra-context");
  const progress = document.getElementById("mantra-progress");

  let step = 0;
  let currentMantra = "";
  let currentItem = null;
  let audioStarted = false;
  let phase = "intro";

  function startAudioOnce() {
    if (audioStarted) return;
    audioStarted = true;

    const audio = new Audio("/mantra/assets/media/please-calm-my-mind.mp3");
    audio.play().catch(() => {});
  }

  function showIntro() {
    const item = INTRO[step];

    heading.textContent = item.heading;
    text.textContent = item.text;
    inputWrap.hidden = true;
    next.disabled = false;
    skip.hidden = false;
    about.hidden = true;
    info.hidden = true;
    progress.textContent = `${step + 1} / ${INTRO.length}`;

    if (step === 1) {
      startAudioOnce();
    }

    step += 1;
  }

  function showMantra() {
    currentItem = MANTRAS[Math.floor(Math.random() * MANTRAS.length)];
    currentMantra = currentItem.transliteration;
    phase = "mantra";

    heading.textContent = "Mantra of the Day";
    text.textContent = `${currentItem.sanskrit}\n\n${currentItem.transliteration}`;

    source.textContent = currentItem.source;
    meaning.textContent = currentItem.meaning;
    context.textContent = currentItem.context;

    inputWrap.hidden = false;
    input.value = "";
    input.classList.remove("is-correct", "is-wrong");
    next.disabled = true;
    next.textContent = "Complete";
    skip.hidden = true;
    about.hidden = false;
    about.textContent = "About this Mantra";
    info.hidden = true;
    progress.textContent = "Type the transliteration exactly as shown.";

    input.focus();
  }

  function showComplete() {
    phase = "complete";

    heading.textContent = "Practice Complete";
    text.textContent = "You completed today's mantra practice.";
    inputWrap.hidden = true;
    next.disabled = false;
    next.textContent = "Start Again";
    skip.hidden = true;
    about.hidden = true;
    info.hidden = true;
    progress.textContent = "";
  }

  function restart() {
    step = 0;
    currentMantra = "";
    currentItem = null;
    phase = "intro";

    input.value = "";
    input.classList.remove("is-correct", "is-wrong");

    next.textContent = "Next";
    next.disabled = false;
    skip.hidden = false;
    about.hidden = true;
    info.hidden = true;

    showIntro();
  }

  function advance() {
    if (phase === "intro") {
      if (step < INTRO.length) {
        showIntro();
      } else {
        showMantra();
      }
      return;
    }

    if (phase === "mantra") {
      showComplete();
      return;
    }

    if (phase === "complete") {
      restart();
    }
  }

  input.addEventListener("input", () => {
    const value = input.value;
    const prefixMatches = currentMantra.startsWith(value);
    const complete = value === currentMantra;

    input.classList.toggle("is-wrong", value.length > 0 && !prefixMatches);
    input.classList.toggle("is-correct", complete);

    next.disabled = !complete;
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !next.disabled) {
      advance();
    }
  });

  skip.addEventListener("click", () => {
    if (phase !== "intro") return;
    step = INTRO.length;
    showMantra();
  });

  about.addEventListener("click", () => {
    const willOpen = info.hidden;
    info.hidden = !willOpen;
    about.textContent = willOpen ? "Hide Mantra Info" : "About this Mantra";
  });

  next.addEventListener("click", advance);

  advance();
})();
</script>
