---
layout: without-sidebar
title: "Mantra"
permalink: /mantra/
excerpt: "A guided mantra exercise for observing thoughts, slowing down and focusing through repetition."
---

<style>
.mantra-app,
.mantra-app *,
.mantra-app *::before,
.mantra-app *::after {
  box-sizing: border-box;
}

.mantra-app {
  width: min(760px, calc(100% - 24px));
  margin: .5rem auto 1.5rem;
  color: var(--global-text-color);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.mantra-panel {
  padding: 24px;
  border: 1px solid var(--global-border-color);
  border-radius: 18px;
  background: var(--global-bg-color);
  box-shadow: 0 12px 35px rgba(0, 0, 0, .07);
}

.mantra-hero {
  max-width: 620px;
  margin: 0 auto;
  text-align: center;
}

.mantra-logo {
  display: block;
  width: 120px;
  height: 120px;
  margin: 0 auto 18px;
  border-radius: 28px;
  object-fit: cover;
}

.mantra-title {
  margin: 0;
  color: var(--global-text-color);
  font-size: clamp(1.9rem, 5vw, 2.7rem);
  line-height: 1.08;
  letter-spacing: -.035em;
}

.mantra-text {
  min-height: 150px;
  margin: 12px auto 0;
  color: var(--global-text-color);
  opacity: .76;
  font-size: .96rem;
  line-height: 1.7;
  white-space: pre-line;
}

.mantra-input-wrap {
  margin-top: 20px;
}

.mantra-input {
  width: 100%;
  min-height: 54px;
  padding: 12px 16px;
  border: 2px solid var(--global-border-color);
  border-radius: 14px;
  background: var(--global-bg-color);
  color: var(--global-text-color);
  font: inherit;
  font-size: 1rem;
  text-align: center;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.mantra-input:focus {
  border-color: var(--global-link-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--global-link-color) 18%, transparent);
}

.mantra-input.is-correct {
  border-color: #2f855a;
}

.mantra-input.is-wrong {
  border-color: #c53030;
}

.mantra-actions {
  margin-top: 14px;
}

.mantra-next {
  width: 100%;
  min-height: 46px;
  padding: 0 18px;
  border: 1px solid var(--global-link-color);
  border-radius: 999px;
  background: var(--global-link-color);
  color: #fff;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  transition: filter .18s ease, opacity .18s ease;
}

.mantra-next:hover:not(:disabled) {
  filter: brightness(1.1);
}

.mantra-next:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.mantra-progress {
  margin: 12px 0 0;
  color: var(--global-text-color);
  opacity: .5;
  text-align: center;
  font-size: .72rem;
}

@media (max-width: 600px) {
  .mantra-app {
    width: 100%;
    margin: 0 auto 1rem;
  }

  .mantra-panel {
    padding: 18px 14px;
    border-radius: 14px;
  }

  .mantra-logo {
    width: 96px;
    height: 96px;
  }

  .mantra-text {
    min-height: 180px;
    font-size: .9rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mantra-app *,
  .mantra-app *::before,
  .mantra-app *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<div class="mantra-app">
  <section class="mantra-panel" aria-labelledby="mantra-heading">
    <div class="mantra-hero">
      <img
        class="mantra-logo"
        src="/mantra/assets/icons/android-chrome-192.png"
        alt="Mantra"
        width="120"
        height="120"
      >

      <h1 class="mantra-title" id="mantra-heading">Mantra</h1>
      <p class="mantra-text" id="mantra-text" aria-live="polite"></p>
    </div>

    <div class="mantra-input-wrap" id="mantra-input-wrap" hidden>
      <input
        class="mantra-input"
        id="mantra-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Type the mantra exactly as shown"
        placeholder="Write here"
      >
    </div>

    <div class="mantra-actions">
      <button class="mantra-next" id="mantra-next" type="button">Next</button>
    </div>

    <p class="mantra-progress" id="mantra-progress"></p>
  </section>
</div>

<script>
(() => {
  "use strict";

  const INTRO = [
    {
      heading: "Welcome!",
      text: "Are you ready for a journey designed to calm the thoughts that arise during meditation and bring peace to your mind? Join us as we embark on an exploration in harmony with the natural essence of meditation, allowing you to flow effortlessly with your inner rhythm."
    },
    {
      heading: "Mantra: The Silent Dance of Thoughts",
      text: "At the core of meditation are mantras, not just word combinations but also keys that enable you to observe your thoughts. The brain adapts to the tranquil and repetitive frequency of the mantra, resembling a dance of harmony rather than force. Here, you will travel within your inner world with the magical rhythm of mantras, observing the serene dance of thoughts."
    },
    {
      heading: "Observation of Thoughts and Discovery of Simplicity",
      text: "Meditation is not just about achieving a state but understanding the cyclical nature of thoughts and discovering the beauty of simplicity. Beyond thoughts, find balance in harmony with your inner rhythm. Mantras should be used as a guide directing you towards the nature of meditation."
    },
    {
      heading: "Journey to Harmony Without Force",
      text: "Meditation with mantras invites you on an adventure to align with your natural frequency. Discover a calm and gentle path beyond mental clutter, allowing you to peacefully traverse beyond your thoughts. Remember, it's not a race; it's a gentle guidance for you to comfortably progress in your inner exploration."
    },
    {
      heading: "Meet Yourself, Dance with Your Thoughts",
      text: "Meditation with mantras provides a key to meet yourself. Quietly observe your thoughts, find your rhythm, and explore the beauty of meditation. Each repetition brings you a step closer to your inner peace."
    }
  ];

  const MANTRAS = [
    { text: "I am worthy of love and abundance.", original: "अहं प्रेम एवं प्रचुरतायां योग्यः अस्मि।" },
    { text: "I embrace change and welcome growth.", original: "आदित्यत्यागं ग्रहणामि च वृद्धिं।" },
    { text: "I trust in the journey of my life.", original: "आत्मनः जीवनस्य विश्वासं करोमि।" },
    { text: "I release all that does not serve me.", original: "सर्वं यत् न मां सेवते त्यजामि।" },
    { text: "I am grateful for this moment and all it brings.", original: "इदं क्षणं च सर्वं यत् आनयति च आनन्दयामि।" },
    { text: "I attract positivity and repel negativity.", original: "सत्त्वं आकर्षामि रजस् च निवर्तयामि।" },
    { text: "I am capable of achieving my dreams.", original: "मे स्वप्नान् सिद्धुं शक्तः अस्मि।" },
    { text: "I forgive myself and others, and let go of resentment.", original: "मा आत्मानं और परों क्षमामि, विवादस्य अपहारिणीयः।" },
    { text: "I radiate confidence, strength, and inner peace.", original: "आत्मविश्वासं, शक्ति और आंतरिक शांति को चिित्रत करता हूँ।" },
    { text: "I am a magnet for miracles and blessings.", original: "महान् चमत्कारान् और आशीर्वादों का आकर्षक हूँ।" }
  ];

  const heading = document.getElementById("mantra-heading");
  const text = document.getElementById("mantra-text");
  const inputWrap = document.getElementById("mantra-input-wrap");
  const input = document.getElementById("mantra-input");
  const next = document.getElementById("mantra-next");
  const progress = document.getElementById("mantra-progress");

  let step = 0;
  let currentMantra = "";
  let audioStarted = false;

  function stylizeMantra(source) {
    let result = source;
    const changes = Math.max(1, Math.floor(source.length / 7));

    for (let i = 0; i < changes; i++) {
      const index = Math.floor(Math.random() * result.length);
      result =
        result.substring(0, index) +
        result.charAt(index).toUpperCase() +
        result.substring(index + 1);
    }

    return result;
  }

  function startAudioOnce() {
    if (audioStarted) return;
    audioStarted = true;

    const audio = new Audio("/mantra/assets/media/please-calm-my-mind.mp3");
    audio.play().catch(() => {});
  }

  function showIntro() {
    const item = INTRO[step];

    heading.textContent = item.heading;
    text.textContent = item.text;
    inputWrap.hidden = true;
    next.disabled = false;
    progress.textContent = `${step + 1} / ${INTRO.length}`;

    if (step === 1) {
      startAudioOnce();
    }

    step += 1;
  }

  function showMantra() {
    const item = MANTRAS[Math.floor(Math.random() * MANTRAS.length)];

    currentMantra = stylizeMantra(item.text);

    heading.textContent = "Mantra of the Day";
    text.textContent = `${item.original}\n\n${currentMantra}`;

    inputWrap.hidden = false;
    input.value = "";
    input.classList.remove("is-correct", "is-wrong");
    next.disabled = true;
    progress.textContent = "Type the mantra exactly as shown.";

    input.focus();
  }

  function advance() {
    if (step < INTRO.length) {
      showIntro();
    } else {
      showMantra();
    }
  }

  input.addEventListener("input", () => {
    const value = input.value;
    const prefixMatches = currentMantra.startsWith(value);

    input.classList.toggle("is-wrong", value.length > 0 && !prefixMatches);
    input.classList.toggle("is-correct", value === currentMantra);

    next.disabled = value !== currentMantra;
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !next.disabled) {
      advance();
    }
  });

  next.addEventListener("click", advance);

  advance();
})();
</script>
