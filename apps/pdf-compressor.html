<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>PDF Compressor</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs";window.pdfjsLib=pdfjsLib;window.dispatchEvent(new Event("pdfjs-ready"));</script><style>
:root{--panel:#121a2b;--panel2:#182238;--line:#293752;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#83d7ae;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.24),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.16),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.app{width:min(980px,100%)}.panel{border:1px solid var(--line);border-radius:26px;background:rgba(18,26,43,.97);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(16px,3vw,30px)}
.brand{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.hero{text-align:center;margin:12px auto 0}.hero h1{margin:0;font-size:clamp(1.9rem,5vw,3.2rem);letter-spacing:-.04em}.hero p{max-width:700px;margin:9px auto 0;color:var(--muted);line-height:1.55;font-size:.9rem}
.drop{border:1px dashed #4b5e82;border-radius:17px;padding:20px;text-align:center;background:#0f1727;cursor:pointer}.drop.drag{border-color:var(--accent);background:#14223b}
.card{border:1px solid var(--line);border-radius:16px;background:#101827;padding:14px}.field{display:grid;gap:5px}.field label{font-size:.7rem;color:var(--muted);font-weight:800}
input,select,textarea{width:100%;min-height:41px;border:1px solid var(--line);border-radius:11px;background:#0d1525;color:var(--text);padding:0 10px;font:inherit}textarea{padding:10px}
.btn{min-height:41px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:0 13px;font:inherit;font-size:.79rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.btn:disabled{opacity:.38;cursor:not-allowed}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta{font-size:.73rem;color:var(--muted);line-height:1.5}.note{text-align:center;color:#758095;font-size:.68rem;margin:15px 0 0}.canvasWrap{display:grid;place-items:center;overflow:auto}.canvasWrap canvas{max-width:100%;height:auto;background:white;border-radius:8px;touch-action:none}
@media(max-width:680px){body{padding:6px}.panel{padding:14px 10px;border-radius:20px}.row{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="panel"><div class="brand">Mobile PDF Tool</div><div class="hero"><h1>PDF Compressor</h1><p>Compress image-heavy PDFs by rendering pages as JPEG and rebuilding the document. Ideal for upload-size limits.</p></div>
<div class="drop" id="drop">Choose PDF<input id="file" type="file" accept=".pdf,application/pdf" hidden></div><div class="card" style="margin-top:12px"><div class="row"><div class="field"><label>Quality</label><input id="quality" type="range" min="35" max="90" value="68"></div><div class="field"><label>Render scale</label><select id="scale"><option value="1">Small</option><option value="1.35" selected>Balanced</option><option value="1.7">High quality</option></select></div></div><p class="meta" id="info">Choose a PDF.</p><div class="actions"><button class="btn primary" id="compress" disabled>Compress & Download</button></div></div><p class="note">Raster compression removes selectable text, links, forms and vector data. Keep the original PDF.</p></section></main><script>
const $=id=>document.getElementById(id);let bytes=null,file=null;
$("drop").onclick=()=>$("file").click();$("file").onchange=async e=>{file=e.target.files[0];if(!file)return;bytes=new Uint8Array(await file.arrayBuffer());$("info").textContent=(file.size/1048576).toFixed(2)+" MB · ready";$("compress").disabled=false};
$("compress").onclick=async()=>{if(!window.pdfjsLib)return alert("PDF.js is still loading");$("compress").disabled=true;$("info").textContent="Processing…";let src=await pdfjsLib.getDocument({data:bytes.slice()}).promise,out=await PDFLib.PDFDocument.create(),q=+$("quality").value/100,sc=+$("scale").value;for(let i=1;i<=src.numPages;i++){let p=await src.getPage(i),vp=p.getViewport({scale:sc}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;let jpg=await out.embedJpg(c.toDataURL("image/jpeg",q)),op=out.addPage([p.view[2],p.view[3]]);op.drawImage(jpg,{x:0,y:0,width:op.getWidth(),height:op.getHeight()});$("info").textContent="Page "+i+" / "+src.numPages}let b=await out.save(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));a.download="compressed.pdf";a.click();$("info").textContent="Output: "+(b.length/1048576).toFixed(2)+" MB";$("compress").disabled=false};
</script></body></html>
