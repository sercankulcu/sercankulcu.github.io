<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>QR Code Generator</title>
<meta name="description" content="Create QR codes for URLs, text, Wi-Fi networks and email directly in your browser.">
<style>
:root{--bg:#0b1020;--panel:#121a2b;--line:#273652;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.25),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.17),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.app{width:min(900px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(18,26,43,.96);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(18px,4vw,34px)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.badge{font-size:.72rem;color:var(--muted)}
.hero{text-align:center;margin:16px auto 0}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.6;margin:11px auto 0;max-width:620px}
.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:20px}.tab{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:8px 13px;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer}.tab.active{background:var(--accent);color:#09101c;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:20px}.form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:.72rem;color:var(--muted);font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#0d1525;color:var(--text);font:inherit;padding:11px 12px;outline:none}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qrbox{border:1px solid var(--line);border-radius:20px;background:#0e1625;padding:17px;display:grid;place-items:center;align-content:center;min-height:330px}.qrwrap{background:white;padding:12px;border-radius:14px}.qrwrap canvas,.qrwrap img{display:block;max-width:100%}.hint{color:var(--muted);font-size:.75rem;text-align:center;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#182238;color:var(--text);padding:0 14px;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.note{margin:18px 0 0;text-align:center;color:#77849a;font-size:.69rem}
@media(max-width:720px){body{padding:8px}.panel{padding:16px 12px;border-radius:22px}.grid{grid-template-columns:1fr}.qrbox{min-height:280px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app"><section class="panel">
<div class="top"><div class="brand">Browser Tool</div><div class="badge">Local · Private</div></div>
<div class="hero"><h1>QR Code Generator</h1><p>Create QR codes for links, text, Wi-Fi credentials and email. Everything is generated locally in your browser.</p></div>
<div class="tabs">
<button class="tab active" data-type="url">URL</button><button class="tab" data-type="text">Text</button><button class="tab" data-type="wifi">Wi-Fi</button><button class="tab" data-type="email">Email</button>
</div>
<div class="grid">
<div>
<div id="forms">
<div class="form" data-form="url"><div class="field"><label>Website URL</label><input id="urlInput" type="url" placeholder="https://example.com"></div></div>
<div class="form" data-form="text" hidden><div class="field"><label>Text</label><textarea id="textInput" placeholder="Enter any text"></textarea></div></div>
<div class="form" data-form="wifi" hidden>
<div class="field"><label>Network name (SSID)</label><input id="ssid" placeholder="My Wi-Fi"></div>
<div class="field"><label>Password</label><input id="wifiPass" placeholder="Password"></div>
<div class="row"><div class="field"><label>Security</label><select id="security"><option>WPA</option><option>WEP</option><option value="nopass">None</option></select></div><div class="field"><label>Hidden network</label><select id="hidden"><option value="false">No</option><option value="true">Yes</option></select></div></div>
</div>
<div class="form" data-form="email" hidden>
<div class="field"><label>Email address</label><input id="emailTo" type="email" placeholder="name@example.com"></div>
<div class="field"><label>Subject</label><input id="emailSubject" placeholder="Subject"></div>
<div class="field"><label>Message</label><textarea id="emailBody" placeholder="Message"></textarea></div>
</div>
</div>
<div class="row" style="margin-top:14px">
<div class="field"><label>Size</label><select id="size"><option value="220">220 px</option><option value="300" selected>300 px</option><option value="420">420 px</option></select></div>
<div class="field"><label>Error correction</label><select id="ecc"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="generate">Generate QR</button><button class="btn" id="copyData">Copy Data</button><button class="btn" id="download">Download PNG</button></div>
</div>
<div class="qrbox"><div class="qrwrap" id="qr"></div><div class="hint" id="status">Enter data and generate a QR code.</div></div>
</div>
<p class="note">No data is uploaded to a server.</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let type="url",lastData="",lastCanvas=null;
const $=id=>document.getElementById(id);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll("[data-form]").forEach(x=>x.hidden=x.dataset.form!==type)});
function escWifi(s){return String(s).replace(/([\\;,":])/g,"\\$1")}
function data(){
 if(type==="url")return $("urlInput").value.trim();
 if(type==="text")return $("textInput").value;
 if(type==="wifi")return `WIFI:T:${$("security").value};S:${escWifi($("ssid").value)};P:${escWifi($("wifiPass").value)};H:${$("hidden").value};;`;
 const to=$("emailTo").value.trim(),sub=encodeURIComponent($("emailSubject").value),body=encodeURIComponent($("emailBody").value);
 return `mailto:${to}?subject=${sub}&body=${body}`;
}
function generate(){
 const value=data();
 if(!value){
   $("status").textContent="Please enter some data first.";
   return;
 }
 if(typeof window.QRCode!=="function"){
   $("status").textContent="QR library could not be loaded.";
   return;
 }

 const size=+$("size").value;
 const eccMap={
   L: QRCode.CorrectLevel.L,
   M: QRCode.CorrectLevel.M,
   Q: QRCode.CorrectLevel.Q,
   H: QRCode.CorrectLevel.H
 };

 $("qr").innerHTML="";

 new QRCode($("qr"),{
   text:value,
   width:size,
   height:size,
   colorDark:"#0a1020",
   colorLight:"#ffffff",
   correctLevel:eccMap[$("ecc").value]
 });

 requestAnimationFrame(()=>{
   const canvas=$("qr").querySelector("canvas");
   const img=$("qr").querySelector("img");
   lastCanvas=canvas||null;
   lastData=value;

   if(canvas){
     canvas.style.maxWidth="100%";
     canvas.style.height="auto";
   }
   if(img){
     img.style.maxWidth="100%";
     img.style.height="auto";
   }

   $("status").textContent="QR code ready.";
 });
}
$("generate").onclick=generate;
$("copyData").onclick=async()=>{const v=data();if(!v)return;try{await navigator.clipboard.writeText(v);$("status").textContent="Data copied."}catch{$("status").textContent="Copy failed."}};
$("download").onclick=()=>{
 if(!lastData){
   generate();
   return;
 }
 const canvas=$("qr").querySelector("canvas");
 const img=$("qr").querySelector("img");
 const href=canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");
 if(!href){
   $("status").textContent="Generate a QR code first.";
   return;
 }
 const a=document.createElement("a");
 a.href=href;
 a.download="qr-code.png";
 document.body.appendChild(a);
 a.click();
 a.remove();
};
</script>
</body></html>
