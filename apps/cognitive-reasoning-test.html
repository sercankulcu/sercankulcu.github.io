    {cat:"Quantitative",q:"A box contains 24 balls. One quarter are red. How many are not red?",opts:["6","12","18","20"],a:"18",exp:"One quarter is 6, so 18 are not red.",tr_q:"Bir kutuda 24 top var. Dörtte biri kırmızıysa kaç top kırmızı değildir?",tr_opts:["6","12","18","20"],tr_a:"18",tr_exp:"24'ün dörtte biri 6'dır; geriye 18 kalır."},
    {cat:"Quantitative",q:"4 workers finish a job in 12 days. At the same rate, how many days for 8 workers?",opts:["3","6","8","24"],a:"6",exp:"Doubling the workforce halves the time.",tr_q:"4 işçi bir işi 12 günde bitiriyor. Aynı hızla 8 işçi kaç günde bitirir?",tr_opts:["3","6","8","24"],tr_a:"6",tr_exp:"İşçi sayısı iki katına çıkınca süre yarıya iner."},
    {cat:"Quantitative",q:"A number increased by 25% becomes 50. What was the original number?",opts:["37.5","40","42","45"],a:"40",exp:"50 / 1.25 = 40.",tr_q:"Bir sayı %25 artırılınca 50 oluyor. İlk sayı kaçtır?",tr_opts:["37,5","40","42","45"],tr_a:"40",tr_exp:"50 / 1,25 = 40."},
    {cat:"Pattern",q:"3, 6, 18, 72, ?",opts:["144","216","288","360"],a:"360",exp:"Multiply by 2, then 3, then 4, then 5.",tr_q:"3, 6, 18, 72, ?",tr_opts:["144","216","288","360"],tr_a:"360",tr_exp:"Sırasıyla 2, 3, 4 ve 5 ile çarpılır."},
    {cat:"Pattern",q:"AZ, BY, CX, DW, ?",opts:["EV","EU","FV","EW"],a:"EV",exp:"First letter moves forward; second moves backward.",tr_q:"AZ, BY, CX, DW, ?",tr_opts:["EV","EU","FV","EW"],tr_a:"EV",tr_exp:"İlk harf ileri, ikinci harf geri gider."},
    {cat:"Pattern",q:"1, 2, 6, 24, ?",opts:["48","96","120","144"],a:"120",exp:"Factorials: 1!, 2!, 3!, 4!, 5!.",tr_q:"1, 2, 6, 24, ?",tr_opts:["48","96","120","144"],tr_a:"120",tr_exp:"Faktöriyeller: 1!, 2!, 3!, 4!, 5!."},
    {cat:"Pattern",q:"Which completes the pattern? ○ △ ○ △ ○ ?",opts:["○","△","□","◇"],a:"△",exp:"Circle and triangle alternate.",tr_q:"Örüntüyü hangisi tamamlar? ○ △ ○ △ ○ ?",tr_opts:["○","△","□","◇"],tr_a:"△",tr_exp:"Daire ve üçgen sırayla tekrar eder."},
    {cat:"Pattern",q:"2, 3, 5, 8, 12, 17, ?",opts:["21","22","23","24"],a:"23",exp:"Differences are +1, +2, +3, +4, +5, then +6.",tr_q:"2, 3, 5, 8, 12, 17, ?",tr_opts:["21","22","23","24"],tr_a:"23",tr_exp:"Farklar +1, +2, +3, +4, +5 ve ardından +6'dır."},
    {cat:"Pattern",q:"11, 22, 21, 42, 41, ?",opts:["61","72","82","84"],a:"82",exp:"Alternate ×2 and −1.",tr_q:"11, 22, 21, 42, 41, ?",tr_opts:["61","72","82","84"],tr_a:"82",tr_exp:"Sırayla ×2 ve −1 uygulanır."}
  ];

  const UI = {
    tr: {
      title: "Bilişsel Akıl Yürütme Testi",
      sub: "30 soru · 5 akıl yürütme alanı",
      intro: "Sayısal, mantıksal, sözel, nicel ve örüntüsel akıl yürütmeyi kapsayan kısa ve klinik olmayan bir testtir. Sonuç standardize edilmiş IQ ölçümü değil, tahmini bir akıl yürütme puanıdır.",
      start: "Teste Başla",
      q: "Soru",
      time: "Süre",
      result: "Sonucunuz",
      score: "Tahmini Akıl Yürütme Puanı",
      accuracy: "Doğruluk",
      correct: "doğru",
      again: "Tekrar Dene",
      review: "Cevapları İncele",
      hide: "İncelemeyi Gizle",
      pdf: "PDF Raporunu İndir",
      name: "Adınız",
      cats: "Kategori Dağılımı",
      disc: "Bu test yalnızca eğlence ve kişisel değerlendirme amaçlıdır. Klinik veya standardize edilmiş bir IQ testi değildir.",
      levels: [
        "Gelişmekte olan performans",
        "Ortalama performans",
        "Güçlü performans",
        "Çok güçlü performans",
        "Olağanüstü performans"
      ]
    },
    en: {
      title: "Cognitive Reasoning Test",
      sub: "30 questions · 5 reasoning areas",
      intro: "A short, non-clinical challenge covering numerical, logical, verbal, quantitative and pattern reasoning. The result is an estimated reasoning score, not a standardized IQ measurement.",
      start: "Start Test",
      q: "Question",
      time: "Time",
      result: "Your Result",
      score: "Estimated Reasoning Score",
      accuracy: "Accuracy",
      correct: "correct",
      again: "Try Again",
      review: "Review Answers",
      hide: "Hide Review",
      pdf: "Download PDF Report",
      name: "Your name",
      cats: "Category Breakdown",
      disc: "This test is for entertainment and self-reflection only. It is not a clinical or standardized IQ assessment.",
      levels: [
        "Developing performance",
        "Average performance",
        "Strong performance",
        "Very strong performance",
        "Exceptional performance"
      ]
    }
  };

  const CATS = [
    "Numerical",
    "Logical",
    "Verbal",
    "Quantitative",
    "Pattern"
  ];

  const TRCATS = {
    Numerical: "Sayısal",
    Logical: "Mantıksal",
    Verbal: "Sözel",
    Quantitative: "Nicel",
    Pattern: "Örüntü"
  };

  const byId = id =>
    document.getElementById(id);

  let lang =
    localStorage.getItem(
      "iqtest-language"
    ) ||
    (
      (navigator.language || "")
        .toLowerCase()
        .startsWith("tr")
        ? "tr"
        : "en"
    );

  let items = [];
  let index = 0;
  let answers = [];
  let started = 0;
  let timerId = null;

  function shuffle(array) {
    const copy = [...array];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {
      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [copy[i], copy[j]] =
        [copy[j], copy[i]];
    }

    return copy;
  }

  function questionText(question) {
    return lang === "tr"
      ? question.tr_q
      : question.q;
  }

  function questionOptions(question) {
    return lang === "tr"
      ? question.tr_opts
      : question.opts;
  }

  function questionAnswer(question) {
    return lang === "tr"
      ? question.tr_a
      : question.a;
  }

  function questionExplanation(question) {
    return lang === "tr"
      ? question.tr_exp
      : question.exp;
  }

  function categoryName(category) {
    return lang === "tr"
      ? TRCATS[category]
      : category;
  }

  function applyLanguage() {
    const t =
      UI[lang];

    document
      .querySelector(".iq-app")
      .lang = lang;

    byId("iq-title")
      .textContent = t.title;

    byId("iq-sub")
      .textContent = t.sub;

    byId("iq-intro")
      .textContent = t.intro;

    byId("iq-start-btn")
      .textContent = t.start;

    byId("iq-disc")
      .textContent = t.disc;

    document
      .querySelectorAll(".iq-lang")
      .forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(
            button.dataset.lang ===
            lang
          )
        );
      });

    if (
      byId("iq-test")
        .classList
        .contains("active")
    ) {
      renderQuestion();
    }

    if (
      byId("iq-results")
        .classList
        .contains("active")
    ) {
      renderResults();
    }
  }

  function startTest() {
    items =
      shuffle(QUESTIONS)
        .map(question => ({
          ...question,
          order:
            shuffle([0, 1, 2, 3])
        }));

    index = 0;
    answers = [];
    started = Date.now();

    byId("iq-landing")
      .style.display = "none";

    byId("iq-results")
      .classList
      .remove("active");

    byId("iq-test")
      .classList
      .add("active");

    clearInterval(timerId);

    timerId =
      window.setInterval(
        updateTimer,
        1000
      );

    updateTimer();
    renderQuestion();
  }

  function updateTimer() {
    const seconds =
      Math.floor(
        (Date.now() - started) / 1000
      );

    const minutes =
      Math.floor(seconds / 60);

    byId("iq-timer")
      .textContent =
        `${UI[lang].time}: ` +
        `${minutes}:` +
        String(
          seconds % 60
        ).padStart(2, "0");
  }

  function renderQuestion() {
    const question =
      items[index];

    const t =
      UI[lang];

    const options =
      questionOptions(question);

    byId("iq-qmeta")
      .textContent =
        `${t.q} ${index + 1} / ${items.length}`;

    byId("iq-cat")
      .textContent =
        categoryName(
          question.cat
        );

    byId("iq-question")
      .textContent =
        questionText(question);

    byId("iq-options")
      .innerHTML =
        question.order
          .map(optionIndex => `
            <button
              class="iq-option"
              type="button"
              data-option-index="${optionIndex}"
            >
              ${options[optionIndex]}
            </button>
          `)
          .join("");

    document
      .querySelectorAll(".iq-option")
      .forEach(button => {
        button.addEventListener(
          "click",
          () =>
            pickAnswer(
              Number(
                button.dataset
                  .optionIndex
              ),
              button
            )
        );
      });

    const percent =
      index /
      items.length *
      100;

    byId("iq-bar")
      .style.width =
        `${percent}%`;

    document
      .querySelector(".iq-bar")
      .setAttribute(
        "aria-valuenow",
        String(index)
      );
  }

  function pickAnswer(
    optionIndex,
    button
  ) {
    document
      .querySelectorAll(".iq-option")
      .forEach(option => {
        option.disabled = true;
      });

    button
      .classList
      .add("selected");

    const question =
      items[index];

    const correct =
      optionIndex ===
      question.opts
        .indexOf(question.a);

    answers.push({
      q: question,
      i: optionIndex,
      correct
    });

    window.setTimeout(() => {
      index += 1;

      if (
        index < items.length
      ) {
        renderQuestion();
      } else {
        finish();
      }
    }, 220);
  }

  function finish() {
    clearInterval(timerId);

    byId("iq-test")
      .classList
      .remove("active");

    byId("iq-results")
      .classList
      .add("active");

    renderResults();
  }

  function stats() {
    const correct =
      answers.filter(
        answer => answer.correct
      ).length;

    const pct =
      Math.round(
        correct /
        answers.length *
        100
      );

    const score =
      Math.round(
        70 +
        Math.pow(
          correct / answers.length,
          .92
        ) *
        75
      );

    const cats = {};

    CATS.forEach(category => {
      cats[category] = {
        c: 0,
        n: 0
      };
    });

    answers.forEach(answer => {
      cats[answer.q.cat].n += 1;

      if (
        answer.correct
      ) {
        cats[answer.q.cat].c += 1;
      }
    });

    return {
      correct,
      pct,
      score,
      cats
    };
  }

  function performanceLevel(pct) {
    const levelIndex =
      pct >= 90
        ? 4
        : pct >= 80
          ? 3
          : pct >= 67
            ? 2
            : pct >= 45
              ? 1
              : 0;

    return UI[lang]
      .levels[levelIndex];
  }

  function renderResults() {
    const t =
      UI[lang];

    const result =
      stats();

    byId("iq-result-head")
      .textContent =
        t.result;

    byId("iq-score")
      .textContent =
        result.score;

    byId("iq-score-label")
      .textContent =
        t.score;

    byId("iq-ring")
      .style
      .setProperty(
        "--pct",
        `${result.pct}%`
      );

    byId("iq-level")
      .textContent =
        performanceLevel(
          result.pct
        );

    byId("iq-result-text")
      .textContent =
        `${result.correct} / ${answers.length} ` +
        `${t.correct} · ${result.pct}% ${t.accuracy}`;

    byId("iq-cats-head")
      .textContent =
        t.cats;

    byId("iq-breakdown")
      .innerHTML =
        CATS
          .map(category => {
            const value =
              result.cats[category];

            const percent =
              Math.round(
                value.c /
                value.n *
                100
              );

            return `
              <div class="iq-breakrow">
                <span>
                  ${categoryName(category)}
                </span>

                <div class="iq-mini">
                  <span
                    style="width:${percent}%"
                  ></span>
                </div>

                <b>
                  ${value.c}/${value.n}
                </b>
              </div>
            `;
          })
          .join("");

    byId("iq-again-btn")
      .textContent =
        t.again;

    byId("iq-review-btn")
      .textContent =
        byId("iq-review")
          .classList
          .contains("active")
          ? t.hide
          : t.review;

    byId("iq-pdf-btn")
      .textContent =
        t.pdf;

    byId("iq-name-input")
      .placeholder =
        t.name;

    renderReview();
  }

  function renderReview() {
    byId("iq-review")
      .innerHTML =
        answers
          .map(
            (answer, answerIndex) => {
              const options =
                questionOptions(
                  answer.q
                );

              const chosen =
                options[answer.i];

              return `
                <div class="iq-review-item">
                  <h3>
                    ${answerIndex + 1}.
                    ${questionText(answer.q)}
                  </h3>

                  <p class="${answer.correct ? "ok" : "bad"}">
                    ${answer.correct ? "✓" : "✕"}
                    ${chosen}
                  </p>

                  ${
                    answer.correct
                      ? ""
                      : `
                        <p>
                          ✓ ${questionAnswer(answer.q)}
                        </p>
                      `
                  }

                  <p>
                    ${questionExplanation(answer.q)}
                  </p>
                </div>
              `;
            }
          )
          .join("");
  }

  function toggleReview() {
    const review =
      byId("iq-review");

    review
      .classList
      .toggle("active");

    byId("iq-review-btn")
      .textContent =
        review
          .classList
          .contains("active")
          ? UI[lang].hide
          : UI[lang].review;
  }

  function transliterateName(value) {
    return value
      .replace(/Ç/g, "C")
      .replace(/ç/g, "c")
      .replace(/Ğ/g, "G")
      .replace(/ğ/g, "g")
      .replace(/İ/g, "I")
      .replace(/ı/g, "i")
      .replace(/Ö/g, "O")
      .replace(/ö/g, "o")
      .replace(/Ş/g, "S")
      .replace(/ş/g, "s")
      .replace(/Ü/g, "U")
      .replace(/ü/g, "u");
  }

  function downloadPdf() {
    if (
      !window.jspdf
    ) {
      alert(
        "PDF library could not be loaded."
      );

      return;
    }

    const {
      jsPDF
    } =
      window.jspdf;

    const documentPdf =
      new jsPDF();

    const result =
      stats();

    const pdfText = {
      title:
        "Cognitive Reasoning Test",
      score:
        "Estimated Reasoning Score",
      accuracy:
        "Accuracy",
      categories:
        "Category Breakdown",
      disclaimer:
        "This test is for entertainment and self-reflection only. It is not a clinical or standardized IQ assessment."
    };

    const rawName =
      byId("iq-name-input")
        .value
        .trim();

    const name =
      transliterateName(
        rawName || "-"
      );

    documentPdf.setFont(
      "helvetica",
      "bold"
    );

    documentPdf.setFontSize(
      20
    );

    documentPdf.text(
      pdfText.title,
      20,
      25
    );

    documentPdf.setFont(
      "helvetica",
      "normal"
    );

    documentPdf.setFontSize(
      11
    );

    documentPdf.text(
      `Name: ${name}`,
      20,
      38
    );

    documentPdf.text(
      `${pdfText.score}: ${result.score}`,
      20,
      52
    );

    documentPdf.text(
      `${pdfText.accuracy}: ` +
      `${result.pct}% ` +
      `(${result.correct}/${answers.length} correct)`,
      20,
      61
    );

    let y = 77;

    documentPdf.setFont(
      "helvetica",
      "bold"
    );

    documentPdf.text(
      pdfText.categories,
      20,
      y
    );

    documentPdf.setFont(
      "helvetica",
      "normal"
    );

    y += 10;

    CATS.forEach(category => {
      const value =
        result.cats[category];

      documentPdf.text(
        `${category}: ${value.c}/${value.n}`,
        20,
        y
      );

      y += 8;
    });

    y += 8;

    documentPdf.text(
      documentPdf
        .splitTextToSize(
          pdfText.disclaimer,
          170
        ),
      20,
      y
    );

    documentPdf.save(
      "reasoning-report.pdf"
    );
  }

  document
    .querySelectorAll(".iq-lang")
    .forEach(button => {
      button.addEventListener(
        "click",
        () => {
          lang =
            button.dataset.lang;

          localStorage.setItem(
            "iqtest-language",
            lang
          );

          applyLanguage();
        }
      );
    });

  byId("iq-start-btn")
    .addEventListener(
      "click",
      startTest
    );

  byId("iq-again-btn")
    .addEventListener(
      "click",
      startTest
    );

  byId("iq-review-btn")
    .addEventListener(
      "click",
      toggleReview
    );

  byId("iq-pdf-btn")
    .addEventListener(
      "click",
      downloadPdf
    );

  applyLanguage();
})();
</script>
