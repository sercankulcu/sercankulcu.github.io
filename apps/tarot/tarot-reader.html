  const browserLanguage = (navigator.language || "")
    .toLowerCase()
    .split("-")[0];

  let language = localStorage.getItem("tarot-language") ||
    (LANGS.includes(browserLanguage) ? browserLanguage : "en");

  let drawn = [];
  let revealed = [false, false, false];
  let toastTimer;

  const byId = (id) => document.getElementById(id);

  function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  function drawCards() {
    drawn = shuffle(CARDS).slice(0, 3);
    revealed = [false, false, false];
    render();
  }

  function positionText(index) {
    return UI[language][MODES[index]];
  }

  function meaning(card, index) {
    const mode = MODES[index];
    const supportText = SUPPORT[language][mode]
      .replaceAll("{theme}", card.theme[language]);

    return `${card.angle[language][mode]} ${supportText}`;
  }

  function render() {
    const t = UI[language];
    const app = document.querySelector(".tarot-app");

    if (app) {
      app.lang = language;
    }

    byId("title").textContent = t.title;
    byId("subtitle").textContent = t.subtitle;
    byId("intro").textContent = t.intro;
    byId("newBtn").textContent = "↻ " + t.new;
    byId("shareBtn").textContent = t.share;
    byId("copyBtn").textContent = t.copy;
    byId("xBtn").textContent = t.x;
    byId("waBtn").textContent = t.wa;

    document.querySelectorAll(".lang").forEach((button) => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang === language)
      );
    });

    byId("cards").innerHTML = drawn
      .map((card, index) => `
        <div class="slot">
          <p class="position">${positionText(index)}</p>

          <button
            class="card ${revealed[index] ? "flipped" : ""}"
            type="button"
            data-index="${index}"
            aria-label="${revealed[index] ? card.name[language] : t.tap}"
            aria-pressed="${revealed[index]}"
          >
            <span class="card-inner">
              <span class="face back"></span>
              <span
                class="face front"
                style="background-image:url('${ASSET_BASE}${card.image}')"
              ></span>
            </span>
          </button>

          <p class="card-name">
            ${
              revealed[index]
                ? card.name[language]
                : `✦ <span class="hint">${t.tap}</span>`
            }
          </p>

          ${
            revealed[index]
              ? `<span class="card-keywords">${card.theme[language]}</span>`
              : `<span class="card-keywords">&nbsp;</span>`
          }
        </div>
      `)
      .join("");

    byId("readings").innerHTML = drawn
      .map((card, index) => `
        <article class="reading ${revealed[index] ? "visible" : ""}">
          <h2>${positionText(index)}</h2>
          <h3>${card.name[language]}</h3>
          <p>${meaning(card, index)}</p>
        </article>
      `)
      .join("");

    const complete = revealed.every(Boolean);

    byId("actions").classList.toggle("visible", complete);

    document.querySelectorAll(".card").forEach((button) => {
      button.addEventListener("click", () => {
        revealCard(Number(button.dataset.index));
      });
    });
  }

  function revealCard(index) {
    if (revealed[index]) {
      return;
    }

    const cardButton =
      document.querySelector(`.card[data-index="${index}"]`);

    if (cardButton) {
      cardButton.classList.add("revealing");
    }

    setTimeout(() => {
      revealed[index] = true;
      render();
    }, 260);
  }

  function setLanguage(lang) {
    if (!LANGS.includes(lang)) {
      return;
    }

    language = lang;
    localStorage.setItem("tarot-language", lang);
    render();
  }

  function readingText() {
    const t = UI[language];

    const cardsText = drawn
      .map((card, index) =>
        `${positionText(index)} — ${card.name[language]}\n✦ ${card.theme[language]}\n${meaning(card, index)}`
      )
      .join("\n\n");

    return `🔮 ${t.shareTitle}\n\n${cardsText}\n\n✨ ${PAGE_URL}`;
  }

  function toast(message) {
    clearTimeout(toastTimer);

    byId("toast").textContent = message;
    byId("toast").classList.add("show");

    toastTimer = setTimeout(() => {
      byId("toast").classList.remove("show");
    }, 1700);
  }

  async function copyReading() {
    try {
      await navigator.clipboard.writeText(readingText());
    } catch (error) {
      const textarea = document.createElement("textarea");
      textarea.value = readingText();
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    toast(UI[language].copied);
  }

  async function shareReading() {
    if (!navigator.share) {
      copyReading();
      return;
    }

    try {
      await navigator.share({
        title: UI[language].shareTitle,
        text: readingText(),
        url: PAGE_URL
      });
    } catch (error) {
      if (error.name !== "AbortError") {
        copyReading();
      }
    }
  }

  document.querySelectorAll(".lang").forEach((button) => {
    button.addEventListener("click", () => {
      setLanguage(button.dataset.lang);
    });
  });

  byId("newBtn").addEventListener("click", drawCards);
  byId("shareBtn").addEventListener("click", shareReading);
  byId("copyBtn").addEventListener("click", copyReading);

  byId("xBtn").addEventListener("click", () => {
    window.open(
      `https://twitter.com/intent/tweet?text=${encodeURIComponent(readingText())}`,
      "_blank",
      "noopener,noreferrer"
    );
  });

  byId("waBtn").addEventListener("click", () => {
    window.open(
      `https://wa.me/?text=${encodeURIComponent(readingText())}`,
      "_blank",
      "noopener,noreferrer"
    );
  });

  drawCards();
})();
