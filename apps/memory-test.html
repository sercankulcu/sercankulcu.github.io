<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Memory Test</title><style>
:root{--panel:#121a2b;--panel2:#182238;--line:#293752;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#83d7ae;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.24),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.16),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text)}
.app{width:min(920px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(18,26,43,.96);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(18px,4vw,34px)}
.brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.hero{text-align:center;margin:15px auto 0}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.hero p{max-width:650px;margin:10px auto 0;color:var(--muted);line-height:1.6}
.btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:0 14px;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:grid;gap:6px}.field label{font-size:.72rem;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;min-height:43px;border:1px solid var(--line);border-radius:12px;background:#0d1525;color:var(--text);padding:0 11px;font:inherit}textarea{padding:10px;min-height:100px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.note{text-align:center;color:#758095;font-size:.69rem;margin:17px 0 0}.drop{border:1px dashed #4b5e82;border-radius:18px;padding:24px;text-align:center;background:#0f1727;cursor:pointer}.drop.drag{border-color:var(--accent);background:#14223b}.meta{color:var(--muted);font-size:.76rem;line-height:1.5}.card{border:1px solid var(--line);border-radius:17px;background:#101827;padding:15px}
@media(max-width:650px){body{padding:8px}.panel{padding:16px 12px;border-radius:22px}}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}.tab{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:8px 13px;font:inherit;font-weight:800;cursor:pointer}.tab.active{background:var(--accent);color:#08101c;border-color:transparent}.stage{margin-top:20px;min-height:350px;display:grid;place-items:center;text-align:center}.number{font:900 clamp(2.8rem,10vw,6rem)/1 ui-monospace,monospace;letter-spacing:.08em}.pads{display:grid;grid-template-columns:repeat(3,90px);gap:10px}.pad,.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:#172137;cursor:pointer}.pad.flash,.cell.flash{background:var(--accent)}.visual{display:grid;grid-template-columns:repeat(4,70px);gap:8px}.inputWrap{display:flex;gap:8px;max-width:460px;margin:auto}.inputWrap input{font-size:1.2rem;text-align:center}.score{text-align:center;color:var(--muted);font-size:.8rem;margin-top:12px}</style></head><body>
<main class="app"><section class="panel"><div class="brand">Brain Test</div><div class="hero"><h1>Memory Test</h1><p>Challenge number memory, sequence memory and visual memory. Each correct answer increases the difficulty.</p></div>
<div class="tabs"><button class="tab active" data-mode="number">Number</button><button class="tab" data-mode="sequence">Sequence</button><button class="tab" data-mode="visual">Visual</button></div>
<div class="card stage" id="stage"></div><div class="score" id="score">Level 1 · Best 0</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="start">Start</button><button class="btn" id="reset">Reset</button></div><p class="note">Runs entirely in your browser.</p></section></main>
<script>
const $=id=>document.getElementById(id);let mode="number",level=1,best=0,answer=[],input=[],busy=false;
function status(msg=""){$("score").textContent="Level "+level+" · Best "+best+(msg?" · "+msg:"")}
function fail(){best=Math.max(best,level-1);status("Missed");busy=false;$("stage").innerHTML="<div><h2>Not quite</h2><p class='meta'>You reached level "+level+".</p></div>"}
function success(){best=Math.max(best,level);level++;status("Correct");setTimeout(start,700)}
function numberMode(){let len=level+2;answer=Array.from({length:len},()=>Math.floor(Math.random()*10)).join("");$("stage").innerHTML="<div class='number'>"+answer+"</div>";setTimeout(()=>{$("stage").innerHTML="<div><div class='inputWrap'><input id='answerInput' inputmode='numeric' autocomplete='off'><button class='btn primary' id='submit'>Submit</button></div><p class='meta'>Enter the number you saw.</p></div>";$("answerInput").focus();$("submit").onclick=()=>$("answerInput").value===answer?success():fail();$("answerInput").onkeydown=e=>{if(e.key==="Enter")$("submit").click()}},900+len*180)}
function makePads(){ $("stage").innerHTML="<div class='pads'>"+Array.from({length:9},(_,i)=>"<button class='pad' data-i='"+i+"'></button>").join("")+"</div>"}
async function sequenceMode(){makePads();answer=Array.from({length:level+2},()=>Math.floor(Math.random()*9));busy=true;for(const n of answer){await new Promise(r=>setTimeout(r,300));let el=document.querySelector("[data-i='"+n+"']");el.classList.add("flash");await new Promise(r=>setTimeout(r,330));el.classList.remove("flash")}input=[];busy=false;document.querySelectorAll(".pad").forEach(b=>b.onclick=()=>{if(busy)return;input.push(+b.dataset.i);let k=input.length-1;if(input[k]!==answer[k])return fail();if(input.length===answer.length)success()})}
function visualMode(){let total=16,count=Math.min(3+level,8);answer=[];while(answer.length<count){let x=Math.floor(Math.random()*total);if(!answer.includes(x))answer.push(x)}$("stage").innerHTML="<div class='visual'>"+Array.from({length:total},(_,i)=>"<button class='cell' data-i='"+i+"'></button>").join("")+"</div>";answer.forEach(i=>document.querySelector("[data-i='"+i+"']").classList.add("flash"));setTimeout(()=>{input=[];document.querySelectorAll(".cell").forEach(b=>{b.classList.remove("flash");b.onclick=()=>{let i=+b.dataset.i;if(b.classList.contains("flash"))return;b.classList.add("flash");input.push(i);if(!answer.includes(i))return fail();if(input.length===answer.length)success()}})},900+level*120)}
function start(){busy=false;status();if(mode==="number")numberMode();else if(mode==="sequence")sequenceMode();else visualMode()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;level=1;input=[];answer=[];document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("stage").innerHTML="<p class='meta'>Press Start.</p>";status()});
$("start").onclick=start;$("reset").onclick=()=>{level=1;best=0;$("stage").innerHTML="<p class='meta'>Press Start.</p>";status()};$("reset").click();
</script></body></html>
