<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>Kişilik Kelime Testi</title>
<meta name="description" content="Beş boyutta kelime seçimine dayalı etkileşimli kişilik profili.">
<link rel="canonical" href="https://sercankulcu.github.io/apps/personality-test.html">
<style>
:root{--bg:#0d1018;--panel:#151a26;--panel2:#1a2130;--line:#293246;--text:#f7f8fc;--muted:#aab2c4;--accent:#92a8ff;--accent2:#ca91ff;--danger:#ffb1b1;--good:#9fdbb8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;padding:14px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,rgba(95,112,190,.22),transparent 34rem),radial-gradient(circle at 85% 80%,rgba(153,82,176,.16),transparent 30rem),linear-gradient(150deg,#0a0d14,#111623 55%,#0c1019);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:min(980px,100%)}
.panel{border:1px solid var(--line);border-radius:28px;background:rgba(20,25,37,.96);box-shadow:0 28px 80px rgba(0,0,0,.42);padding:clamp(18px,3vw,32px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:.7rem;letter-spacing:.19em;text-transform:uppercase;font-weight:900;color:var(--accent)}
.langs{display:flex;gap:5px}.lang{min-width:42px;min-height:34px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}.lang[aria-pressed=true]{background:var(--accent);color:#09101a;border-color:transparent}
.hero{text-align:center;max-width:720px;margin:20px auto 0}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.7rem);line-height:1;letter-spacing:-.045em}.subtitle{margin:9px 0 0;color:var(--accent);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:850}.intro{margin:14px auto 0;color:var(--muted);font-size:.95rem;line-height:1.6;max-width:640px}
.start{text-align:center;margin-top:24px}
.btn{min-height:43px;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font:inherit;font-size:.84rem;font-weight:800;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:#465574}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a101a;border:0}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.test,.results{display:none}.active{display:block}
.progressHead{display:flex;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font-size:.79rem}.bar{height:7px;margin-top:8px;border:1px solid var(--line);border-radius:999px;background:#0d1320;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.instruction{text-align:center;margin:17px 0 0;color:var(--text);font-size:.94rem;font-weight:750}.counter{text-align:center;margin:5px 0 0;color:var(--muted);font-size:.76rem}
.words{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px auto 0;max-width:800px}
.word{min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:15px;background:#151d2b;color:var(--text);font:inherit;font-size:.88rem;font-weight:750;cursor:pointer;transition:opacity .25s,transform .25s,border-color .25s,background .25s}.word:nth-child(3n+1){transform:rotate(-.6deg)}.word:nth-child(4n+2){transform:rotate(.5deg)}.word:hover{border-color:#50648c;background:#1a2639}.word.removed{opacity:.3;text-decoration:line-through;transform:scale(.96);background:#101622;border-color:#394052}
.nav{text-align:center;margin-top:17px}
.results .hero{margin-top:14px}
.codeBox{margin:18px auto 0;width:max-content;max-width:100%;padding:12px 20px;border:1px solid var(--line);border-radius:16px;background:#101725;text-align:center}.codeLabel{color:var(--muted);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase}.code{margin-top:3px;font-size:clamp(1.8rem,5vw,2.7rem);font-weight:950;letter-spacing:.08em}
.profile{display:grid;gap:12px;margin:20px auto 0;max-width:820px}.dimension{padding:15px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.025)}.dimTop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:.79rem;font-weight:800}.dimTop span:last-child{text-align:right}.percent{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}.dual{height:10px;margin-top:9px;border-radius:999px;overflow:hidden;background:#0d1420;display:flex;border:1px solid var(--line)}.dual .left{background:linear-gradient(90deg,#7f9cff,#a489ff)}.dual .right{background:linear-gradient(90deg,#bc82e5,#e494c5)}.dimDesc{margin:9px 0 0;color:var(--muted);font-size:.8rem;line-height:1.5}.summary{max-width:760px;margin:18px auto 0;text-align:center;color:#d7dbea;line-height:1.6;font-size:.9rem}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.note{text-align:center;max-width:680px;margin:16px auto 0;color:#758095;font-size:.69rem;line-height:1.5}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#192131;color:var(--text);font-size:.78rem;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){body{padding:8px}.panel{padding:16px 11px;border-radius:22px}.words{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.word{min-height:52px;font-size:.8rem}.dimTop{font-size:.72rem}.top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app"><section class="panel">
<div class="top"><div class="brand">Personality Lab</div><div class="langs"><button class="lang" data-lang="tr">TR</button><button class="lang" data-lang="en">EN</button></div></div>
<div id="landing"><div class="hero"><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><p class="intro" id="intro"></p></div><div class="start"><button class="btn primary" id="startBtn"></button></div></div>
<div id="test" class="test"><div class="progressHead"><span id="round"></span><span id="pct"></span></div><div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="5"><span id="bar"></span></div><p class="instruction" id="instruction"></p><p class="counter" id="counter"></p><div class="words" id="words"></div><div class="nav"><button class="btn primary" id="nextBtn" disabled></button></div></div>
<div id="results" class="results"><div class="hero"><h1 id="resultTitle"></h1></div><div class="codeBox"><div class="codeLabel" id="codeLabel"></div><div class="code" id="code"></div></div><div class="profile" id="profile"></div><p class="summary" id="summary"></p><div class="actions"><button class="btn primary" id="againBtn"></button><button class="btn" id="copyBtn"></button><button class="btn" id="shareBtn"></button></div><p class="note" id="note"></p></div>
</section></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DIMS=[{"id":"social","code":["E","I"],"en":{"left":"Outgoing","right":"Reserved","left_words":["Sociable","Expressive","Talkative","Energetic","Approachable","Engaging","Group-oriented"],"right_words":["Reflective","Private","Quiet","Self-contained","Observant","Independent","Solitude-seeking"],"left_desc":"You tend to gain energy from interaction, expression, and active engagement with other people.","right_desc":"You tend to value reflection, privacy, and quieter environments where you can process things internally."},"tr":{"left":"Dışa Dönük","right":"İçe Dönük","left_words":["Sosyal","İfadeci","Konuşkan","Enerjik","Yaklaşılabilir","Katılımcı","Grup Odaklı"],"right_words":["Düşünceli","Özel Alanına Düşkün","Sessiz","Kendi Halinde","Gözlemci","Bağımsız","Yalnızlığı Seven"],"left_desc":"Etkileşimden, kendini ifade etmekten ve insanlarla aktif biçimde iletişim kurmaktan enerji alma eğilimindesin.","right_desc":"Düşünmeye, kişisel alana ve iç dünyanda değerlendirme yapabileceğin daha sakin ortamlara önem verme eğilimindesin."}},{"id":"information","code":["N","S"],"en":{"left":"Imaginative","right":"Practical","left_words":["Inventive","Curious","Visionary","Conceptual","Experimental","Original","Possibility-focused"],"right_words":["Concrete","Realistic","Hands-on","Methodical","Detail-aware","Resourceful","Application-focused"],"left_desc":"You are often drawn to possibilities, ideas, patterns, and approaches that go beyond what already exists.","right_desc":"You are often drawn to useful details, tangible evidence, and approaches that can be applied directly."},"tr":{"left":"Hayal Gücü Yüksek","right":"Pratik","left_words":["Yaratıcı","Meraklı","Vizyoner","Kavramsal","Deneysel","Özgün","Olasılık Odaklı"],"right_words":["Somut","Gerçekçi","Uygulamacı","Yöntemli","Detaycı","Çözümcü","Uygulama Odaklı"],"left_desc":"Olasılıklara, fikirlere, örüntülere ve mevcut olanın ötesine geçen yaklaşımlara yönelme eğilimindesin.","right_desc":"Kullanışlı ayrıntılara, somut kanıtlara ve doğrudan uygulanabilir yaklaşımlara yönelme eğilimindesin."}},{"id":"decision","code":["T","F"],"en":{"left":"Analytical","right":"Empathetic","left_words":["Logical","Objective-minded","Systematic","Evidence-focused","Consistent","Critical","Principle-led"],"right_words":["Compassionate","Considerate","Warm","People-aware","Supportive","Harmony-seeking","Values-led"],"left_desc":"You tend to weigh consistency, evidence, and clear reasoning when making decisions.","right_desc":"You tend to consider people, values, and emotional consequences strongly when making decisions."},"tr":{"left":"Analitik","right":"Empatik","left_words":["Mantıklı","Nesnel Düşünen","Sistematik","Kanıt Odaklı","Tutarlı","Eleştirel","İlke Odaklı"],"right_words":["Şefkatli","Düşünceli","Sıcak","İnsan Odaklı","Destekleyici","Uyum Arayan","Değer Odaklı"],"left_desc":"Karar verirken tutarlılık, kanıt ve açık akıl yürütmeye ağırlık verme eğilimindesin.","right_desc":"Karar verirken insanları, değerleri ve duygusal sonuçları güçlü biçimde dikkate alma eğilimindesin."}},{"id":"lifestyle","code":["J","P"],"en":{"left":"Structured","right":"Flexible","left_words":["Organized","Prepared","Scheduled","Orderly","Goal-driven","Predictable","Plan-oriented"],"right_words":["Adaptable","Spontaneous","Open-ended","Improvising","Easygoing","Change-ready","Option-oriented"],"left_desc":"You tend to prefer plans, clear structure, and knowing what comes next.","right_desc":"You tend to prefer room for adjustment, open options, and responding to circumstances as they develop."},"tr":{"left":"Düzenli","right":"Esnek","left_words":["Organize","Hazırlıklı","Programlı","Düzenli","Hedef Odaklı","Öngörülebilir","Plan Odaklı"],"right_words":["Uyarlanabilir","Spontane","Açık Uçlu","Doğaçlayan","Rahat","Değişime Hazır","Seçenek Odaklı"],"left_desc":"Planları, açık yapıyı ve sırada ne olduğunu bilmeyi tercih etme eğilimindesin.","right_desc":"Koşullar geliştikçe uyum sağlamak için alan, açık seçenekler ve esneklik tercih etme eğilimindesin."}},{"id":"response","code":["A","T"],"en":{"left":"Steady","right":"Responsive","left_words":["Composed","Self-assured","Resilient","Grounded","Calm","Decisive","Even-tempered"],"right_words":["Self-reflective","Feedback-aware","Improvement-oriented","Cautious","Sensitive","Adaptive","Detail-conscious"],"left_desc":"You tend to stay composed, trust your footing, and recover steadily when pressure increases.","right_desc":"You tend to monitor yourself closely, notice feedback, and adapt quickly when something could be improved."},"tr":{"left":"Dengeli","right":"Duyarlı","left_words":["Soğukkanlı","Kendinden Emin","Dayanıklı","Ayakları Yere Basan","Sakin","Kararlı","Dengeli Ruh Hali"],"right_words":["Öz Düşünümsel","Geri Bildirime Duyarlı","Gelişim Odaklı","Temkinli","Hassas","Uyarlanabilir","Detay Bilinçli"],"left_desc":"Baskı arttığında sakin kalma, duruşuna güvenme ve dengeni yeniden kazanma eğilimindesin.","right_desc":"Kendini yakından gözlemleme, geri bildirimi fark etme ve geliştirilebilecek noktalara hızla uyum sağlama eğilimindesin."}}],UI={"en":{"title":"Personality Word Test","subtitle":"Five dimensions · one personal profile","intro":"In each round, remove exactly 6 words that do NOT describe you. The remaining words shape your profile.","start":"Start Test","round":"Dimension","of":"of","instruction":"Remove exactly 6 words that do not describe you","selected":"removed","next":"Next Dimension","result":"Your Personality Profile","code":"Personality Code","balanced":"Balanced","again":"Take Again","copy":"Copy Result","share":"Share","copied":"Result copied","note":"This is an informal personality exercise inspired by common personality dimensions. It is not an official MBTI or clinical assessment.","summaryStart":"Overall, your profile suggests that you tend to ","and":" and "},"tr":{"title":"Kişilik Kelime Testi","subtitle":"Beş boyut · tek kişilik profili","intro":"Her bölümde seni TANIMLAMAYAN tam 6 kelimeyi ele. Geriye kalan kelimeler profilini oluşturur.","start":"Teste Başla","round":"Boyut","of":"/","instruction":"Seni tanımlamayan tam 6 kelimeyi ele","selected":"elendi","next":"Sonraki Boyut","result":"Kişilik Profilin","code":"Kişilik Kodu","balanced":"Dengeli","again":"Tekrar Yap","copy":"Sonucu Kopyala","share":"Paylaş","copied":"Sonuç kopyalandı","note":"Bu, yaygın kişilik boyutlarından esinlenen gayriresmî bir kişilik egzersizidir. Resmî MBTI veya klinik değerlendirme değildir.","summaryStart":"Genel olarak profilin, ","and":" ve "}};
let lang=localStorage.getItem("personality-language")||((navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en"),round=0,removed=[],results=[],toastTimer;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function applyLang(){const t=UI[lang];document.documentElement.lang=lang;document.title=t.title;$("title").textContent=t.title;$("subtitle").textContent=t.subtitle;$("intro").textContent=t.intro;$("startBtn").textContent=t.start;document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));if($("test").classList.contains("active"))renderRound();if($("results").classList.contains("active"))renderResults()}
function start(){round=0;removed=[];results=[];$("landing").style.display="none";$("results").classList.remove("active");$("test").classList.add("active");renderRound()}
function currentWords(){const d=DIMS[round],x=d[lang];return shuffle([...x.left_words.map(w=>({w,side:"left"})),...x.right_words.map(w=>({w,side:"right"}))])}
let wordCache=[];
function renderRound(){const t=UI[lang],d=DIMS[round];if(!wordCache.length||wordCache[0]?.round!==round){wordCache=currentWords().map(x=>({...x,round}))} $("round").textContent=`${t.round} ${round+1} ${t.of} ${DIMS.length}`;$("pct").textContent=Math.round(round/DIMS.length*100)+"%";$("bar").style.width=(round/DIMS.length*100)+"%";document.querySelector(".bar").setAttribute("aria-valuenow",round+1);$("instruction").textContent=t.instruction;$("nextBtn").textContent=t.next;$("words").innerHTML=wordCache.map((x,i)=>`<button class="word ${removed.includes(i)?"removed":""}" data-i="${i}" type="button">${x.w}</button>`).join("");document.querySelectorAll(".word").forEach(b=>b.onclick=()=>toggleWord(+b.dataset.i));updateCounter()}
function toggleWord(i){const p=removed.indexOf(i);if(p>=0)removed.splice(p,1);else if(removed.length<6)removed.push(i);renderRound()}
function updateCounter(){const t=UI[lang];$("counter").textContent=`${removed.length} / 6 ${t.selected}`;$("nextBtn").disabled=removed.length!==6}
function saveRound(){const d=DIMS[round],kept=wordCache.filter((_,i)=>!removed.includes(i));const l=kept.filter(x=>x.side==="left").length,r=kept.filter(x=>x.side==="right").length,total=l+r;results.push({id:d.id,left:l/total*100,right:r/total*100});round++;removed=[];wordCache=[];if(round<DIMS.length)renderRound();else finish()}
function finish(){$("test").classList.remove("active");$("results").classList.add("active");renderResults()}
function dominant(res){if(Math.abs(res.left-res.right)<0.01)return"balanced";return res.left>res.right?"left":"right"}
function renderResults(){const t=UI[lang];$("resultTitle").textContent=t.result;$("codeLabel").textContent=t.code;let code="";let phrases=[];$("profile").innerHTML=results.map((r,i)=>{const d=DIMS[i],x=d[lang],dom=dominant(r);let label,desc;if(dom==="balanced"){label=t.balanced;desc=(x.left_desc+" "+x.right_desc)}else{label=dom==="left"?x.left:x.right;desc=dom==="left"?x.left_desc:x.right_desc;code+=dom==="left"?d.code[0]:d.code[1];phrases.push(label.toLowerCase())}return `<section class="dimension"><div class="dimTop"><span>${x.left}<br><small class="percent">${Math.round(r.left)}%</small></span><b>${label}</b><span>${x.right}<br><small class="percent">${Math.round(r.right)}%</small></span></div><div class="dual"><span class="left" style="width:${r.left}%"></span><span class="right" style="width:${r.right}%"></span></div><p class="dimDesc">${desc}</p></section>`}).join("");if(code.length<5)code=results.map((r,i)=>dominant(r)==="balanced"?"X":(dominant(r)==="left"?DIMS[i].code[0]:DIMS[i].code[1])).join("");$("code").textContent=code;$("summary").textContent=t.summaryStart+phrases.join(t.and)+".";$("againBtn").textContent=t.again;$("copyBtn").textContent=t.copy;$("shareBtn").textContent=t.share;$("note").textContent=t.note}
function resultText(){const t=UI[lang];return `${t.result}\n${t.code}: ${$("code").textContent}\n\n`+results.map((r,i)=>{const x=DIMS[i][lang];return `${x.left} ${Math.round(r.left)}% · ${x.right} ${Math.round(r.right)}%`}).join("\n")+"\n\nhttps://sercankulcu.github.io/apps/personality-test.html"}
function toast(msg){clearTimeout(toastTimer);$("toast").textContent=msg;$("toast").classList.add("show");toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1600)}
async function copyResult(){try{await navigator.clipboard.writeText(resultText())}catch{const ta=document.createElement("textarea");ta.value=resultText();document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}toast(UI[lang].copied)}
async function shareResult(){if(navigator.share){try{await navigator.share({title:UI[lang].result,text:resultText(),url:"https://sercankulcu.github.io/apps/personality-test.html"});return}catch(e){if(e.name==="AbortError")return}}copyResult()}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("personality-language",lang);if($("test").classList.contains("active"))removed=[];wordCache=[];applyLang()});$("startBtn").onclick=start;$("nextBtn").onclick=saveRound;$("againBtn").onclick=()=>{wordCache=[];start()};$("copyBtn").onclick=copyResult;$("shareBtn").onclick=shareResult;applyLang();
</script></body></html>
