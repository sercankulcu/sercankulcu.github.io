      summaryStart:
        "Overall, your profile suggests that you tend to ",
      and:
        " and "
    },
    tr: {
      title:
        "Kişilik Kelime Testi",
      subtitle:
        "Beş boyut · tek kişilik profili",
      intro:
        "Her bölümde seni TANIMLAMAYAN tam 6 kelimeyi ele. Geriye kalan kelimeler profilini oluşturur.",
      start:
        "Teste Başla",
      round:
        "Boyut",
      of:
        "/",
      instruction:
        "Seni tanımlamayan tam 6 kelimeyi ele",
      selected:
        "elendi",
      next:
        "Sonraki Boyut",
      result:
        "Kişilik Profilin",
      code:
        "Kişilik Kodu",
      balanced:
        "Dengeli",
      again:
        "Tekrar Yap",
      copy:
        "Sonucu Kopyala",
      share:
        "Paylaş",
      copied:
        "Sonuç kopyalandı",
      note:
        "Bu, yaygın kişilik boyutlarından esinlenen gayriresmî bir kişilik egzersizidir. Resmî MBTI veya klinik değerlendirme değildir.",
      summaryStart:
        "Genel olarak profilin, ",
      and:
        " ve "
    }
  };

  const byId = id =>
    document.getElementById(id);

  let lang =
    localStorage.getItem(
      "personality-language"
    ) ||
    (
      (navigator.language || "")
        .toLowerCase()
        .startsWith("tr")
        ? "tr"
        : "en"
    );

  let round = 0;
  let removed = [];
  let results = [];
  let wordCache = [];
  let toastTimer = null;

  function shuffle(array) {
    const copy =
      [...array];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {
      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [copy[i], copy[j]] =
        [copy[j], copy[i]];
    }

    return copy;
  }

  function applyLanguage() {
    const t =
      UI[lang];

    document
      .querySelector(
        ".personality-app"
      )
      .lang = lang;

    byId("personality-title")
      .textContent =
        t.title;

    byId("personality-subtitle")
      .textContent =
        t.subtitle;

    byId("personality-intro")
      .textContent =
        t.intro;

    byId("personality-start-btn")
      .textContent =
        t.start;

    document
      .querySelectorAll(
        ".personality-lang"
      )
      .forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(
            button.dataset.lang ===
            lang
          )
        );
      });

    if (
      byId("personality-test")
        .classList
        .contains("active")
    ) {
      renderRound();
    }

    if (
      byId("personality-results")
        .classList
        .contains("active")
    ) {
      renderResults();
    }
  }

  function startTest() {
    round = 0;
    removed = [];
    results = [];
    wordCache = [];

    byId("personality-landing")
      .style.display =
        "none";

    byId("personality-results")
      .classList
      .remove("active");

    byId("personality-test")
      .classList
      .add("active");

    renderRound();
  }

  function currentWords() {
    const dimension =
      DIMS[round];

    const text =
      dimension[lang];

    return shuffle([
      ...text.left_words.map(
        word => ({
          word,
          side: "left"
        })
      ),
      ...text.right_words.map(
        word => ({
          word,
          side: "right"
        })
      )
    ]);
  }

  function renderRound() {
    const t =
      UI[lang];

    if (
      !wordCache.length ||
      wordCache[0]?.round !==
        round
    ) {
      wordCache =
        currentWords()
          .map(item => ({
            ...item,
            round
          }));
    }

    byId("personality-round")
      .textContent =
        `${t.round} ${round + 1} ${t.of} ${DIMS.length}`;

    const progress =
      round /
      DIMS.length *
      100;

    byId("personality-pct")
      .textContent =
        `${Math.round(progress)}%`;

    byId("personality-bar")
      .style.width =
        `${progress}%`;

    document
      .querySelector(
        ".personality-bar"
      )
      .setAttribute(
        "aria-valuenow",
        String(round + 1)
      );

    byId("personality-instruction")
      .textContent =
        t.instruction;

    byId("personality-next-btn")
      .textContent =
        t.next;

    byId("personality-words")
      .innerHTML =
        wordCache
          .map(
            (item, index) => `
              <button
                class="personality-word ${
                  removed.includes(index)
                    ? "removed"
                    : ""
                }"
                type="button"
                data-word-index="${index}"
              >
                ${item.word}
              </button>
            `
          )
          .join("");

    document
      .querySelectorAll(
        ".personality-word"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () =>
            toggleWord(
              Number(
                button.dataset
                  .wordIndex
              )
            )
        );
      });

    updateCounter();
  }

  function toggleWord(index) {
    const existing =
      removed.indexOf(index);

    if (
      existing >= 0
    ) {
      removed.splice(
        existing,
        1
      );
    } else if (
      removed.length < 6
    ) {
      removed.push(index);
    }

    renderRound();
  }

  function updateCounter() {
    const t =
      UI[lang];

    byId("personality-counter")
      .textContent =
        `${removed.length} / 6 ${t.selected}`;

    byId("personality-next-btn")
      .disabled =
        removed.length !== 6;
  }

  function saveRound() {
    const dimension =
      DIMS[round];

    const kept =
      wordCache.filter(
        (_, index) =>
          !removed.includes(index)
      );

    const leftCount =
      kept.filter(
        item =>
          item.side === "left"
      ).length;

    const rightCount =
      kept.filter(
        item =>
          item.side === "right"
      ).length;

    const total =
      leftCount +
      rightCount;

    results.push({
      id: dimension.id,
      left:
        leftCount /
        total *
        100,
      right:
        rightCount /
        total *
        100
    });

    round += 1;
    removed = [];
    wordCache = [];

    if (
      round < DIMS.length
    ) {
      renderRound();
    } else {
      finish();
    }
  }

  function finish() {
    byId("personality-test")
      .classList
      .remove("active");

    byId("personality-results")
      .classList
      .add("active");

    renderResults();
  }

  function dominant(result) {
    if (
      Math.abs(
        result.left -
        result.right
      ) < .01
    ) {
      return "balanced";
    }

    return result.left >
      result.right
      ? "left"
      : "right";
  }

  function renderResults() {
    const t =
      UI[lang];

    byId("personality-result-title")
      .textContent =
        t.result;

    byId("personality-code-label")
      .textContent =
        t.code;

    let code = "";
    const phrases = [];

    byId("personality-profile")
      .innerHTML =
        results
          .map((result, index) => {
            const dimension =
              DIMS[index];

            const text =
              dimension[lang];

            const side =
              dominant(result);

            let label;
            let description;

            if (
              side === "balanced"
            ) {
              label =
                t.balanced;

              description =
                `${text.left_desc} ${text.right_desc}`;
            } else {
              label =
                side === "left"
                  ? text.left
                  : text.right;

              description =
                side === "left"
                  ? text.left_desc
                  : text.right_desc;

              code +=
                side === "left"
                  ? dimension.code[0]
                  : dimension.code[1];

              phrases.push(
                label.toLowerCase()
              );
            }

            return `
              <section class="personality-dimension">
                <div class="personality-dim-top">
                  <span>
                    ${text.left}
                    <br>
                    <small class="personality-percent">
                      ${Math.round(result.left)}%
                    </small>
                  </span>

                  <b>
                    ${label}
                  </b>

                  <span>
                    ${text.right}
                    <br>
                    <small class="personality-percent">
                      ${Math.round(result.right)}%
                    </small>
                  </span>
                </div>

                <div class="personality-dual">
                  <span
                    class="left"
                    style="width:${result.left}%"
                  ></span>

                  <span
                    class="right"
                    style="width:${result.right}%"
                  ></span>
                </div>

                <p class="personality-dim-desc">
                  ${description}
                </p>
              </section>
            `;
          })
          .join("");

    if (
      code.length < DIMS.length
    ) {
      code =
        results
          .map(
            (result, index) => {
              const side =
                dominant(result);

              if (
                side === "balanced"
              ) {
                return "X";
              }

              return side === "left"
                ? DIMS[index].code[0]
                : DIMS[index].code[1];
            }
          )
          .join("");
    }

    byId("personality-code")
      .textContent =
        code;

    byId("personality-summary")
      .textContent =
        phrases.length
          ? `${t.summaryStart}${phrases.join(t.and)}.`
          : t.balanced;

    byId("personality-again-btn")
      .textContent =
        t.again;

    byId("personality-copy-btn")
      .textContent =
        t.copy;

    byId("personality-share-btn")
      .textContent =
        t.share;

    byId("personality-note")
      .textContent =
        t.note;
  }

  function resultText() {
    const t =
      UI[lang];

    const dimensions =
      results
        .map(
          (result, index) => {
            const text =
              DIMS[index][lang];

            return (
              `${text.left} ${Math.round(result.left)}% · ` +
              `${text.right} ${Math.round(result.right)}%`
            );
          }
        )
        .join("\n");

    return (
      `${t.result}\n` +
      `${t.code}: ${byId("personality-code").textContent}\n\n` +
      `${dimensions}\n\n` +
      PAGE_URL
    );
  }

  function showToast(message) {
    clearTimeout(
      toastTimer
    );

    const toast =
      byId("personality-toast");

    toast.textContent =
      message;

    toast
      .classList
      .add("show");

    toastTimer =
      window.setTimeout(
        () => {
          toast
            .classList
            .remove("show");
        },
        1600
      );
  }

  async function copyResult() {
    const text =
      resultText();

    try {
      await navigator
        .clipboard
        .writeText(text);
    } catch (error) {
      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value =
        text;

      textarea.style.position =
        "fixed";

      textarea.style.opacity =
        "0";

      document.body
        .appendChild(textarea);

      textarea.select();

      document.execCommand(
        "copy"
      );

      textarea.remove();
    }

    showToast(
      UI[lang].copied
    );
  }

  async function shareResult() {
    if (
      navigator.share
    ) {
      try {
        await navigator.share({
          title:
            UI[lang].result,
          text:
            resultText(),
          url:
            PAGE_URL
        });

        return;
      } catch (error) {
        if (
          error.name ===
          "AbortError"
        ) {
          return;
        }
      }
    }

    copyResult();
  }

  document
    .querySelectorAll(
      ".personality-lang"
    )
    .forEach(button => {
      button.addEventListener(
        "click",
        () => {
          lang =
            button.dataset.lang;

          localStorage.setItem(
            "personality-language",
            lang
          );

          if (
            byId("personality-test")
              .classList
              .contains("active")
          ) {
            removed = [];
          }

          wordCache = [];

          applyLanguage();
        }
      );
    });

  byId("personality-start-btn")
    .addEventListener(
      "click",
      startTest
    );

  byId("personality-next-btn")
    .addEventListener(
      "click",
      saveRound
    );

  byId("personality-again-btn")
    .addEventListener(
      "click",
      () => {
        wordCache = [];
        startTest();
      }
    );

  byId("personality-copy-btn")
    .addEventListener(
      "click",
      copyResult
    );

  byId("personality-share-btn")
    .addEventListener(
      "click",
      shareResult
    );

  applyLanguage();
})();
</script>
