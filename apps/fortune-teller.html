      --text: #f8f5ff;
      --muted: #bcb3d4;
      --accent: #b88cff;

    * { box-sizing: border-box; }

      pointer-events: none;

      padding: clamp(16px, 3.2vw, 30px);

    .eyebrow {
      margin:0; color:var(--gold); font-size:.72rem; font-weight:800;
      letter-spacing:.2em; text-transform:uppercase;
    }
    .lang-switch {
      display:inline-flex; gap:4px; padding:4px; border:1px solid var(--border);
      border-radius:999px; background:rgba(255,255,255,.045);
    }
    .lang-btn {
      min-width:42px; min-height:34px; border:0; border-radius:999px;
      color:var(--muted); background:transparent; font:inherit; font-size:.78rem;
      font-weight:800; cursor:pointer;
    }
    .lang-btn[aria-pressed="true"] {
      color:#171020; background:linear-gradient(135deg,#f1d9ff,#91e8ff);
    }

    h1 {

      font-size:clamp(2.2rem,6vw,4.5rem); line-height:.98; letter-spacing:-.045em;
    }
    .subtitle {
      max-width:560px; margin:10px auto 0; color:var(--muted);
      font-size:clamp(.96rem,2vw,1.08rem); line-height:1.7;
    }
    .oracle { display:grid; justify-items:center; margin-top:clamp(14px,2.4vw,24px); }
    .ball-wrap {
      position:relative; width:clamp(180px,30vw,250px); height:clamp(180px,30vw,250px);
      display:grid; place-items:center; isolation:isolate;
    }
    .halo, .halo::before, .halo::after {
      content:""; position:absolute; inset:5%; border-radius:50%;
      border:1px solid rgba(190,151,255,.17); animation:orbit 14s linear infinite;
    }
    .halo::before {
      inset:10%; border-color:rgba(101,215,255,.18);
      animation-duration:10s; animation-direction:reverse;
    }
    .halo::after {
      inset:-8%; border-style:dashed; border-color:rgba(255,215,122,.13); animation-duration:20s;
    }
    .crystal-ball {
      position:relative; width:67%; aspect-ratio:1; border:0; border-radius:50%; padding:0;
      cursor:pointer; outline:none; z-index:3;
      background:
        radial-gradient(circle at 33% 25%, rgba(255,255,255,.92) 0 2%, rgba(255,255,255,.18) 8%, transparent 19%),
        radial-gradient(circle at 55% 68%, rgba(85,216,255,.38), transparent 35%),
        radial-gradient(circle at 48% 45%, #7650b8 0%, #382263 45%, #100d25 75%);
      box-shadow:
        inset 0 -18px 42px rgba(4,3,18,.72),
        inset 0 10px 30px rgba(255,255,255,.12),
        0 0 22px rgba(174,120,255,.45),
        0 0 70px rgba(112,67,205,.28);
      animation:breathe 4s ease-in-out infinite;
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .crystal-ball::before {
      content:""; position:absolute; inset:13%; border-radius:inherit;
      background:conic-gradient(from 90deg, transparent 0 18%, rgba(91,224,255,.15) 25%,
        transparent 38% 60%, rgba(211,143,255,.16) 72%, transparent 82%);
      filter:blur(13px); animation:mist 8s linear infinite;
    }
    .crystal-ball::after {
      content:"✦"; position:absolute; inset:0; display:grid; place-items:center;
      color:rgba(255,255,255,.9); font-size:clamp(2.8rem,7vw,4.6rem);
      text-shadow:0 0 18px rgba(255,255,255,.7),0 0 38px rgba(168,113,255,.9);
      transition:transform .35s ease,opacity .35s ease;
    }
    .crystal-ball:hover { transform:scale(1.035); }
    .crystal-ball:focus-visible {
      box-shadow:0 0 0 4px #0a0715,0 0 0 7px var(--accent-2),0 0 85px rgba(101,215,255,.45);
    }
    .crystal-ball.revealing { animation:reveal .85s cubic-bezier(.22,.8,.28,1); }
    .crystal-ball.revealing::after { transform:scale(1.8) rotate(90deg); opacity:.25; }
    .stand {
      width:48%; height:52px; margin-top:-48px; z-index:2; position:relative;
      border-radius:50% 50% 18px 18px;
      background:linear-gradient(180deg,#d9b66c 0%,#75522b 38%,#2b1b20 100%);
      box-shadow:inset 0 3px 8px rgba(255,255,255,.25),0 18px 22px rgba(0,0,0,.38);

    .fortune-card {

    .fortune-text {

    .details {
      width:min(680px,100%); margin-top:10px; display:grid; grid-template-columns:repeat(4,1fr);
      gap:10px; opacity:0; transform:translateY(8px); pointer-events:none;
      transition:opacity .4s ease,transform .4s ease;
    }
    .details.visible { opacity:1; transform:none; pointer-events:auto; }
    .detail {
      min-width:0; padding:10px 8px; border:1px solid var(--border); border-radius:16px;
      background:rgba(255,255,255,.038); text-align:center;
    }
    .detail-label {
      display:block; color:var(--muted); font-size:.68rem; font-weight:800;
      letter-spacing:.08em; text-transform:uppercase;
    }
    .detail-value { display:block; margin-top:7px; font-size:.96rem; font-weight:800; overflow-wrap:anywhere; }
    .energy-stars { color:var(--gold); letter-spacing:.06em; white-space:nowrap; }
    .actions {
      min-height:42px; margin-top:10px; display:flex; justify-content:center; flex-wrap:wrap;
      gap:9px; opacity:0; transform:translateY(6px); pointer-events:none;
      transition:opacity .35s ease,transform .35s ease;
    }
    .actions.visible { opacity:1; transform:none; pointer-events:auto; }
    .action-btn {
      min-height:42px; padding:0 15px; border:1px solid var(--border); border-radius:999px;
      background:rgba(255,255,255,.055); color:var(--text); font:inherit; font-size:.84rem;
      font-weight:750; cursor:pointer; transition:.2s ease;
    }
    .action-btn:hover { transform:translateY(-2px); background:rgba(255,255,255,.095); }
    .action-btn:focus-visible,.lang-btn:focus-visible { outline:3px solid var(--accent-2); outline-offset:2px; }
    .note { margin:10px 0 0; color:#9189a8; text-align:center; font-size:.7rem; }
    .toast {
      position:fixed; left:50%; bottom:24px; z-index:20; transform:translate(-50%,18px);
      opacity:0; pointer-events:none; padding:11px 16px; border:1px solid var(--border);
      border-radius:999px; background:#19132d; color:var(--text);
      box-shadow:0 14px 50px rgba(0,0,0,.4); font-size:.84rem; transition:.25s ease;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @keyframes breathe {
      0%,100% { transform:translateY(0) scale(1); }
      50% { transform:translateY(-5px) scale(1.015); }
    }
    @keyframes mist { to { transform:rotate(360deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal {
      0% { transform:scale(1); filter:brightness(1); }
      35% { transform:scale(.94); filter:brightness(1.5); }
      65% { transform:scale(1.08); filter:brightness(2.2); }
      100% { transform:scale(1); filter:brightness(1); }
    }
    @media (max-width:640px) {
      body { padding:12px; place-items:start center; }
      .panel { border-radius:24px; padding:18px 14px 20px; }
      .details { grid-template-columns:repeat(2,1fr); }
      .topbar { align-items:flex-start; }
      .eyebrow { max-width:170px; line-height:1.6; }

    @media (min-width: 641px) and (max-height: 820px) {

      .ball-wrap { width: 190px; height: 190px; }
      .fortune-text { font-size: 1.08rem; line-height: 1.42; }
      .detail-label { font-size: .62rem; }
      .detail-value { font-size: .86rem; }
      .action-btn { min-height: 36px; padding: 0 12px; font-size: .78rem; }
    }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration:.001ms !important; animation-iteration-count:1 !important;
        transition-duration:.001ms !important; scroll-behavior:auto !important;
      }
    }
  </style>
</head>

    const toast = $("toast");

    let language = localStorage.getItem("fortune-language")
      || ((navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en");
    let revealed = false;
    let toastTimer;

    function hashString(value) {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function dayKey() {
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth()+1).padStart(2,"0"),
        String(now.getDate()).padStart(2,"0")
      ].join("-");
    }

    function dailyNumber(salt) {
      return hashString(`${dayKey()}|${salt}`);
    }

    function reading() {
      const fortunes = language === "tr" ? fortunesTR : fortunesEN;
      const colors = luckyColors[language];
      const symbols = luckySymbols[language];
      return {
        fortune:fortunes[dailyNumber("fortune") % fortunes.length],
        number:1 + dailyNumber("number") % 99,
        color:colors[dailyNumber("color") % colors.length],
        symbol:symbols[dailyNumber("symbol") % symbols.length],
        energy:3 + dailyNumber("energy") % 3
      };
    }

    function applyLanguage() {
      const t = ui[language];
      document.documentElement.lang = language;
      document.title = language === "tr"
        ? "Mistik Falcı | Günlük Kristal Küre Falı"
        : "Mystical Fortune Teller | Daily Crystal Ball Fortune";

      $("eyebrow").textContent = t.eyebrow;
      $("title").textContent = t.title;
      $("subtitle").textContent = t.subtitle;
      $("hint").textContent = t.hint;
      crystalBall.setAttribute("aria-label", t.ball);
      $("luckLabel").textContent = t.number;
      $("colorLabel").textContent = t.color;
      $("symbolLabel").textContent = t.symbol;
      $("energyLabel").textContent = t.energy;
      $("shareBtn").textContent = t.share;
      $("copyBtn").textContent = t.copy;
      $("xBtn").textContent = t.x;
      $("whatsappBtn").textContent = t.whatsapp;
      $("note").textContent = t.note;

      document.querySelectorAll(".lang-btn").forEach(btn =>
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === language))
      );

      revealed ? renderReading(false) : fortune.textContent = t.initial;
    }

    function renderReading(animate=true) {
      const r = reading();

      if (!animate) {
        showReading(r);
        return;
      }

      crystalBall.classList.remove("revealing");
      void crystalBall.offsetWidth;
      crystalBall.classList.add("revealing");
      fortuneCard.style.opacity = "0";
      fortuneCard.style.transform = "translateY(7px)";

      setTimeout(() => showReading(r), 430);
    }

    function showReading(r) {
      fortune.textContent = r.fortune;
      $("luckyNumber").textContent = r.number;
      $("luckyColor").textContent = r.color;
      $("luckySymbol").textContent = r.symbol;
      $("energy").textContent = "★".repeat(r.energy) + "☆".repeat(5-r.energy);

      fortuneCard.classList.add("revealed");
      fortuneCard.style.opacity = "1";
      fortuneCard.style.transform = "none";
      details.classList.add("visible");
      actions.classList.add("visible");
      revealed = true;
    }

    function shareText() {
      const t = ui[language];
      const r = reading();
      return `${r.fortune}\n\n${t.number}: ${r.number} · ${t.color}: ${r.color} · ${t.symbol}: ${r.symbol}\n${PAGE_URL}`;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    async function copyFortune() {
      try {
        await navigator.clipboard.writeText(shareText());
      } catch {
        const area = document.createElement("textarea");
        area.value = shareText();
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      showToast(ui[language].copied);
    }

    async function nativeShare() {
      if (!navigator.share) {
        copyFortune();
        return;
      }
      try {
        await navigator.share({
          title:ui[language].shareTitle,
          text:shareText(),
          url:PAGE_URL
        });
        showToast(ui[language].shared);
      } catch (error) {
        if (error.name !== "AbortError") copyFortune();
      }
    }

    function shareOnX() {
      window.open(
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}`,
        "_blank","noopener,noreferrer"
      );
    }

    function shareOnWhatsApp() {
      window.open(
        `https://wa.me/?text=${encodeURIComponent(shareText())}`,
        "_blank","noopener,noreferrer"
      );
    }

    crystalBall.addEventListener("click", () => renderReading(true));
    crystalBall.addEventListener("animationend", () => crystalBall.classList.remove("revealing"));

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        language = btn.dataset.lang;
        localStorage.setItem("fortune-language", language);
        applyLanguage();
      });
    });

    $("shareBtn").addEventListener("click", nativeShare);
    $("copyBtn").addEventListener("click", copyFortune);
    $("xBtn").addEventListener("click", shareOnX);
    $("whatsappBtn").addEventListener("click", shareOnWhatsApp);

    applyLanguage();
  </script>
</body>
</html>
