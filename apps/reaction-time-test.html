<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Reaction Time Test</title><style>
:root{--panel:#121a2b;--panel2:#182238;--line:#293752;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#83d7ae;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.24),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.16),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text)}
.app{width:min(920px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(18,26,43,.96);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(18px,4vw,34px)}
.brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.hero{text-align:center;margin:15px auto 0}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.hero p{max-width:650px;margin:10px auto 0;color:var(--muted);line-height:1.6}
.btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:0 14px;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:grid;gap:6px}.field label{font-size:.72rem;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;min-height:43px;border:1px solid var(--line);border-radius:12px;background:#0d1525;color:var(--text);padding:0 11px;font:inherit}textarea{padding:10px;min-height:100px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.note{text-align:center;color:#758095;font-size:.69rem;margin:17px 0 0}.drop{border:1px dashed #4b5e82;border-radius:18px;padding:24px;text-align:center;background:#0f1727;cursor:pointer}.drop.drag{border-color:var(--accent);background:#14223b}.meta{color:var(--muted);font-size:.76rem;line-height:1.5}.card{border:1px solid var(--line);border-radius:17px;background:#101827;padding:15px}
@media(max-width:650px){body{padding:8px}.panel{padding:16px 12px;border-radius:22px}}
.zone{margin-top:22px;height:360px;border:1px solid var(--line);border-radius:22px;background:#172033;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;user-select:none;transition:.15s}.zone.wait{background:#6e3940}.zone.go{background:#2d7b59}.zone h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:0}.zone p{color:#d4d9e4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{text-align:center}.stat b{font-size:1.35rem;display:block}.stat span{font-size:.7rem;color:var(--muted)}</style></head><body>
<main class="app"><section class="panel"><div class="brand">Brain Test</div><div class="hero"><h1>Reaction Time Test</h1><p>Wait for green, then click as quickly as you can. Five valid attempts are averaged.</p></div>
<div class="zone" id="zone"><div><h2 id="main">Click to Start</h2><p id="sub">Do not click before the screen turns green.</p></div></div>
<div class="stats"><div class="card stat"><b id="last">—</b><span>Last</span></div><div class="card stat"><b id="avg">—</b><span>Average</span></div><div class="card stat"><b id="best">—</b><span>Best</span></div></div><p class="note" id="note">Attempt 0 / 5</p></section></main>
<script>
const $=id=>document.getElementById(id);let state="idle",timer=0,t0=0,times=[];
function idle(){ $("zone").className="zone"; $("main").textContent=times.length>=5?"Test Complete — Click to Restart":"Click to Start"; $("sub").textContent=times.length>=5?"Your five-attempt average is shown below.":"Do not click before the screen turns green."; state="idle"; }
function wait(){state="wait";$("zone").className="zone wait";$("main").textContent="Wait…";$("sub").textContent="Click only when this area turns green.";timer=setTimeout(()=>{state="go";$("zone").className="zone go";$("main").textContent="CLICK!";$("sub").textContent="";t0=performance.now()},1200+Math.random()*2800)}
$("zone").onclick=()=>{if(state==="idle"){if(times.length>=5){times=[];$("last").textContent=$("avg").textContent=$("best").textContent="—";$("note").textContent="Attempt 0 / 5"}wait();return}if(state==="wait"){clearTimeout(timer);$("main").textContent="Too Soon";$("sub").textContent="That attempt does not count. Click to try again.";state="idle";return}if(state==="go"){let ms=Math.round(performance.now()-t0);times.push(ms);$("last").textContent=ms+" ms";$("avg").textContent=Math.round(times.reduce((a,b)=>a+b,0)/times.length)+" ms";$("best").textContent=Math.min(...times)+" ms";$("note").textContent="Attempt "+times.length+" / 5";state="locked";setTimeout(()=>times.length>=5?idle():wait(),700)}};
idle();
</script></body></html>
