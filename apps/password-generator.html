<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1320">
<title>Password Generator</title><meta name="description" content="Generate strong passwords and passphrases locally in your browser.">
<style>
:root{--panel:#121a2b;--line:#293752;--text:#f8fafd;--muted:#9faac0;--accent:#79d3b1;--accent2:#7aa6ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(61,154,134,.19),transparent 32rem),radial-gradient(circle at 90% 90%,rgba(72,98,183,.18),transparent 30rem),linear-gradient(155deg,#08111a,#0f1727 55%,#09111c);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:min(760px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(18,26,43,.96);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(20px,4vw,36px)}.brand{color:var(--accent);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:900}.hero{text-align:center;margin-top:16px}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.6}
.mode{display:flex;justify-content:center;gap:6px;margin-top:20px}.mode button{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:8px 14px;font:inherit;font-size:.79rem;font-weight:800;cursor:pointer}.mode button.active{background:var(--accent);color:#07120e;border-color:transparent}
.output{margin-top:20px;border:1px solid var(--line);border-radius:17px;background:#0d1524;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.value{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:clamp(1rem,3vw,1.35rem);overflow-wrap:anywhere}.copy{border:1px solid var(--line);border-radius:11px;background:#172236;color:var(--text);padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}
.form{display:grid;gap:16px;margin-top:18px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.label{font-size:.82rem;font-weight:800}.small{color:var(--muted);font-size:.72rem}.range{width:100%;accent-color:var(--accent)}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;background:#111a2a;padding:11px;font-size:.82rem}.check input{accent-color:var(--accent)}
.strength{margin-top:18px}.meter{height:9px;border:1px solid var(--line);background:#0b1320;border-radius:999px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.25s}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:var(--muted);font-size:.74rem}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{min-height:43px;border:1px solid var(--line);border-radius:13px;background:#172236;color:var(--text);padding:0 15px;font:inherit;font-size:.83rem;font-weight:800;cursor:pointer}.btn.primary{border:0;color:#07120e;background:linear-gradient(135deg,var(--accent),#9ee0c7)}.note{text-align:center;margin:18px 0 0;color:#758095;font-size:.69rem}
@media(max-width:560px){body{padding:8px}.panel{padding:17px 12px;border-radius:22px}.checks{grid-template-columns:1fr}.output{grid-template-columns:1fr}.copy{width:100%}}
</style>
</head><body><main class="app"><section class="panel">
<div class="brand">Security Tool</div><div class="hero"><h1>Password Generator</h1><p>Create strong random passwords or memorable passphrases. Generation happens locally in your browser.</p></div>
<div class="mode"><button class="active" data-mode="password">Password</button><button data-mode="passphrase">Passphrase</button></div>
<div class="output"><div class="value" id="value"></div><button class="copy" id="copy">Copy</button></div>
<div class="form" id="passwordForm">
<div><div class="row"><div><div class="label">Length</div><div class="small">Longer passwords are generally stronger.</div></div><b id="lengthValue">20</b></div><input class="range" id="length" type="range" min="8" max="64" value="20"></div>
<div class="checks"><label class="check"><input type="checkbox" id="upper" checked> Uppercase</label><label class="check"><input type="checkbox" id="lower" checked> Lowercase</label><label class="check"><input type="checkbox" id="numbers" checked> Numbers</label><label class="check"><input type="checkbox" id="symbols" checked> Symbols</label><label class="check"><input type="checkbox" id="ambiguous"> Allow ambiguous</label><label class="check"><input type="checkbox" id="spaces"> Allow spaces</label></div>
</div>
<div class="form" id="phraseForm" hidden>
<div><div class="row"><div><div class="label">Words</div><div class="small">More words increase entropy.</div></div><b id="wordCountValue">5</b></div><input class="range" id="wordCount" type="range" min="3" max="8" value="5"></div>
<div class="checks"><label class="check"><input type="checkbox" id="capitalize" checked> Capitalize words</label><label class="check"><input type="checkbox" id="appendNumber" checked> Append number</label></div>
<div class="row"><div class="label">Separator</div><select id="separator" style="background:#0d1524;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px"><option>-</option><option>_</option><option>.</option><option value=" ">space</option></select></div>
</div>
<div class="strength"><div class="meter"><span id="meter"></span></div><div class="meta"><span id="strengthText">Strong</span><span id="entropy"></span></div></div>
<div class="actions"><button class="btn primary" id="generate">Generate New</button><button class="btn" id="copy2">Copy</button></div><p class="note">Generated locally. Nothing is sent to a server.</p>
</section></main>
<script>
const WORDS=["orbit","cactus","window","coffee","river","planet","velvet","forest","signal","piano","amber","rocket","mirror","meadow","silver","lantern","breeze","marble","violet","harbor","comet","pepper","tiger","maple","cloud","copper","island","pixel","garden","sunset","falcon","echo","bridge","coral","mango","thunder","paper","stone","ocean","winter","summer","autumn","spring","candle","museum","camera","dragon","puzzle","circle","banana"];
const $=id=>document.getElementById(id);let mode="password";
function rnd(max){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%max}
function pick(s){return s[rnd(s.length)]}
function shuffle(s){let a=s.split("");for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.join("")}
function password(){
 let sets=[],u="ABCDEFGHJKLMNPQRSTUVWXYZ",l="abcdefghijkmnopqrstuvwxyz",n="23456789",sym="!@#$%^&*()-_=+[]{};:,.?";
 if($("ambiguous").checked){u+="IO";l+="l";n+="01"} if($("spaces").checked)sym+=" ";
 if($("upper").checked)sets.push(u);if($("lower").checked)sets.push(l);if($("numbers").checked)sets.push(n);if($("symbols").checked)sets.push(sym);
 if(!sets.length){$("lower").checked=true;sets=[l]}
 let len=+$("length").value,s=sets.map(pick).join(""),all=sets.join("");
 while(s.length<len)s+=pick(all);return {value:shuffle(s),pool:all.length};
}
function phrase(){
 let c=+$("wordCount").value,a=[];for(let i=0;i<c;i++){let w=WORDS[rnd(WORDS.length)];if($("capitalize").checked)w=w[0].toUpperCase()+w.slice(1);a.push(w)}
 let v=a.join($("separator").value);if($("appendNumber").checked)v+=String(rnd(90)+10);return {value:v,pool:WORDS.length};
}
function generate(){
 const r=mode==="password"?password():phrase();$("value").textContent=r.value;
 let bits=mode==="password"?Math.round(+$("length").value*Math.log2(r.pool)):Math.round(+$("wordCount").value*Math.log2(WORDS.length)+($("appendNumber").checked?6.5:0));
 $("entropy").textContent=`~${bits} bits`;let p=Math.min(100,bits/1.3);$("meter").style.width=p+"%";$("strengthText").textContent=bits<50?"Weak":bits<70?"Fair":bits<100?"Strong":"Very Strong";
}
function copy(){navigator.clipboard?.writeText($("value").textContent)}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));$("passwordForm").hidden=mode!=="password";$("phraseForm").hidden=mode!=="passphrase";generate()});
["length","upper","lower","numbers","symbols","ambiguous","spaces","wordCount","capitalize","appendNumber","separator"].forEach(id=>$(id).addEventListener("input",()=>{$("lengthValue").textContent=$("length").value;$("wordCountValue").textContent=$("wordCount").value;generate()}));
$("generate").onclick=generate;$("copy").onclick=copy;$("copy2").onclick=copy;generate();
</script></body></html>
