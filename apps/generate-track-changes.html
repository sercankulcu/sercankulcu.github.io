title: "Word Track Changes PDF"
permalink: /apps/generate-track-changes/
excerpt: "Compare two Word documents and create a PDF that highlights additions and deletions."
---

<style>
.track-page,
.track-page *,
.track-page *::before,
.track-page *::after {
  box-sizing: border-box;
}

.track-page {
  width: min(1080px, calc(100% - 24px));
  margin: .25rem auto 1.5rem;
}

.track-frame {
  display: block;

  width: 100%;
  min-height: 760px;

  border: 0;

  background: transparent;
}

@media (max-width: 760px) {
  .track-page {
    width: 100%;
    margin: 0 auto 1rem;
  }

  .track-frame {
    min-height: 920px;
  }
}
</style>

<div class="track-page">
  <iframe
    class="track-frame"
    id="track-frame"
    src="/apps/generate-track-changes.html?embedded=1"
    title="Word Track Changes PDF"
    loading="eager"
  ></iframe>
</div>

<script>
(() => {
  "use strict";

  const frame =
    document.getElementById(
      "track-frame"
    );

  if (!frame) {
    return;
  }

  function siteTheme() {
    const root =
      document.documentElement;

    if (
      root.dataset.theme ===
      "dark"
    ) {
      return "dark";
    }

    if (
      root.dataset.theme ===
      "light"
    ) {
      return "light";
    }

    return window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches
      ? "dark"
      : "light";
  }

  function syncEmbeddedPage() {
    const embeddedDocument =
      frame.contentDocument;

    if (
      !embeddedDocument ||
      !embeddedDocument.documentElement
    ) {
      return;
    }

    const embeddedRoot =
      embeddedDocument.documentElement;

    embeddedRoot.dataset.theme =
      siteTheme();

    const themeButton =
      embeddedDocument.getElementById(
        "themeBtn"
      );

    if (themeButton) {
      themeButton.style.display =
        "none";
    }

    const appControls =
      embeddedDocument.querySelector(
        ".app-controls"
      );

    if (appControls) {
      appControls.style.marginBottom =
        "12px";
    }

    const embeddedBody =
      embeddedDocument.body;

    if (embeddedBody) {
      embeddedBody.style.minHeight =
        "0";

      embeddedBody.style.background =
        "transparent";

      embeddedBody.style.overflow =
        "hidden";
    }

    const app =
      embeddedDocument.querySelector(
        ".app"
      );

    if (app) {
      app.style.width =
        "100%";

      app.style.paddingTop =
        "8px";

      app.style.paddingBottom =
        "18px";
    }

    const style =
      embeddedDocument.createElement(
        "style"
      );

    style.textContent = `
      body {
        background: transparent !important;
      }

      .app {
        width: 100% !important;
        max-width: 1040px !important;
        padding-top: 8px !important;
        padding-bottom: 18px !important;
      }

      .theme-btn {
        display: none !important;
      }

      .panel,
      .file-zone,
      .icon-btn,
      .btn-secondary,
      .control-select {
        box-shadow: none !important;
      }

      @media (max-width: 760px) {
        .app {
          width: 100% !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
        }
      }
    `;

    embeddedDocument.head
      .appendChild(style);

    resizeFrame();
  }

  function resizeFrame() {
    const embeddedDocument =
      frame.contentDocument;

    if (
      !embeddedDocument ||
      !embeddedDocument.body
    ) {
      return;
    }

    const height =
      Math.max(
        embeddedDocument.body
          .scrollHeight,
        embeddedDocument
          .documentElement
          .scrollHeight,
        700
      );

    frame.style.height =
      `${height + 8}px`;
  }

  frame.addEventListener(
    "load",
    () => {
      syncEmbeddedPage();

      const embeddedDocument =
        frame.contentDocument;

      if (
        embeddedDocument &&
        window.ResizeObserver
      ) {
        const observer =
          new ResizeObserver(
            resizeFrame
          );

        observer.observe(
          embeddedDocument
            .documentElement
        );

        if (
          embeddedDocument.body
        ) {
          observer.observe(
            embeddedDocument.body
          );
        }
      }

      window.setTimeout(
        resizeFrame,
        250
      );

      window.setTimeout(
        resizeFrame,
        1000
      );
    }
  );

  const themeObserver =
    new MutationObserver(
      () => {
        const embeddedDocument =
          frame.contentDocument;

        if (
          embeddedDocument &&
          embeddedDocument
            .documentElement
        ) {
          embeddedDocument
            .documentElement
            .dataset.theme =
              siteTheme();
        }
      }
    );

  themeObserver.observe(
    document.documentElement,
    {
      attributes: true,
      attributeFilter: [
        "data-theme",
        "class"
      ]
    }
  );

  window.addEventListener(
    "resize",
    resizeFrame
  );
})();
</script>
