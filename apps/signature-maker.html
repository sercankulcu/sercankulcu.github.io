<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Signature Maker</title><style>
:root{--panel:#121a2b;--panel2:#182238;--line:#293752;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#83d7ae;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.24),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.16),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.app{width:min(980px,100%)}.panel{border:1px solid var(--line);border-radius:26px;background:rgba(18,26,43,.97);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(16px,3vw,30px)}
.brand{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.hero{text-align:center;margin:12px auto 0}.hero h1{margin:0;font-size:clamp(1.9rem,5vw,3.2rem);letter-spacing:-.04em}.hero p{max-width:700px;margin:9px auto 0;color:var(--muted);line-height:1.55;font-size:.9rem}
.drop{border:1px dashed #4b5e82;border-radius:17px;padding:20px;text-align:center;background:#0f1727;cursor:pointer}.drop.drag{border-color:var(--accent);background:#14223b}
.card{border:1px solid var(--line);border-radius:16px;background:#101827;padding:14px}.field{display:grid;gap:5px}.field label{font-size:.7rem;color:var(--muted);font-weight:800}
input,select,textarea{width:100%;min-height:41px;border:1px solid var(--line);border-radius:11px;background:#0d1525;color:var(--text);padding:0 10px;font:inherit}textarea{padding:10px}
.btn{min-height:41px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:0 13px;font:inherit;font-size:.79rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.btn:disabled{opacity:.38;cursor:not-allowed}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta{font-size:.73rem;color:var(--muted);line-height:1.5}.note{text-align:center;color:#758095;font-size:.68rem;margin:15px 0 0}.canvasWrap{display:grid;place-items:center;overflow:auto}.canvasWrap canvas{max-width:100%;height:auto;background:white;border-radius:8px;touch-action:none}
@media(max-width:680px){body{padding:6px}.panel{padding:14px 10px;border-radius:20px}.row{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="panel"><div class="brand">Signature Tool</div><div class="hero"><h1>Signature Maker</h1><p>Draw a signature or photograph one on white paper, then export it as a transparent PNG.</p></div>
<div class="row" style="margin-top:14px"><div class="card"><div class="field"><label>Draw signature</label><canvas id="draw" width="700" height="250" style="width:100%;background:white;border-radius:10px;touch-action:none"></canvas></div><div class="row" style="margin-top:8px">
<div class="field"><label>Ink color</label><select id="ink"><option value="#111111">Black</option><option value="#164ea3">Blue</option></select></div>
<div class="actions" style="align-items:end"><button class="btn" id="clear">Clear</button></div>
</div></div><div class="card"><div class="drop" id="drop">Or choose signature photo<input id="file" type="file" accept="image/*" capture="environment" hidden></div><div class="field" style="margin-top:10px"><label>White removal threshold</label><input id="threshold" type="range" min="120" max="245" value="210"></div>
<div class="field" style="margin-top:10px"><label>Photo signature color</label><select id="photoInk"><option value="black">Black</option><option value="blue">Blue</option></select></div><div class="actions" style="margin-top:10px"><button class="btn" id="usePhoto">Process Photo</button><button class="btn primary" id="download">Download Transparent PNG</button></div></div></div><p class="note">For photographed signatures, use dark ink on clean white paper and even lighting.</p></section></main><script>
const $=id=>document.getElementById(id),c=$("draw"),x=c.getContext("2d");let down=false,img=null;x.strokeStyle="#111111";x.lineWidth=5;x.lineCap="round";
function p(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}}function start(e){e.preventDefault();down=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y)}function move(e){if(!down)return;e.preventDefault();let q=p(e);x.lineTo(q.x,q.y);x.stroke()}["mousedown","touchstart"].forEach(v=>c.addEventListener(v,start,{passive:false}));["mousemove","touchmove"].forEach(v=>c.addEventListener(v,move,{passive:false}));["mouseup","mouseleave","touchend"].forEach(v=>c.addEventListener(v,()=>down=false));
$("ink").onchange=()=>x.strokeStyle=$("ink").value;
$("clear").onclick=()=>x.clearRect(0,0,c.width,c.height);$("drop").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);img=new Image();img.onload=()=>URL.revokeObjectURL(u);img.src=u};
$("usePhoto").onclick=()=>{if(!img)return;let max=900,s=Math.min(1,max/img.width),w=img.width*s,h=img.height*s;c.width=w;c.height=h;x.drawImage(img,0,0,w,h);let d=x.getImageData(0,0,w,h),t=+$("threshold").value,isBlue=$("photoInk").value==="blue";for(let i=0;i<d.data.length;i+=4){let lum=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];if(lum>t)d.data[i+3]=0;else{if(isBlue){d.data[i]=22;d.data[i+1]=78;d.data[i+2]=163}else{d.data[i]=20;d.data[i+1]=20;d.data[i+2]=20}d.data[i+3]=Math.min(255,(t-lum)*4)}}x.putImageData(d,0,0);x.strokeStyle=$("ink").value};
$("download").onclick=()=>{let a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="signature.png";a.click()};
</script></body></html>
