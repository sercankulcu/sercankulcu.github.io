<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Bilişsel Akıl Yürütme Testi</title><meta name="description" content="30 soruluk bilişsel akıl yürütme testi."><link rel="canonical" href="https://sercankulcu.github.io/apps/iqtest.html"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#182238;--line:#263652;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#8fd7ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 20% 0%,rgba(68,94,175,.25),transparent 35rem),radial-gradient(circle at 90% 90%,rgba(129,72,168,.18),transparent 30rem),linear-gradient(155deg,#090e19,#101729 55%,#0a101c);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(840px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(18,26,43,.96);box-shadow:0 30px 80px rgba(0,0,0,.4);padding:clamp(19px,4vw,34px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.langs{display:flex;gap:5px}.lang{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 10px;font:inherit;font-size:.74rem;font-weight:800;cursor:pointer}.lang[aria-pressed=true]{background:var(--accent);color:#09101c;border-color:transparent}.hero{text-align:center;margin:18px auto 0;max-width:650px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.03;letter-spacing:-.04em;margin:0}.sub{margin:9px 0 0;color:var(--accent);font-size:.78rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.intro{margin:13px auto 0;color:var(--muted);line-height:1.6;font-size:.94rem}.btn{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);padding:0 17px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.start{text-align:center;margin-top:23px}.test,.results{display:none}.active{display:block}.testhead{margin-top:20px;display:grid;grid-template-columns:1fr auto;gap:10px;color:var(--muted);font-size:.82rem}.bar{height:8px;margin-top:9px;background:#0b1220;border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}.category{margin-top:21px;color:var(--accent);font-size:.69rem;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.question{margin:8px 0 0;font-size:clamp(1.3rem,4vw,2rem);line-height:1.3}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:21px}.option{min-height:64px;text-align:left;padding:12px 15px;border:1px solid var(--line);border-radius:15px;background:#111a2c;color:var(--text);font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.option:hover{border-color:#46648f;background:#16233a}.option.selected{border-color:var(--accent);background:rgba(126,167,255,.13)}.scoreRing{width:150px;aspect-ratio:1;margin:20px auto 0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct,0%),#1a2438 0);position:relative}.scoreRing:before{content:"";position:absolute;inset:10px;background:var(--panel);border-radius:50%}.scoreInner{position:relative;text-align:center}.scoreVal{font-size:2.25rem;font-weight:900}.scoreLabel{color:var(--muted);font-size:.7rem;max-width:110px}.resultTitle{text-align:center;margin:17px 0 0}.resultText{text-align:center;color:var(--muted)}.breakdown{max-width:600px;margin:20px auto 0}.breakrow{display:grid;grid-template-columns:125px 1fr 45px;gap:9px;align-items:center;margin:9px 0;font-size:.82rem}.mini{height:7px;background:#0b1220;border:1px solid var(--line);border-radius:99px;overflow:hidden}.mini span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}.report{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:480px;margin:15px auto 0}.report input{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#0d1525;color:var(--text);padding:0 12px;font:inherit}.review{display:none;margin-top:22px}.review.active{display:block}.reviewItem{padding:13px 0;border-top:1px solid var(--line)}.reviewItem h3{font-size:.94rem;margin:0}.reviewItem p{margin:6px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5}.ok{color:var(--good)!important}.bad{color:#ffaaa8!important}.disclaimer{margin:18px 0 0;text-align:center;color:#77849b;font-size:.71rem;line-height:1.5}@media(max-width:600px){body{padding:8px}.panel{padding:16px 12px;border-radius:22px}.options{grid-template-columns:1fr}.breakrow{grid-template-columns:95px 1fr 38px}.report{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important}}

<script>
const QUESTIONS=[{"cat":"Numerical","q":"2, 5, 10, 17, 26, ?","opts":["35","37","39","41"],"a":"37","exp":"The differences are +3, +5, +7, +9, then +11.","tr_q":"2, 5, 10, 17, 26, ?","tr_opts":["35","37","39","41"],"tr_a":"37","tr_exp":"Farklar +3, +5, +7, +9 ve ardından +11'dir."},{"cat":"Numerical","q":"81, 27, 9, 3, ?","opts":["1","0","6","9"],"a":"1","exp":"Each term is divided by 3.","tr_q":"81, 27, 9, 3, ?","tr_opts":["1","0","6","9"],"tr_a":"1","tr_exp":"Her terim 3'e bölünür."},{"cat":"Numerical","q":"4, 9, 16, 25, ?","opts":["30","32","36","49"],"a":"36","exp":"Consecutive squares: 2², 3², 4², 5², 6².","tr_q":"4, 9, 16, 25, ?","tr_opts":["30","32","36","49"],"tr_a":"36","tr_exp":"Ardışık kare sayılar: 2², 3², 4², 5², 6²."},{"cat":"Numerical","q":"7, 14, 28, 56, ?","opts":["84","98","112","126"],"a":"112","exp":"Each term doubles.","tr_q":"7, 14, 28, 56, ?","tr_opts":["84","98","112","126"],"tr_a":"112","tr_exp":"Her terim iki katına çıkar."},{"cat":"Numerical","q":"1, 4, 10, 19, 31, ?","opts":["40","44","46","49"],"a":"46","exp":"Differences are +3, +6, +9, +12, then +15.","tr_q":"1, 4, 10, 19, 31, ?","tr_opts":["40","44","46","49"],"tr_a":"46","tr_exp":"Farklar +3, +6, +9, +12 ve ardından +15'tir."},{"cat":"Numerical","q":"5 machines make 5 parts in 5 minutes. How long do 100 machines need to make 100 parts?","opts":["5","20","100","500"],"a":"5","exp":"Each machine makes one part in 5 minutes.","tr_q":"5 makine 5 parçayı 5 dakikada üretiyor. 100 makine 100 parçayı kaç dakikada üretir?","tr_opts":["5","20","100","500"],"tr_a":"5","tr_exp":"Her makine 5 dakikada bir parça üretir."},{"cat":"Logical","q":"All Zorps are Mivs. Some Mivs are Tals. Which statement must be true?","opts":["All Zorps are Tals","Some Zorps are Tals","All Zorps are Mivs","No Tals are Zorps"],"a":"All Zorps are Mivs","exp":"Only this statement is guaranteed by the premises.","tr_q":"Tüm Zorp'lar Miv'dir. Bazı Miv'ler Tal'dır. Hangisi kesinlikle doğrudur?","tr_opts":["Tüm Zorp'lar Tal'dır","Bazı Zorp'lar Tal'dır","Tüm Zorp'lar Miv'dir","Hiçbir Tal Zorp değildir"],"tr_a":"Tüm Zorp'lar Miv'dir","tr_exp":"Öncüllerin garanti ettiği tek ifade budur."},{"cat":"Logical","q":"A is taller than B. B is taller than C. Which must be true?","opts":["C is taller than A","A is taller than C","B is taller than A","A and C are equal"],"a":"A is taller than C","exp":"The ordering is transitive: A > B > C.","tr_q":"A, B'den uzundur. B, C'den uzundur. Hangisi kesinlikle doğrudur?","tr_opts":["C, A'dan uzundur","A, C'den uzundur","B, A'dan uzundur","A ve C eşittir"],"tr_a":"A, C'den uzundur","tr_exp":"Sıralama geçişlidir: A > B > C."},{"cat":"Logical","q":"If today is two days after Monday, what day is tomorrow?","opts":["Tuesday","Wednesday","Thursday","Friday"],"a":"Thursday","exp":"Two days after Monday is Wednesday; tomorrow is Thursday.","tr_q":"Bugün pazartesiden iki gün sonrasıysa yarın hangi gündür?","tr_opts":["Salı","Çarşamba","Perşembe","Cuma"],"tr_a":"Perşembe","tr_exp":"Pazartesiden iki gün sonrası çarşambadır; yarın perşembedir."},{"cat":"Logical","q":"Which one does not belong?","opts":["Triangle","Square","Circle","Rectangle"],"a":"Circle","exp":"The others are polygons with straight sides.","tr_q":"Hangisi diğerlerinden farklıdır?","tr_opts":["Üçgen","Kare","Daire","Dikdörtgen"],"tr_a":"Daire","tr_exp":"Diğerleri düz kenarlı çokgenlerdir."},{"cat":"Logical","q":"Book is to reading as fork is to ...","opts":["drawing","writing","eating","cutting"],"a":"eating","exp":"A book is used for reading; a fork for eating.","tr_q":"Kitap okumak içinse çatal ... için kullanılır.","tr_opts":["çizmek","yazmak","yemek","kesmek"],"tr_a":"yemek","tr_exp":"Kitap okumak, çatal yemek için kullanılır."},{"cat":"Logical","q":"Every blue object is large. This object is blue. What follows?","opts":["It is small","It is large","It is red","Nothing follows"],"a":"It is large","exp":"The rule applies directly.","tr_q":"Her mavi nesne büyüktür. Bu nesne mavidir. Hangisi doğrudur?","tr_opts":["Küçüktür","Büyüktür","Kırmızıdır","Sonuç çıkmaz"],"tr_a":"Büyüktür","tr_exp":"Kural doğrudan bu nesneye uygulanır."},{"cat":"Verbal","q":"Which word is closest in meaning to “brief”?","opts":["short","heavy","ancient","hidden"],"a":"short","exp":"Brief means short in duration or length.","tr_q":"“Brief” sözcüğüne en yakın anlam hangisidir?","tr_opts":["kısa","ağır","eski","gizli"],"tr_a":"kısa","tr_exp":"Brief, kısa veya kısa süreli anlamına gelir."},{"cat":"Verbal","q":"Which word is the opposite of “scarce”?","opts":["rare","plentiful","small","empty"],"a":"plentiful","exp":"Plentiful is the opposite of scarce.","tr_q":"“Kıt” sözcüğünün zıt anlamlısı hangisidir?","tr_opts":["nadir","bol","küçük","boş"],"tr_a":"bol","tr_exp":"Bol, kıt sözcüğünün karşıtıdır."},{"cat":"Verbal","q":"Bird is to nest as bee is to ...","opts":["web","hive","burrow","den"],"a":"hive","exp":"A nest is a bird's home; a hive is a bee colony's home.","tr_q":"Kuş : yuva ilişkisine en yakın olan hangisidir?","tr_opts":["arı : kovan","örümcek : ağ","köstebek : tünel","aslan : in"],"tr_a":"arı : kovan","tr_exp":"Yuva kuşun, kovan arı kolonisinin yaşam alanıdır."},{"cat":"Verbal","q":"Which word does not fit?","opts":["whisper","speak","shout","listen"],"a":"listen","exp":"The first three produce speech; listening receives sound.","tr_q":"Hangisi diğerlerinden farklıdır?","tr_opts":["fısıldamak","konuşmak","bağırmak","dinlemek"],"tr_a":"dinlemek","tr_exp":"İlk üçü ses üretme, dinlemek ise sesi alma eylemidir."},{"cat":"Verbal","q":"Seed is to tree as egg is to ...","opts":["nest","bird","shell","feather"],"a":"bird","exp":"A seed can develop into a tree; an egg into a bird.","tr_q":"Tohum : ağaç ilişkisine en yakın olan hangisidir?","tr_opts":["yuva","kuş","kabuk","tüy"],"tr_a":"kuş","tr_exp":"Tohum ağaca, yumurta kuşa dönüşebilir."},{"cat":"Verbal","q":"Which pair best matches “doctor : hospital”?","opts":["teacher : school","pilot : suitcase","chef : bicycle","painter : keyboard"],"a":"teacher : school","exp":"Both link a profession with a typical workplace.","tr_q":"“doktor : hastane” ilişkisine en yakın çift hangisidir?","tr_opts":["öğretmen : okul","pilot : bavul","aşçı : bisiklet","ressam : klavye"],"tr_a":"öğretmen : okul","tr_exp":"İki çift de mesleği tipik çalışma yeriyle eşleştirir."},{"cat":"Quantitative","q":"A shirt costs 80 TL after a 20% discount. What was the original price?","opts":["96 TL","100 TL","104 TL","120 TL"],"a":"100 TL","exp":"80 TL is 80% of the original: 80 / 0.8 = 100.","tr_q":"Bir gömlek %20 indirimden sonra 80 TL ise indirimsiz fiyatı kaç TL'dir?","tr_opts":["96 TL","100 TL","104 TL","120 TL"],"tr_a":"100 TL","tr_exp":"80 TL ilk fiyatın %80'idir: 80 / 0,8 = 100."},{"cat":"Quantitative","q":"3 cats catch 3 mice in 3 minutes. At the same rate, how long do 9 cats need to catch 9 mice?","opts":["1 minute","3 minutes","9 minutes","27 minutes"],"a":"3 minutes","exp":"Each cat catches one mouse in 3 minutes.","tr_q":"3 kedi 3 fareyi 3 dakikada yakalıyorsa, aynı hızla 9 kedi 9 fareyi kaç dakikada yakalar?","tr_opts":["1 dakika","3 dakika","9 dakika","27 dakika"],"tr_a":"3 dakika","tr_exp":"Her kedi 3 dakikada bir fare yakalar."},{"cat":"Quantitative","q":"A car travels 150 km in 3 hours. How far in 5 hours at the same speed?","opts":["200 km","225 km","250 km","300 km"],"a":"250 km","exp":"Speed is 50 km/h; 5 hours gives 250 km.","tr_q":"Bir araç 3 saatte 150 km gidiyor. Aynı hızla 5 saatte kaç km gider?","tr_opts":["200 km","225 km","250 km","300 km"],"tr_a":"250 km","tr_exp":"Hız 50 km/saattir; 5 saatte 250 km gider."},{"cat":"Quantitative","q":"A box contains 24 balls. One quarter are red. How many are not red?","opts":["6","12","18","20"],"a":"18","exp":"One quarter is 6, so 18 are not red.","tr_q":"Bir kutuda 24 top var. Dörtte biri kırmızıysa kaç top kırmızı değildir?","tr_opts":["6","12","18","20"],"tr_a":"18","tr_exp":"24'ün dörtte biri 6'dır; geriye 18 kalır."},{"cat":"Quantitative","q":"4 workers finish a job in 12 days. At the same rate, how many days for 8 workers?","opts":["3","6","8","24"],"a":"6","exp":"Doubling the workforce halves the time.","tr_q":"4 işçi bir işi 12 günde bitiriyor. Aynı hızla 8 işçi kaç günde bitirir?","tr_opts":["3","6","8","24"],"tr_a":"6","tr_exp":"İşçi sayısı iki katına çıkınca süre yarıya iner."},{"cat":"Quantitative","q":"A number increased by 25% becomes 50. What was the original number?","opts":["37.5","40","42","45"],"a":"40","exp":"50 / 1.25 = 40.","tr_q":"Bir sayı %25 artırılınca 50 oluyor. İlk sayı kaçtır?","tr_opts":["37,5","40","42","45"],"tr_a":"40","tr_exp":"50 / 1,25 = 40."},{"cat":"Pattern","q":"3, 6, 18, 72, ?","opts":["144","216","288","360"],"a":"360","exp":"Multiply by 2, then 3, then 4, then 5.","tr_q":"3, 6, 18, 72, ?","tr_opts":["144","216","288","360"],"tr_a":"360","tr_exp":"Sırasıyla 2, 3, 4 ve 5 ile çarpılır."},{"cat":"Pattern","q":"AZ, BY, CX, DW, ?","opts":["EV","EU","FV","EW"],"a":"EV","exp":"First letter moves forward; second moves backward.","tr_q":"AZ, BY, CX, DW, ?","tr_opts":["EV","EU","FV","EW"],"tr_a":"EV","tr_exp":"İlk harf ileri, ikinci harf geri gider."},{"cat":"Pattern","q":"1, 2, 6, 24, ?","opts":["48","96","120","144"],"a":"120","exp":"Factorials: 1!, 2!, 3!, 4!, 5!.","tr_q":"1, 2, 6, 24, ?","tr_opts":["48","96","120","144"],"tr_a":"120","tr_exp":"Faktöriyeller: 1!, 2!, 3!, 4!, 5!."},{"cat":"Pattern","q":"Which completes the pattern? ○ △ ○ △ ○ ?","opts":["○","△","□","◇"],"a":"△","exp":"Circle and triangle alternate.","tr_q":"Örüntüyü hangisi tamamlar? ○ △ ○ △ ○ ?","tr_opts":["○","△","□","◇"],"tr_a":"△","tr_exp":"Daire ve üçgen sırayla tekrar eder."},{"cat":"Pattern","q":"2, 3, 5, 8, 12, 17, ?","opts":["21","22","23","24"],"a":"23","exp":"Differences are +1, +2, +3, +4, +5, then +6.","tr_q":"2, 3, 5, 8, 12, 17, ?","tr_opts":["21","22","23","24"],"tr_a":"23","tr_exp":"Farklar +1, +2, +3, +4, +5 ve ardından +6'dır."},{"cat":"Pattern","q":"11, 22, 21, 42, 41, ?","opts":["61","72","82","84"],"a":"82","exp":"Alternate ×2 and −1.","tr_q":"11, 22, 21, 42, 41, ?","tr_opts":["61","72","82","84"],"tr_a":"82","tr_exp":"Sırayla ×2 ve −1 uygulanır."}],UI={"tr":{"title":"Bilişsel Akıl Yürütme Testi","sub":"30 soru · 5 akıl yürütme alanı","intro":"Sayısal, mantıksal, sözel, nicel ve örüntüsel akıl yürütmeyi kapsayan kısa ve klinik olmayan bir testtir. Sonuç standardize edilmiş IQ ölçümü değil, tahmini bir akıl yürütme puanıdır.","start":"Teste Başla","q":"Soru","time":"Süre","result":"Sonucunuz","score":"Tahmini Akıl Yürütme Puanı","accuracy":"Doğruluk","correct":"doğru","again":"Tekrar Dene","review":"Cevapları İncele","hide":"İncelemeyi Gizle","pdf":"PDF Raporunu İndir","name":"Adınız","cats":"Kategori Dağılımı","disc":"Bu test yalnızca eğlence ve kişisel değerlendirme amaçlıdır. Klinik veya standardize edilmiş bir IQ testi değildir.","levels":["Gelişmekte olan performans","Ortalama performans","Güçlü performans","Çok güçlü performans","Olağanüstü performans"]},"en":{"title":"Cognitive Reasoning Test","sub":"30 questions · 5 reasoning areas","intro":"A short, non-clinical challenge covering numerical, logical, verbal, quantitative and pattern reasoning. The result is an estimated reasoning score, not a standardized IQ measurement.","start":"Start Test","q":"Question","time":"Time","result":"Your Result","score":"Estimated Reasoning Score","accuracy":"Accuracy","correct":"correct","again":"Try Again","review":"Review Answers","hide":"Hide Review","pdf":"Download PDF Report","name":"Your name","cats":"Category Breakdown","disc":"This test is for entertainment and self-reflection only. It is not a clinical or standardized IQ assessment.","levels":["Developing performance","Average performance","Strong performance","Very strong performance","Exceptional performance"]}},CATS=["Numerical","Logical","Verbal","Quantitative","Pattern"],TRCATS={"Numerical":"Sayısal","Logical":"Mantıksal","Verbal":"Sözel","Quantitative":"Nicel","Pattern":"Örüntü"};
let lang=localStorage.getItem("iqtest-language")||((navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en"),items=[],idx=0,answers=[],started=0,timerId;
const $=x=>document.getElementById(x);
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function qtxt(q){return lang==="tr"?q.tr_q:q.q}function qopts(q){return lang==="tr"?q.tr_opts:q.opts}function qans(q){return lang==="tr"?q.tr_a:q.a}function qexp(q){return lang==="tr"?q.tr_exp:q.exp}function cname(c){return lang==="tr"?TRCATS[c]:c}
function applyLang(){let t=UI[lang];document.documentElement.lang=lang;document.title=t.title;$("title").textContent=t.title;$("sub").textContent=t.sub;$("intro").textContent=t.intro;$("startBtn").textContent=t.start;$("disc").textContent=t.disc;document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));if($("test").classList.contains("active"))renderQ();if($("results").classList.contains("active"))renderResults()}
function start(){items=shuffle(QUESTIONS).map(q=>({...q,order:shuffle([0,1,2,3])}));idx=0;answers=[];started=Date.now();$("landing").style.display="none";$("results").classList.remove("active");$("test").classList.add("active");clearInterval(timerId);timerId=setInterval(timer,1000);timer();renderQ()}
function timer(){let s=Math.floor((Date.now()-started)/1000),m=Math.floor(s/60);$("timer").textContent=UI[lang].time+": "+m+":"+String(s%60).padStart(2,"0")}
function renderQ(){let q=items[idx],t=UI[lang],opts=qopts(q);$("qmeta").textContent=t.q+" "+(idx+1)+" / "+items.length;$("cat").textContent=cname(q.cat);$("question").textContent=qtxt(q);$("options").innerHTML=q.order.map(i=>`<button class="option" data-i="${i}">${opts[i]}</button>`).join("");document.querySelectorAll(".option").forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));let p=idx/items.length*100;$("bar").style.width=p+"%";document.querySelector(".bar").setAttribute("aria-valuenow",idx)}
function pick(i,b){document.querySelectorAll(".option").forEach(x=>x.disabled=true);b.classList.add("selected");let q=items[idx],correct=i===q.opts.indexOf(q.a);answers.push({q,i,correct});setTimeout(()=>{idx++;idx<items.length?renderQ():finish()},220)}
function finish(){clearInterval(timerId);$("test").classList.remove("active");$("results").classList.add("active");renderResults()}
function stat(){let correct=answers.filter(a=>a.correct).length,pct=Math.round(correct/answers.length*100),score=Math.round(70+Math.pow(correct/answers.length,.92)*75),cats={};CATS.forEach(c=>cats[c]={c:0,n:0});answers.forEach(a=>{cats[a.q.cat].n++;if(a.correct)cats[a.q.cat].c++});return{correct,pct,score,cats}}
function level(p){let i=p>=90?4:p>=80?3:p>=67?2:p>=45?1:0;return UI[lang].levels[i]}
function renderResults(){let t=UI[lang],s=stat();$("resultHead").textContent=t.result;$("score").textContent=s.score;$("scoreLabel").textContent=t.score;$("ring").style.setProperty("--pct",s.pct+"%");$("level").textContent=level(s.pct);$("resultText").textContent=s.correct+" / "+answers.length+" "+t.correct+" · "+s.pct+"% "+t.accuracy;$("catsHead").textContent=t.cats;$("breakdown").innerHTML=CATS.map(c=>{let x=s.cats[c],p=Math.round(x.c/x.n*100);return `<div class="breakrow"><span>${cname(c)}</span><div class="mini"><span style="width:${p}%"></span></div><b>${x.c}/${x.n}</b></div>`}).join("");$("againBtn").textContent=t.again;$("reviewBtn").textContent=$("review").classList.contains("active")?t.hide:t.review;$("pdfBtn").textContent=t.pdf;const ni=document.getElementById("nameInput");if(ni)ni.placeholder=t.name;renderReview()}
function renderReview(){$("review").innerHTML=answers.map((a,i)=>{let opts=qopts(a.q),chosen=opts[a.i];return `<div class="reviewItem"><h3>${i+1}. ${qtxt(a.q)}</h3><p class="${a.correct?"ok":"bad"}">${a.correct?"✓":"✕"} ${chosen}</p>${a.correct?"":`<p>✓ ${qans(a.q)}</p>`}<p>${qexp(a.q)}</p></div>`}).join("")}
function toggleReview(){$("review").classList.toggle("active");$("reviewBtn").textContent=$("review").classList.contains("active")?UI[lang].hide:UI[lang].review}
function pdf(){
  if(!window.jspdf){
    alert("PDF library could not be loaded.");
    return;
  }

  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  const s=stat();

  // PDF is always generated in English to avoid font/encoding issues.
  const pdfText={
    title:"Cognitive Reasoning Test",
    score:"Estimated Reasoning Score",
    accuracy:"Accuracy",
    categories:"Category Breakdown",
    disclaimer:"This test is for entertainment and self-reflection only. It is not a clinical or standardized IQ assessment."
  };

  // Convert unsupported Turkish characters in the entered name for the built-in Helvetica font.
  const nameInput=document.getElementById("nameInput");
  const rawName=nameInput && typeof nameInput.value==="string"
    ? nameInput.value.trim()
    : "";

  const name=(rawName||"-")
    .replace(/Ç/g,"C").replace(/ç/g,"c")
    .replace(/Ğ/g,"G").replace(/ğ/g,"g")
    .replace(/İ/g,"I").replace(/ı/g,"i")
    .replace(/Ö/g,"O").replace(/ö/g,"o")
    .replace(/Ş/g,"S").replace(/ş/g,"s")
    .replace(/Ü/g,"U").replace(/ü/g,"u");

  d.setFont("helvetica","bold");
  d.setFontSize(20);
  d.text(pdfText.title,20,25);

  d.setFont("helvetica","normal");
  d.setFontSize(11);
  d.text("Name: "+name,20,38);
  d.text(pdfText.score+": "+s.score,20,52);
  d.text(pdfText.accuracy+": "+s.pct+"% ("+s.correct+"/"+answers.length+" correct)",20,61);

  let y=77;
  d.setFont("helvetica","bold");
  d.text(pdfText.categories,20,y);

  d.setFont("helvetica","normal");
  y+=10;

  CATS.forEach(c=>{
    const x=s.cats[c];
    d.text(c+": "+x.c+"/"+x.n,20,y);
    y+=8;
  });

  y+=8;
  d.text(d.splitTextToSize(pdfText.disclaimer,170),20,y);
  d.save("reasoning-report.pdf");
}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("iqtest-language",lang);applyLang()});$("startBtn").onclick=start;$("againBtn").onclick=start;$("reviewBtn").onclick=toggleReview;$("pdfBtn").onclick=pdf;applyLang();
</script></body></html>
