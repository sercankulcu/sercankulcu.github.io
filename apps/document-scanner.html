<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Document Scanner</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>
:root{--panel:#121a2b;--panel2:#182238;--line:#293752;--text:#f7f9fd;--muted:#9eabc2;--accent:#7ea7ff;--accent2:#b78cff;--good:#83d7ae;--bad:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 15% 0%,rgba(72,94,185,.24),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(140,75,180,.16),transparent 30rem),linear-gradient(155deg,#090e19,#11182a 55%,#0a101c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.app{width:min(980px,100%)}.panel{border:1px solid var(--line);border-radius:26px;background:rgba(18,26,43,.97);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(16px,3vw,30px)}
.brand{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900}.hero{text-align:center;margin:12px auto 0}.hero h1{margin:0;font-size:clamp(1.9rem,5vw,3.2rem);letter-spacing:-.04em}.hero p{max-width:700px;margin:9px auto 0;color:var(--muted);line-height:1.55;font-size:.9rem}
.drop{border:1px dashed #4b5e82;border-radius:17px;padding:20px;text-align:center;background:#0f1727;cursor:pointer}.drop.drag{border-color:var(--accent);background:#14223b}
.card{border:1px solid var(--line);border-radius:16px;background:#101827;padding:14px}.field{display:grid;gap:5px}.field label{font-size:.7rem;color:var(--muted);font-weight:800}
input,select,textarea{width:100%;min-height:41px;border:1px solid var(--line);border-radius:11px;background:#0d1525;color:var(--text);padding:0 10px;font:inherit}textarea{padding:10px}
.btn{min-height:41px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:0 13px;font:inherit;font-size:.79rem;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#08101c}.btn:disabled{opacity:.38;cursor:not-allowed}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta{font-size:.73rem;color:var(--muted);line-height:1.5}.note{text-align:center;color:#758095;font-size:.68rem;margin:15px 0 0}.canvasWrap{display:grid;place-items:center;overflow:auto}.canvasWrap canvas{max-width:100%;height:auto;background:white;border-radius:8px;touch-action:none}
@media(max-width:680px){body{padding:6px}.panel{padding:14px 10px;border-radius:20px}.row{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="panel"><div class="brand">Mobile Camera Tool</div><div class="hero"><h1>Document Scanner</h1><p>Take or choose a document photo, rotate it, enhance contrast, switch to grayscale or black & white, then save as image or A4 PDF.</p></div>
<div class="drop" id="drop">Take / Choose Photo<input id="file" type="file" accept="image/*" capture="environment" hidden></div>
<div class="row" style="margin-top:12px"><div class="card canvasWrap"><canvas id="canvas" width="600" height="800"></canvas></div><div class="card"><div class="field"><label>Filter</label><select id="filter"><option>Original</option><option>Document</option><option>Grayscale</option><option>Black & White</option></select></div><div class="field" style="margin-top:9px"><label>Brightness</label><input id="bright" type="range" min="70" max="150" value="105"></div><div class="field" style="margin-top:9px"><label>Contrast</label><input id="contrast" type="range" min="70" max="180" value="125"></div><div class="actions" style="margin-top:12px"><button class="btn" id="rotate">Rotate 90°</button><button class="btn" id="jpg">Download JPG</button><button class="btn primary" id="pdf">Download A4 PDF</button></div></div></div><p class="note">For best results, photograph the page straight-on with good lighting.</p></section></main><script>
const $=id=>document.getElementById(id);let img=new Image(),rot=0,loaded=false;
$("drop").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);img.onload=()=>{loaded=true;draw();URL.revokeObjectURL(u)};img.src=u};
function draw(){if(!loaded)return;let swap=rot%180!==0,c=$("canvas"),max=1000,w=swap?img.naturalHeight:img.naturalWidth,h=swap?img.naturalWidth:img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));c.width=w*scale;c.height=h*scale;let x=c.getContext("2d");x.save();x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);let dw=(swap?c.height:c.width),dh=(swap?c.width:c.height);x.filter="brightness("+$("bright").value+"%) contrast("+$("contrast").value+"%)";if($("filter").value==="Grayscale")x.filter+=" grayscale(1)";if($("filter").value==="Black & White")x.filter+=" grayscale(1) contrast(180%)";if($("filter").value==="Document")x.filter+=" saturate(.2) contrast(145%)";x.drawImage(img,-dw/2,-dh/2,dw,dh);x.restore()}
["filter","bright","contrast"].forEach(i=>$(i).oninput=draw);$("rotate").onclick=()=>{rot=(rot+90)%360;draw()};
$("jpg").onclick=()=>{if(!loaded)return;let a=document.createElement("a");a.href=$("canvas").toDataURL("image/jpeg",.9);a.download="scanned-document.jpg";a.click()};
$("pdf").onclick=async()=>{if(!loaded)return;let {PDFDocument}=PDFLib,d=await PDFDocument.create(),p=d.addPage([595.28,841.89]),jpg=await d.embedJpg($("canvas").toDataURL("image/jpeg",.9)),m=28,maxW=595.28-2*m,maxH=841.89-2*m,r=Math.min(maxW/jpg.width,maxH/jpg.height),w=jpg.width*r,h=jpg.height*r;p.drawImage(jpg,{x:(595.28-w)/2,y:(841.89-h)/2,width:w,height:h});let b=await d.save(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));a.download="scanned-document.pdf";a.click()};
</script></body></html>
