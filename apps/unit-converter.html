<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522">
<title>Unit Converter</title><meta name="description" content="Convert length, mass, temperature, area, volume, speed, time and digital storage units.">
<style>
:root{--panel:#151b2a;--line:#2a354d;--text:#f7f9fd;--muted:#a4aec2;--accent:#8cc8ff;--accent2:#9a8cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(61,120,183,.23),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(111,78,180,.17),transparent 30rem),linear-gradient(155deg,#0b101a,#111827 55%,#0c111c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.app{width:min(820px,100%)}.panel{border:1px solid var(--line);border-radius:28px;background:rgba(21,27,42,.96);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:clamp(18px,4vw,34px)}.brand{color:var(--accent);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:900}.hero{text-align:center;margin-top:15px}.hero h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.6}
.categories{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:19px}.cat{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:8px 12px;font:inherit;font-size:.76rem;font-weight:800;cursor:pointer}.cat.active{background:var(--accent);color:#08101a;border-color:transparent}
.converter{display:grid;grid-template-columns:1fr 54px 1fr;gap:12px;align-items:end;margin-top:24px}.side{display:grid;gap:8px}.side label{color:var(--muted);font-size:.72rem;font-weight:800}.side input,.side select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:#0e1625;color:var(--text);font:inherit;padding:0 12px}.value{font-size:1.1rem;font-weight:800}.swap{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#182236;color:var(--text);font-size:1.15rem;cursor:pointer}.result{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#0f1726;text-align:center}.result .big{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;overflow-wrap:anywhere}.result .small{margin-top:5px;color:var(--muted);font-size:.76rem}.actions{display:flex;justify-content:center;gap:8px;margin-top:16px}.btn{min-height:41px;border:1px solid var(--line);border-radius:12px;background:#182236;color:var(--text);padding:0 14px;font:inherit;font-size:.8rem;font-weight:800;cursor:pointer}.note{text-align:center;color:#758095;font-size:.69rem;margin:18px 0 0}
@media(max-width:620px){body{padding:8px}.panel{padding:16px 12px;border-radius:22px}.converter{grid-template-columns:1fr}.swap{margin:auto;transform:rotate(90deg)}}
</style>
</head><body><main class="app"><section class="panel">
<div class="brand">Utility Tool</div><div class="hero"><h1>Unit Converter</h1><p>Fast browser-based conversions for everyday and technical units.</p></div>
<div class="categories" id="cats"></div>
<div class="converter">
<div class="side"><label>From</label><input id="fromValue" type="number" value="1" step="any"><select id="fromUnit"></select></div>
<button class="swap" id="swap" aria-label="Swap units">⇄</button>
<div class="side"><label>To</label><input id="toValue" class="value" readonly><select id="toUnit"></select></div>
</div>
<div class="result"><div class="big" id="result"></div><div class="small" id="formula"></div></div>
<div class="actions"><button class="btn" id="copy">Copy Result</button><button class="btn" id="reset">Reset</button></div>
<p class="note">All calculations run locally in your browser.</p>
</section></main>
<script>
const DATA={
Length:{m:["Meter",1],km:["Kilometer",1000],cm:["Centimeter",.01],mm:["Millimeter",.001],mi:["Mile",1609.344],yd:["Yard",.9144],ft:["Foot",.3048],in:["Inch",.0254]},
Mass:{kg:["Kilogram",1],g:["Gram",.001],mg:["Milligram",1e-6],lb:["Pound",.45359237],oz:["Ounce",.028349523125],t:["Metric ton",1000]},
Area:{m2:["Square meter",1],km2:["Square kilometer",1e6],cm2:["Square centimeter",1e-4],ha:["Hectare",10000],acre:["Acre",4046.8564224],ft2:["Square foot",.09290304],in2:["Square inch",.00064516]},
Volume:{l:["Liter",1],ml:["Milliliter",.001],m3:["Cubic meter",1000],cup:["US cup",.2365882365],tbsp:["US tablespoon",.01478676478],tsp:["US teaspoon",.004928921594],gal:["US gallon",3.785411784],floz:["US fluid ounce",.02957352956]},
Speed:{ms:["Meter/second",1],kmh:["Kilometer/hour",.2777777778],mph:["Mile/hour",.44704],knot:["Knot",.5144444444]},
Time:{s:["Second",1],min:["Minute",60],h:["Hour",3600],day:["Day",86400],week:["Week",604800],year:["Year",31557600]},
Data:{B:["Byte",1],KB:["Kilobyte",1000],MB:["Megabyte",1e6],GB:["Gigabyte",1e9],TB:["Terabyte",1e12],KiB:["Kibibyte",1024],MiB:["Mebibyte",1048576],GiB:["Gibibyte",1073741824]},
Temperature:{C:["Celsius",null],F:["Fahrenheit",null],K:["Kelvin",null]}
};
let category="Length";
const $=id=>document.getElementById(id);
function buildCats(){$("cats").innerHTML=Object.keys(DATA).map(c=>`<button class="cat ${c===category?"active":""}" data-c="${c}">${c}</button>`).join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{category=b.dataset.c;buildCats();buildUnits();convert()})}
function buildUnits(){const keys=Object.keys(DATA[category]);const html=keys.map(k=>`<option value="${k}">${DATA[category][k][0]} (${k})</option>`).join("");$("fromUnit").innerHTML=html;$("toUnit").innerHTML=html;if(keys.length>1)$("toUnit").selectedIndex=1}
function temp(v,u,to){let c=u==="C"?v:u==="F"?(v-32)*5/9:v-273.15;return to==="C"?c:to==="F"?c*9/5+32:c+273.15}
function fmt(n){if(!Number.isFinite(n))return "";let a=Math.abs(n);if((a!==0&&a<1e-6)||a>=1e12)return n.toExponential(8);return Number(n.toPrecision(12)).toString()}
function convert(){const v=parseFloat($("fromValue").value),fu=$("fromUnit").value,tu=$("toUnit").value;if(Number.isNaN(v)){ $("toValue").value="";$("result").textContent="";return}let out;if(category==="Temperature")out=temp(v,fu,tu);else out=v*DATA[category][fu][1]/DATA[category][tu][1];let f=fmt(out);$("toValue").value=f;$("result").textContent=`${fmt(v)} ${fu} = ${f} ${tu}`;$("formula").textContent=category==="Temperature"?"Temperature conversion":"Converted through the category base unit"}
$("swap").onclick=()=>{let a=$("fromUnit").value,b=$("toUnit").value;$("fromUnit").value=b;$("toUnit").value=a;let v=$("toValue").value;$("fromValue").value=v||1;convert()};
["fromValue","fromUnit","toUnit"].forEach(id=>$(id).addEventListener("input",convert));
$("copy").onclick=()=>navigator.clipboard?.writeText($("result").textContent);
$("reset").onclick=()=>{$("fromValue").value=1;buildUnits();convert()};
buildCats();buildUnits();convert();
</script></body></html>
