  avatar           : "profile.jpg"
  name             : "Sercan Külcü"
  pronouns         : # example: "she/her"  
  bio              : "Assistant Professor, Computer Engineering, Giresun University"
  location         : "Giresun / Turkey"
  employer         : 
  uri              : # URL
  email            : "sercankulcu@gmail.com"

