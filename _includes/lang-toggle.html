<style>
  html:not([data-lang="en"]) [data-lt="en"], html[data-lang="en"] [data-lt="tr"] { display: none !important; }
  .lt-bar { display: flex; justify-content: flex-end; margin: 0 0 .5em; }
  .lt-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; line-height: 1;
            padding: .45em .8em; border: 1px solid rgba(127, 127, 127, .55); border-radius: 999px;
            background: transparent; color: inherit; cursor: pointer; }
  .lt-btn:hover, .lt-btn:focus-visible { border-color: currentColor; background: rgba(127, 127, 127, .15); }
  .lt-btn__globe { font-size: 1.1em; }
</style>
<script>
(function () {
  var d = document.documentElement, l = null, k = "sk-lang";
  try { var q = new URLSearchParams(location.search).get("lang"); if (q === "tr" || q === "en") { l = q; } } catch (e) {}
  if (!l) { try { var s = localStorage.getItem(k); if (s === "tr" || s === "en") { l = s; } } catch (e) {} }
  if (!l) {
    var a = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
    l = "en";
    for (var i = 0; i < a.length; i++) {
      var c = String(a[i]).toLowerCase().slice(0, 2);
      if (c === "tr" || c === "en") { l = c; break; }
    }
  }
  d.setAttribute("data-lang", l);
  d.setAttribute("lang", l);
})();
</script>
<div class="lt-bar">
  <button type="button" class="lt-btn" id="lt-btn">
    <span class="lt-btn__globe" aria-hidden="true">🌐</span>
    <span data-lt="tr" lang="en">English</span>
    <span data-lt="en" lang="tr">Türkçe</span>
  </button>
</div>
<script>
(function () {
  var d = document.documentElement, k = "sk-lang", b = document.getElementById("lt-btn");
  function apply(l) {
    d.setAttribute("data-lang", l);
    d.setAttribute("lang", l);
    b.setAttribute("aria-label", l === "tr" ? "Switch to English" : "Türkçeye geç");
  }
  apply(d.getAttribute("data-lang") === "en" ? "en" : "tr");
  b.addEventListener("click", function () {
    var l = d.getAttribute("data-lang") === "en" ? "tr" : "en";
    try { localStorage.setItem(k, l); } catch (e) {}
    try {
      var u = new URL(location.href);
      if (u.searchParams.has("lang")) { u.searchParams.set("lang", l); history.replaceState(null, "", u.toString()); }
    } catch (e) {}
    apply(l);
  });
})();
</script>
