<!-- Support for MathJax -->
<script>
  // Source math is written as kramdown math: $$ ... $$
  // kramdown consumes those delimiters before MathJax sees them, and hands us either
  //   <script type="math/tex">        (math_engine: mathjax, the default)
  //   <div class="math"> / <span class="math">   (math_engine: null)
  // Neither form is understood by MathJax 3+, so re-wrap both in \( \) / \[ \]
  // before typesetting. Single "$" is deliberately not a delimiter, so prices
  // like $1000 in the prose are left alone.
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    startup: {
      pageReady: function () {
        try {
          document.querySelectorAll('script[type^="math/tex"]').forEach(function (s) {
            var display = /mode=display/.test(s.getAttribute('type') || '');
            var el = document.createElement(display ? 'div' : 'span');
            el.textContent = display ? '\\[' + s.textContent + '\\]'
                                     : '\\(' + s.textContent + '\\)';
            s.parentNode.replaceChild(el, s);
          });
          document.querySelectorAll('div.math, span.math').forEach(function (e) {
            var display = e.tagName === 'DIV';
            e.textContent = display ? '\\[' + e.textContent + '\\]'
                                    : '\\(' + e.textContent + '\\)';
          });
        } catch (err) {
          // never let the re-wrap stop MathJax from running
        }
        return MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
