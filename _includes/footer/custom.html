<!-- Support for MathJax.
     Math is written in the sources as kramdown math ($$ ... $$); kramdown renders
     it as \( ... \) and \[ ... \], which are MathJax's own default delimiters, so
     no extra configuration is needed here.
     Do not add a // line comment to an inline script on this site: the compress
     layout collapses the script onto one line and the comment eats the rest. -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
