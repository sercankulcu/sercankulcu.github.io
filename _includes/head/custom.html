{% include base_path %}

<!-- start custom head snippets -->

<script>
(function () {
  var STORAGE_KEY = "site-theme";
  var savedTheme = null;

  try {
    savedTheme = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    savedTheme = null;
  }

  var prefersDark =
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;

  var theme =
    (savedTheme === "dark" || savedTheme === "light")
      ? savedTheme
      : (prefersDark ? "dark" : "light");

  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<meta
  id="theme-color-meta"
  name="theme-color"
  content="#ffffff">

<link
  rel="stylesheet"
  href="{{ base_path }}/assets/css/academicons.css">

<link

<link

  sizes="192x192"

<link
  rel="manifest"
  href="{{ base_path }}/manifest.json">


<script>
document.addEventListener("DOMContentLoaded", function () {
  var STORAGE_KEY = "site-theme";
  var root = document.documentElement;
  var button = document.getElementById("theme-toggle");
  var meta = document.getElementById("theme-color-meta");

  function getTheme() {
    return root.getAttribute("data-theme") || "light";
  }

  function updateUI() {
    var dark = getTheme() === "dark";

    if (button) {
      var icon = button.querySelector(".theme-toggle__icon");

      if (icon) {
        icon.textContent = dark ? "☀️" : "🌙";
      }

      var label =
        dark
          ? "Switch to light mode"
          : "Switch to dark mode";

      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    }

    if (meta) {
      meta.setAttribute(
        "content",
        dark ? "#121212" : "#ffffff"
      );
    }
  }

  function setTheme(theme, save) {
    root.setAttribute("data-theme", theme);

    if (save) {
      try {
        localStorage.setItem(STORAGE_KEY, theme);
      } catch (e) {
        // Ignore localStorage errors.
      }
    }

    updateUI();
  }

  if (button) {
    button.addEventListener("click", function () {
      var nextTheme =
        getTheme() === "dark"
          ? "light"
          : "dark";

      setTheme(nextTheme, true);
    });
  }

  updateUI();
});
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker
      .getRegistration("/")
      .then(function (existingRegistration) {

        if (existingRegistration) {
          console.log(
            "Service worker has already registered:",
            existingRegistration.scope
          );
          return null;
        }

        return navigator.serviceWorker.register(
          "/service-worker.js",
          { scope: "/" }
        );
      })
      .then(function (registration) {

        if (registration) {
          console.log(
            "Service worker registered:",
            registration.scope
          );
        }

      })
      .catch(function (error) {

        console.error(
          "Service worker registration failed:",
          error
        );

      });
  });
}
</script>
