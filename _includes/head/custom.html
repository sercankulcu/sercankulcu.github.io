{% include base_path %}

<!-- start custom head snippets -->

<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<link rel="icon"
      type="image/x-icon"
      href="{{ base_path }}/assets/icons/favicon.ico">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="{{ base_path }}/assets/icons/icon-192.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="{{ base_path }}/assets/icons/icon-512.png">

<link rel="manifest"
      href="{{ base_path }}/manifest.json">

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const existingRegistration =
          await navigator.serviceWorker.getRegistration("/");

        if (existingRegistration) {
          console.log(
            "Service worker has already registered:",
            existingRegistration.scope
          );
          return;
        }

        const registration =
          await navigator.serviceWorker.register(
            "/service-worker.js",
            { scope: "/" }
          );

        console.log(
          "Service worker registered:",
          registration.scope
        );
      } catch (error) {
        console.error(
          "Service worker registration failed:",
          error
        );
      }
    });
  }
</script>


<!-- end custom head snippets -->
