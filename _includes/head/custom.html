<!-- =========================================================
     THEME BOOTSTRAP
     Applies the stored or OS colour scheme before the first paint, so dark mode
     users do not see a white flash while main.min.js is still downloading.
     /assets/js/_main.js keeps the same rule and takes over once jQuery is ready.
     Do not add a // line comment to an inline script on this site: the compress
     layout collapses the script onto one line and the comment eats the rest.
     ========================================================= -->

<script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    var dark = (stored === "dark") ||
      (stored !== "light" && window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* private mode or blocked storage: keep the default theme */ }
})();
</script>

<!-- =========================================================
     SERVICE WORKER
     ========================================================= -->

<script>
if ("serviceWorker" in navigator) {

  window.addEventListener("load", function () {

    navigator.serviceWorker
      .getRegistration("/")
      .then(function (existingRegistration) {

        if (existingRegistration) {

          console.log(
            "Service worker has already registered:",
            existingRegistration.scope
          );

          return null;
        }

        return navigator.serviceWorker.register(
          "/service-worker.js",
          { scope: "/" }
        );

      })
      .then(function (registration) {

        if (registration) {

          console.log(
            "Service worker registered:",
            registration.scope
          );

        }

      })
      .catch(function (error) {

        console.error(
          "Service worker registration failed:",
          error
        );

      });

  });

}
</script>
