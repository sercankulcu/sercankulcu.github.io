<!-- =========================================================
     THEME INITIALIZATION
     ========================================================= -->

<script>
(function () {
  var savedTheme = null;

  try {
    savedTheme = localStorage.getItem("site-theme");
  } catch (e) {
    savedTheme = null;
  }

  var prefersDark =
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;

  var theme =
    (savedTheme === "dark" || savedTheme === "light")
      ? savedTheme
      : (prefersDark ? "dark" : "light");

  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<!-- =========================================================
     THEME TOGGLE
     ========================================================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {

  var root = document.documentElement;
  var button = document.getElementById("theme-toggle");
  var meta = document.getElementById("theme-color-meta");

  if (!button) {
    console.error("Theme toggle button NOT FOUND");
    return;
  }

  function getTheme() {
    return root.getAttribute("data-theme") || "light";
  }

  function updateThemeInterface() {
    var dark = getTheme() === "dark";

    var icon =
      button.querySelector(".theme-toggle__icon");

    if (icon) {
      icon.textContent = dark ? "☀️" : "🌙";
    }

    var label =
      dark
        ? "Switch to light mode"
        : "Switch to dark mode";

    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);

    if (meta) {
      meta.setAttribute(
        "content",
        dark ? "#121212" : "#ffffff"
      );
    }
  }

  button.addEventListener("click", function () {

    var currentTheme = getTheme();

    var nextTheme =
      currentTheme === "dark"
        ? "light"
        : "dark";

    root.setAttribute("data-theme", nextTheme);

    try {
      localStorage.setItem(
        "site-theme",
        nextTheme
      );
    } catch (e) {
      console.error(
        "localStorage error:",
        e
      );
    }

    updateThemeInterface();

    console.log(
      "Theme changed to:",
      nextTheme
    );
  });

  updateThemeInterface();

});
</script>


<!-- =========================================================
     SERVICE WORKER
     ========================================================= -->

<script>
if ("serviceWorker" in navigator) {

  window.addEventListener("load", function () {

    navigator.serviceWorker
      .getRegistration("/")
      .then(function (existingRegistration) {

        if (existingRegistration) {

          console.log(
            "Service worker has already registered:",
            existingRegistration.scope
          );

          return null;
        }

        return navigator.serviceWorker.register(
          "/service-worker.js",
          { scope: "/" }
        );

      })
      .then(function (registration) {

        if (registration) {

          console.log(
            "Service worker registered:",
            registration.scope
          );

        }

      })
      .catch(function (error) {

        console.error(
          "Service worker registration failed:",
          error
        );

      });

  });

}
</script>
