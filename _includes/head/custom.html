{% include base_path %}

<!-- =========================================================
     THEME BOOTSTRAP
     Applies the stored or OS colour scheme before the first paint, so dark mode
     users do not see a white flash while main.min.js is still downloading.
     /assets/js/_main.js keeps the same rule and takes over once jQuery is ready.
     Do not add a // line comment to an inline script on this site: the compress
     layout collapses the script onto one line and the comment eats the rest.
     ========================================================= -->

<script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    var dark = (stored === "dark") ||
      (stored !== "light" && window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* private mode or blocked storage: keep the default theme */ }
})();
</script>

<!-- start custom head snippets -->

<!-- Google Scholar (Highwire Press) tags: a page lists them in its front matter as
     scholar_meta: [[citation_title, "..."], ...] (not citation: the theme prints that as
     "Recommended citation"); tools/make_pdf_pages.py writes such pages -->
{% if page.scholar_meta %}{% for c in page.scholar_meta %}<meta name="{{ c[0] }}" content="{{ c[1] | escape }}">
{% endfor %}{% endif %}

<!-- schema.org JSON-LD: book, paper and thesis pages carry it ready-made in front matter
     (json_ld, written by tools/make_pdf_pages.py); course pages get a Course built here -->
{% if page.json_ld %}<script type="application/ld+json">{{ page.json_ld }}</script>
{% endif %}
{% if page.collection == "teaching" %}
{% assign course_desc = page.excerpt | markdownify | strip_html | strip_newlines | strip %}
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "Course",
 "name": {{ page.title | jsonify }},
 "description": {{ course_desc | jsonify }},
 "url": {{ page.url | absolute_url | jsonify }},
 {% if page.og_image %}"image": {{ page.og_image | jsonify }},{% endif %}
 "inLanguage": {{ page.course_language | default: "tr" | jsonify }},
 "educationalLevel": {{ page.type | default: "Undergraduate" | jsonify }},
 "isAccessibleForFree": true,
 "provider": {"@type": "CollegeOrUniversity", "name": "Giresun University", "sameAs": "https://www.giresun.edu.tr"},
 "hasCourseInstance": {"@type": "CourseInstance", "courseMode": "Onsite",
   "location": {{ page.location | default: "Giresun, Turkey" | jsonify }},
   "instructor": {"@type": "Person", "name": "Sercan Külcü", "url": {{ "/" | absolute_url | jsonify }}}}
 {% if page.textbook %}, "workExample": {"@type": "Book", "name": {{ page.textbook.name | jsonify }}, "url": {{ page.textbook.url | absolute_url | jsonify }}}{% endif %}}
</script>
{% endif %}

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">

<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/manifest.json"/>
<link rel="icon" href="/assets/icons/favicon.ico"/>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#474747" media="(prefers-color-scheme: dark)"/>

<!-- end custom head snippets -->

<!-- =========================================================
     SERVICE WORKER
     ========================================================= -->

<script>
if ("serviceWorker" in navigator) {

  window.addEventListener("load", function () {

    navigator.serviceWorker
      .getRegistration("/")
      .then(function (existingRegistration) {

        if (existingRegistration) {

          console.log(
            "Service worker has already registered:",
            existingRegistration.scope
          );

          return null;
        }

        return navigator.serviceWorker.register(
          "/service-worker.js",
          { scope: "/" }
        );

      })
      .then(function (registration) {

        if (registration) {

          console.log(
            "Service worker registered:",
            registration.scope
          );

        }

      })
      .catch(function (error) {

        console.error(
          "Service worker registration failed:",
          error
        );

      });

  });

}
</script>
